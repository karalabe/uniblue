<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 296" width="1160" height="296" role="img" aria-label="How UniBlue works: Map Your Network, Probe LAN Safely, Weigh Real Impact, Act on What Changes">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .step { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; }
      .title { font-size: 16.5px; font-weight: 700; fill: #F0F6FC; }
      .sub { font-size: 11.5px; font-weight: 400; fill: #8B949E; }
      .pill { font-size: 11px; fill: #E6EDF3; }
      .pill-b { font-weight: 700; }
      .pill-m { fill: #8B949E; }
    </style>
  </defs>

  <!-- Card 1: UniFi Topology -->
  <g transform="translate(8,8)">
    <rect width="256" height="280" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.25"/>
    <rect x="18" y="18" width="42" height="5" rx="2.5" fill="#3B82F6"/>
    <text x="18" y="42" class="font step" fill="#60A5FA">01 · UNIFI TOPOLOGY</text>
    <text x="18" y="66" class="font title">Map Your Network</text>
    <text x="18" y="86" class="font sub">UDM Pro · Cloud Key · Network App</text>

    <rect x="18" y="110" width="220" height="42" rx="10" fill="#0D1117" stroke="#1F3A5F" stroke-width="1.2"/>
    <text x="128" y="135" text-anchor="middle" class="font pill"><tspan class="pill-b">Active Clients</tspan><tspan class="pill-m" dx="4">·</tspan><tspan class="pill-m" dx="4">IPs &amp; MACs</tspan></text>

    <rect x="18" y="162" width="220" height="42" rx="10" fill="#0D1117" stroke="#1F3A5F" stroke-width="1.2"/>
    <text x="128" y="187" text-anchor="middle" class="font pill"><tspan class="pill-b">VLANs &amp; Subnets</tspan><tspan class="pill-m" dx="4">·</tspan><tspan class="pill-m" dx="4">Trust Tiers</tspan></text>

    <rect x="18" y="214" width="220" height="42" rx="10" fill="#0D1117" stroke="#1F3A5F" stroke-width="1.2"/>
    <text x="128" y="239" text-anchor="middle" class="font pill"><tspan class="pill-b">WAN Forwards</tspan><tspan class="pill-m" dx="4">·</tspan><tspan class="pill-m" dx="4">Firmware</tspan></text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g stroke="#3B82F6" fill="#3B82F6">
    <line x1="270" y1="148" x2="292" y2="148" stroke-width="2.25" stroke-linecap="round"/>
    <polygon points="298,148 289,142.5 289,153.5"/>
  </g>

  <!-- Card 2: Community Checks -->
  <g transform="translate(304,8)">
    <rect width="256" height="280" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.25"/>
    <rect x="18" y="18" width="42" height="5" rx="2.5" fill="#A855F7"/>
    <text x="18" y="42" class="font step" fill="#C084FC">02 · COMMUNITY CHECKS</text>
    <text x="18" y="66" class="font title">Probe LAN Safely</text>
    <text x="18" y="86" class="font sub">Declarative YAML · Read-Only</text>

    <rect x="18" y="110" width="220" height="42" rx="10" fill="#0D1117" stroke="#3B2667" stroke-width="1.2"/>
    <text x="128" y="135" text-anchor="middle" class="font pill"><tspan class="pill-b">Exposed Ports</tspan><tspan class="pill-m" dx="4">·</tspan><tspan class="pill-m" dx="4">VNC, Telnet, MQTT</tspan></text>

    <rect x="18" y="162" width="220" height="42" rx="10" fill="#0D1117" stroke="#3B2667" stroke-width="1.2"/>
    <text x="128" y="187" text-anchor="middle" class="font pill"><tspan class="pill-b">IoT &amp; HVAC</tspan><tspan class="pill-m" dx="4">·</tspan><tspan class="pill-m" dx="4">Community YAML</tspan></text>

    <rect x="18" y="214" width="220" height="42" rx="10" fill="#1E1433" stroke="#6D28D9" stroke-width="1.2"/>
    <text x="128" y="239" text-anchor="middle" class="font pill" fill="#DDD6FE"><tspan class="pill-b" fill="#DDD6FE">Sandboxed</tspan><tspan fill="#C4B5FD" dx="4">·</tspan><tspan fill="#C4B5FD" dx="4">Target-IP &amp; Gentle</tspan></text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g stroke="#A855F7" fill="#A855F7">
    <line x1="566" y1="148" x2="588" y2="148" stroke-width="2.25" stroke-linecap="round"/>
    <polygon points="594,148 585,142.5 585,153.5"/>
  </g>

  <!-- Card 3: Blast Radius -->
  <g transform="translate(600,8)">
    <rect width="256" height="280" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.25"/>
    <rect x="18" y="18" width="42" height="5" rx="2.5" fill="#F59E0B"/>
    <text x="18" y="42" class="font step" fill="#FBBF24">03 · BLAST RADIUS</text>
    <text x="18" y="66" class="font title">Weigh Real Impact</text>
    <text x="18" y="86" class="font sub">Finding × UniFi Placement</text>

    <rect x="18" y="110" width="220" height="42" rx="10" fill="#2B1418" stroke="#7F1D1D" stroke-width="1.2"/>
    <text x="128" y="135" text-anchor="middle" class="font pill" fill="#FECACA"><tspan class="pill-b" fill="#FECACA">WAN Forward</tspan><tspan fill="#FCA5A5" dx="5">→</tspan><tspan class="pill-b" fill="#F87171" dx="5">CRITICAL</tspan></text>

    <rect x="18" y="162" width="220" height="42" rx="10" fill="#2A200E" stroke="#78350F" stroke-width="1.2"/>
    <text x="128" y="187" text-anchor="middle" class="font pill" fill="#FDE68A"><tspan class="pill-b" fill="#FDE68A">Trusted VLAN</tspan><tspan fill="#FCD34D" dx="5">→</tspan><tspan class="pill-b" fill="#FBBF24" dx="5">Escalated +1</tspan></text>

    <rect x="18" y="214" width="220" height="42" rx="10" fill="#10261A" stroke="#14532D" stroke-width="1.2"/>
    <text x="128" y="239" text-anchor="middle" class="font pill" fill="#BBF7D0"><tspan class="pill-b" fill="#BBF7D0">Isolated IoT</tspan><tspan fill="#86EFAC" dx="5">→</tspan><tspan class="pill-b" fill="#4ADE80" dx="5">Contained -1</tspan></text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g stroke="#F59E0B" fill="#F59E0B">
    <line x1="862" y1="148" x2="884" y2="148" stroke-width="2.25" stroke-linecap="round"/>
    <polygon points="890,148 881,142.5 881,153.5"/>
  </g>

  <!-- Card 4: Zero-Noise Alerts -->
  <g transform="translate(896,8)">
    <rect width="256" height="280" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.25"/>
    <rect x="18" y="18" width="42" height="5" rx="2.5" fill="#10B981"/>
    <text x="18" y="42" class="font step" fill="#34D399">04 · ZERO-NOISE ALERTS</text>
    <text x="18" y="66" class="font title">Act on What Changes</text>
    <text x="18" y="86" class="font sub">Diffed Against Baseline State</text>

    <rect x="18" y="110" width="220" height="42" rx="10" fill="#0D1117" stroke="#194D33" stroke-width="1.2"/>
    <text x="128" y="135" text-anchor="middle" class="font pill"><tspan class="pill-b">New or Escalated Risks</tspan></text>

    <rect x="18" y="162" width="220" height="42" rx="10" fill="#0D1117" stroke="#194D33" stroke-width="1.2"/>
    <text x="128" y="187" text-anchor="middle" class="font pill"><tspan class="pill-b">Rogue Devices &amp; Forwards</tspan></text>

    <rect x="18" y="214" width="220" height="42" rx="10" fill="#0D281E" stroke="#059669" stroke-width="1.2"/>
    <text x="128" y="239" text-anchor="middle" class="font pill" fill="#A7F3D0"><tspan class="pill-b" fill="#A7F3D0">CLI · ntfy · Discord · Slack · JSON</tspan></text>
  </g>
</svg>
