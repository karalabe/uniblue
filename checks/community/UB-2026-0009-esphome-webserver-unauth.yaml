id: UB-2026-0009
title: ESPHome Unauthenticated Embedded Web Server
cve: null
category: unauth-control
severity: high
safety: read-only
supersedes: ["UB-0006"]

metadata:
  vendor: ESPHome
  product: ESPHome Web Server Component
  affected_versions: any (when web_server is enabled without auth)
  author: "@karalabe"
  references:
    - https://esphome.io/components/web_server.html

preconditions:
  ports_any: [80]
  http_status_any: [200]

probe:
  type: http
  method: GET
  path: /
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - "<esp-app"
    redact_body: true

remediation:
  summary: >
    ESPHome's optional web_server component is enabled without HTTP
    authentication. Any host on the LAN can inspect live sensor/log streams via
    /events, toggle switches/relays, or upload OTA firmware if OTA web upload
    is enabled. Configure web_server.auth or remove web_server altogether and
    rely on ESPHome's encrypted native API for Home Assistant.
  unifi_actions:
    - disable_esphome_web_server_or_add_auth
    - move_to_iot_vlan
    - block_wan_egress
