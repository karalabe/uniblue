id: UB-2026-0003
title: Intel AMT / vPro Out-of-Band Management Interface
cve: CVE-2017-5689
category: oob-bmc
severity: high
safety: read-only

metadata:
  vendor: Intel
  product: Intel Active Management Technology (AMT / vPro)
  affected_versions: Systems with Intel AMT ports 16992/16993 reachable on LAN
  author: "@karalabe"
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2017-5689

preconditions:
  ports_any: [16992, 16993]
  hostname_regex: "(?i)(amt|vpro|bmc|ipmi|server|workstation|desktop|nuc|optiplex|thinkcentre|elitedesk|prodesk|nas|console|mgmt)"

probe:
  type: http
  method: GET
  path: /logon.htm
  timeout: 3s
  match:
    status: [200, 401]
    body_regex: "(?i)(Intel.{0,12}Active Management Technology|Intel\\(R\\) AMT)"

grants:
  - effect: control
    basis: conditional
    requires: Intel AMT credentials to control power or remote KVM

remediation:
  summary: >
    Intel AMT / vPro provides below-OS out-of-band power, BIOS, and KVM
    control beneath the host OS and has suffered severe authentication bypasses
    (CVE-2017-5689). Disable Intel AMT in BIOS/MEBx if unused, update Intel ME
    firmware, or restrict ports 16992/16993 to an isolated management VLAN.
  unifi_actions:
    - disable_intel_amt_or_isolate_vlan
    - update_bios_and_me_firmware
