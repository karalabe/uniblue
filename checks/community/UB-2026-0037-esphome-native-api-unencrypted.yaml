id: UB-2026-0037
title: ESPHome Native API Advertised Without Transport Encryption
cve: null
category: exposed-protocol
severity: medium
safety: read-only

metadata:
  vendor: ESPHome
  product: ESPHome Native API Node (Port 6053)
  affected_versions: Nodes configured without api.encryption.key
  author: "@karalabe"
  references:
    - https://esphome.io/components/api.html

preconditions:
  mdns_type_any: ["_esphomelib._tcp"]
  mdns_txt_regex: "(?i)^api_encryption=none$"

probe:
  type: observe

remediation:
  summary: >
    ESPHome node advertised its native API on port 6053 without Noise protocol
    encryption (api_encryption=none). Any host on the LAN can connect to read
    sensors or trigger relays/garage doors. Add an api.encryption.key in your
    ESPHome YAML and move IoT nodes to an isolated VLAN.
  unifi_actions:
    - enable_esphome_api_encryption
    - move_to_iot_vlan
