id: UB-2026-0036
title: Unencrypted ESPHome Native API Advertised
cve: null
category: exposed-protocol
severity: medium
safety: read-only

metadata:
  vendor: ESPHome
  product: ESPHome Native API Node (Port 6053)
  affected_versions: Nodes configured without api.encryption.key
  author: "@karalabe"
  references:
    - https://esphome.io/components/api.html

preconditions:
  mdns_type_any: ["_esphomelib._tcp"]
  mdns_txt_not_regex: "(?i)^api_encryption=(noise_|tls|true|1|yes)"

probe:
  type: observe

grants:
  - effect: read
    basis: conditional
    requires: the unencrypted ESPHome port accepts connections without a password
  - effect: control
    basis: conditional
    requires: the ESPHome device exposes switches, relays, or locks without encryption

remediation:
  summary: >
    ESPHome node advertised its native API on port 6053 without Noise protocol
    encryption (no active api_encryption TXT attribute). Any host on the LAN can
    connect to read sensors or trigger relays/garage doors. Add an
    api.encryption.key in your ESPHome YAML and move IoT nodes to an isolated VLAN.
  unifi_actions:
    - enable_esphome_api_encryption
    - move_to_iot_vlan
