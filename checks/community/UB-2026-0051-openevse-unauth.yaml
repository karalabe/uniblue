id: UB-2026-0051
title: Unauthenticated OpenEVSE Charger Control API
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: OpenEVSE
  product: OpenEVSE Wi-Fi EV Charging Station
  affected_versions: ESP8266 / ESP32 Wi-Fi firmware without HTTP auth
  author: "@karalabe"
  references:
    - https://github.com/OpenEVSE/ESP32_WiFi_V4.x

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /status
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"pilot":'
      - '"amp":'
      - '"wh":'
      - '"temp1":'
    redact_body: true

remediation:
  summary: >
    OpenEVSE Wi-Fi controller exposes /status and configuration/control
    endpoints without HTTP authentication. Any LAN host can override charging
    state, change pilot amperage, or modify Wi-Fi/MQTT settings. Enable HTTP
    authentication in OpenEVSE System settings and move the charger to an
    isolated IoT VLAN.
  unifi_actions:
    - enable_openevse_http_auth
    - move_to_iot_vlan
    - block_wan_egress
