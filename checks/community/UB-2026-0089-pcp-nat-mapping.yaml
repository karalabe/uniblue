id: UB-2026-0089
title: Port Control Protocol (PCP v2) Dynamic NAT Listener Active
cve: null
category: service-inventory
claim: service-observed
property: pcp-v2-listener
severity: info
safety: read-only

metadata:
  vendor: Generic
  product: RFC 6887 Port Control Protocol (PCP)
  affected_versions: any
  author: "@karalabe"
  references:
    - https://datatracker.ietf.org/doc/html/rfc6887

preconditions:
  ports_any: [80, 443, 53]
  hostname_regex: "(?i)(gw|gateway|router|udm|ucg|uxg|usg)"
  discovery_only: true

probe:
  type: pcp
  port: 5351
  timeout: 2s

remediation:
  summary: >
    A PCP v2 listener responded to a read-only ANNOUNCE query on UDP 5351.
    Ensure untrusted IoT and guest VLANs cannot request dynamic NAT mappings.
  unifi_actions:
    - restrict_upnp_segments
