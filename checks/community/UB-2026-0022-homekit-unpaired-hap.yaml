id: UB-2026-0022
title: Unpaired HomeKit HAP Accessory Advertised
cve: null
category: unauth-control
claim: service-advertised
severity: high
safety: read-only

metadata:
  vendor: Generic (HomeKit / Matter / Homebridge)
  product: HomeKit Accessory Protocol (HAP) Device
  affected_versions: Any HAP accessory advertising an odd sf bitmask (bit 0 set, e.g. sf=1, sf=3, sf=5)
  author: "@karalabe"
  references:
    - https://developer.apple.com/homekit/

preconditions:
  mdns_type_any: ["_hap._tcp"]
  mdns_txt_regex: "(?i)^sf=[0-9]*[13579]$"

probe:
  type: observe

remediation:
  summary: >
    Device is advertising an unpaired HomeKit HAP status flag (sf bit 0 set,
    such as sf=1, sf=3, or sf=5) over mDNS. Any user on the same Wi-Fi network
    can pair with and claim administrative control over an unpaired smart lock,
    camera, bridge, or switch. Complete pairing immediately or move the device
    to an isolated IoT VLAN.
  unifi_actions:
    - pair_homekit_accessory_or_disable_hap
    - move_to_iot_vlan
