id: UB-2026-0021
title: Thread Border Router Discovered
cve: null
category: service-inventory
claim: service-advertised
property: thread-border-router-identity
severity: info
safety: read-only

metadata:
  vendor: Thread Group / OpenThread
  product: Thread Border Router (MeshCoP)
  affected_versions: any
  author: "@karalabe"
  references:
    - https://openthread.io/codelabs/openthread-border-router

preconditions:
  mdns_type_any: ["_meshcop._udp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Thread Border Router advertised MeshCoP service on _meshcop._udp"

grants: []

remediation:
  summary: >
    A Thread Border Router was discovered on the local network. Multiple border
    routers on the same segment are normal; confirm it sits on the intended
    smart-home VLAN and that controller-to-device IPv6 routes are preserved.
  unifi_actions:
    - verify_thread_border_router_vlan
