id: UB-2026-0039
title: Unencrypted Zehnder ComfoConnect LAN C Control Interface
cve: null
category: unauth-control
claim: service-observed
severity: high
safety: read-only

metadata:
  vendor: Zehnder
  product: ComfoConnect LAN C Ventilation Bridge
  affected_versions: any
  author: "@karalabe"
  references:
    - https://github.com/michaelarnauts/aiocomfoconnect

preconditions:
  ports_any: [56747]
  mac_prefix: ["14:4f:d7"]
  hostname_regex: "(?i)(zehnder|comfoconnect|comfoair|ventilation)"

probe:
  type: comfoconnect
  port: 56747
  timeout: 3s

grants:
  - effect: control
    basis: conditional
    requires: the ComfoConnect bridge accepts a client pairing or PIN to control ventilation

remediation:
  summary: >
    The ComfoConnect LAN C control port is reachable. The bridge uses TCP
    port 56747 for cleartext ventilation control and UDP on the same port for
    discovery. The read-only check leaves app registration, the PIN, and
    control permissions untested. Set a non-default PIN, isolate the bridge
    on an IoT VLAN, and restrict port 56747 to the ventilation controller.
  unifi_actions:
    - set_custom_pin_on_device
    - move_to_iot_vlan
    - restrict_port_56747_to_controller
    - block_wan_egress
