id: UB-2026-0015
title: Unauthenticated Frigate NVR Internal API
cve: null
category: info-disclosure
severity: high
safety: read-only

metadata:
  vendor: Frigate
  product: Frigate NVR
  affected_versions: any (when internal port 5000 is exposed to LAN)
  author: "@karalabe"
  references:
    - https://docs.frigate.video/configuration/authentication/

preconditions:
  ports_any: [5000]

probe:
  type: http
  method: GET
  path: /api/config
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"cameras":'
      - '"detectors":'
      - '"mqtt":'
    redact_body: true

grants:
  - effect: read
    basis: proven
    note: Frigate exposed camera and MQTT config without login
  - effect: secrets
    basis: conditional
    requires: Frigate config includes camera or MQTT passwords

remediation:
  summary: >
    Frigate's unauthenticated internal API port (5000) is reachable across the
    LAN, bypassing authentication on port 8971 and exposing live camera
    snapshots, recordings, and NVR configuration. Publish only the
    authenticated port 8971 to the LAN and keep port 5000 bound to 127.0.0.1
    or an internal Docker network.
  unifi_actions:
    - unpublish_frigate_port_5000
    - restrict_inter_vlan_access
