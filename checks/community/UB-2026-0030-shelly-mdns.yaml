id: UB-2026-0030
title: Shelly Smart Relay / Plug Discovered
cve: null
category: service-inventory
claim: service-advertised
property: shelly-mdns-identity
severity: info
safety: read-only

metadata:
  vendor: Shelly (Allterco)
  product: Shelly Smart Relay / Energy Monitor
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/shelly/

preconditions:
  mdns_type_any: ["_shelly._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Shelly device advertised on _shelly._tcp (authentication posture evaluated separately by UB-2026-0031 / UB-2026-0032)"

remediation:
  summary: >
    A Shelly smart relay or plug was discovered via mDNS. Authentication posture
    is evaluated separately by the Shelly Gen1 and Gen2/Gen3 HTTP checks
    (UB-2026-0031 / UB-2026-0032).
  unifi_actions:
    - move_to_iot_vlan
