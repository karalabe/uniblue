id: UB-2026-0045
title: Victron GX Energy Controller Discovered
cve: null
category: service-inventory
claim: service-advertised
property: victron-gx-identity
severity: info
safety: read-only

metadata:
  vendor: Victron Energy
  product: Victron GX / Venus OS Gateway
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/victron_gx/

preconditions:
  upnp_device_regex: "(?i)victron"
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Victron GX energy gateway discovered via SSDP/UPnP"

grants: []

remediation:
  summary: >
    A Victron GX energy controller was discovered via SSDP/UPnP. Isolate
    inverter and battery management interfaces from guest networks while
    preserving scoped local monitoring.
  unifi_actions:
    - restrict_energy_gateway_management
