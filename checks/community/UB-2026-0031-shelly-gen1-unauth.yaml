id: UB-2026-0031
title: Unauthenticated Shelly Gen1 Control & Config API
cve: null
category: unauth-control
claim: confirmed-permission
severity: high
safety: read-only
supersedes: ["UB-0040"]

metadata:
  vendor: Shelly (Allterco)
  product: Shelly Gen1 Smart Relay / Plug
  affected_versions: Gen1 firmware with Restricted Login disabled
  author: "@karalabe"
  references:
    - https://shelly-api-docs.shelly.cloud/gen1/#settings

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /settings
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    json_match:
      - path: "$.wifi_sta"
        exists: true
      - path: "$.login.enabled"
        equals: "false"
    redact_body: true

remediation:
  summary: >
    The Shelly Gen1 /settings endpoint reports that Restricted Login is off.
    It exposes configuration such as the Wi-Fi SSID and MQTT username. Hosts
    that can reach the device can also control relays, change configuration,
    or start firmware updates without signing in. Enable "Restrict Login" in
    the Shelly web UI and isolate smart relays on a dedicated IoT VLAN.
  unifi_actions:
    - enable_shelly_restricted_login
    - move_to_iot_vlan
    - block_wan_egress
