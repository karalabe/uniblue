id: UB-2026-0017
title: ESP32-CAM Unauthenticated Live Video & Control Interface
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: Espressif / Generic
  product: ESP32-CAM CameraWebServer
  affected_versions: Stock Arduino / ESP-IDF CameraWebServer firmware
  author: "@karalabe"
  references:
    - https://github.com/espressif/arduino-esp32/tree/master/libraries/ESP32/examples/Camera/CameraWebServer

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /status
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"framesize":'
      - '"quality":'
      - '"awb_gain":'
    redact_body: true

remediation:
  summary: >
    ESP32-CAM exposes its CameraWebServer API (/status, /capture, /stream)
    without HTTP authentication, allowing any LAN host to view live camera
    video and change sensor settings. Add HTTP authentication or switch to
    encrypted ESPHome native API, and place the camera on an isolated VLAN.
  unifi_actions:
    - enable_camera_authentication
    - move_to_camera_vlan
    - block_wan_egress
