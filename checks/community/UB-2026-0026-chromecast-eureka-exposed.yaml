id: UB-2026-0026
title: Google Chromecast / Cast Unauthenticated Local Setup API
cve: null
category: info-disclosure
severity: low
safety: read-only

metadata:
  vendor: Google
  product: Chromecast / Google TV / Cast Speaker
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/cast/

preconditions:
  ports_any: [8008]

probe:
  type: http
  method: GET
  path: /setup/eureka_info
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - '"cast_build_revision":'
      - '"mac_address":'
    redact_body: true

remediation:
  summary: >
    Google Cast device exposes its unauthenticated local setup/status API on
    port 8008, disclosing build revision, uptime, and network metadata while
    accepting unauthenticated LAN Cast sessions. Place Cast media devices on an
    isolated IoT/Media VLAN with mDNS reflection if needed.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
