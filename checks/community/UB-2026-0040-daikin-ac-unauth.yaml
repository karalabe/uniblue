id: UB-2026-0040
title: Unauthenticated Daikin Wi-Fi AC Control API
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Daikin
  product: Daikin BRP069A / BRP069B Wi-Fi Air Conditioner Adapter
  affected_versions: Local HTTP API firmware
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/daikin/

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /aircon/get_control_info
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - "ret=OK"
      - "pow="
      - "stemp="
    redact_body: true

grants:
  - effect: read
    basis: proven
    note: Daikin AC returned current power and temperature without login
  - effect: control
    basis: conditional
    requires: the Daikin AC accepts power and temperature changes without login

remediation:
  summary: >
    Daikin Wi-Fi controller exposes its cleartext HTTP HVAC control API
    (/aircon/set_control_info) without authentication. Any host on the LAN can
    power the air conditioner on/off or alter setpoints. Move the controller to
    an isolated IoT VLAN and allow port 80 strictly from your Home Assistant
    controller IP.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_port_80_to_controller
    - block_wan_egress
