id: UB-2026-0028
title: Hunter Douglas PowerView Shade Hub Discovered
cve: null
category: service-inventory
claim: service-advertised
property: powerview-hub-identity
severity: info
safety: read-only

metadata:
  vendor: Hunter Douglas
  product: PowerView Gen2 / Gen3 Shade Hub
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/hunterdouglas_powerview/

preconditions:
  mdns_type_any: ["_powerview._tcp", "_powerview-g3._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Hunter Douglas PowerView shade hub advertised via DNS-SD"

remediation:
  summary: >
    A Hunter Douglas PowerView motorized shade hub was discovered on the LAN.
    Restrict guest access to the hub API while preserving local household
    remotes and automation hubs.
  unifi_actions:
    - restrict_bridge_to_controllers
