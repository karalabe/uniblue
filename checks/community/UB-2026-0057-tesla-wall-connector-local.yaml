id: UB-2026-0057
title: Tesla Wall Connector Gen 3 Local Telemetry API Exposed
cve: null
category: info-disclosure
severity: low
safety: read-only

metadata:
  vendor: Tesla
  product: Tesla Wall Connector Gen 3
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/tesla_wall_connector/

preconditions:
  ports_any: [80]
  discovery_only: true

probe:
  type: http
  method: GET
  path: /api/1/version
  timeout: 3s
  match:
    status: [200]
    json_match:
      - path: "$.firmware_version"
        exists: true
      - path: "$.part_number"
        exists: true
    evidence_summary: "Tesla Wall Connector Gen 3 returned /api/1/version telemetry without authentication"
    redact_body: true

remediation:
  summary: >
    Tesla Wall Connector Gen 3 exposes unauthenticated local telemetry
    (/api/1/vitals, /api/1/version) indicating when an EV is plugged in or
    home. Isolate EV chargers on a dedicated IoT/Energy VLAN.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_port_80_to_controller
