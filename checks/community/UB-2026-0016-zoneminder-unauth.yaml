id: UB-2026-0016
title: Unauthenticated ZoneMinder NVR API
cve: null
category: info-disclosure
severity: high
safety: read-only

metadata:
  vendor: ZoneMinder
  product: ZoneMinder Video Surveillance NVR
  affected_versions: Deployments with OPT_USE_AUTH disabled or API unauthenticated
  author: "@karalabe"
  references:
    - https://zoneminder.readthedocs.io/en/stable/api.html

preconditions:
  ports_any: [80, 443]
  discovery_only: true

probe:
  type: http
  timeout: 3s
  steps:
    - method: GET
      paths: ["/zm/", "/"]
      match:
        status: [200]
        body_regex: '(?i)zoneminder'
        evidence_summary: "ZoneMinder web interface identified"
    - method: GET
      path: /zm/api/host/getVersion.json
      match:
        status: [200]
        headers_absent: ["WWW-Authenticate"]
        json_match:
          - path: "$.version"
            exists: true
          - path: "$.apiversion"
            exists: true
        evidence_summary: "ZoneMinder API returned version details without authentication (OPT_USE_AUTH may be off)"
        redact_body: true

grants:
  - effect: read
    basis: proven
    note: ZoneMinder API answered without login

remediation:
  summary: >
    ZoneMinder's /zm/api/host/getVersion.json endpoint responded with HTTP 200
    without credentials. Ensure OPT_USE_AUTH is enabled in ZoneMinder Options
    and restrict NVR access to trusted admin VLANs.
  unifi_actions:
    - enable_zoneminder_auth
    - restrict_inter_vlan_access
