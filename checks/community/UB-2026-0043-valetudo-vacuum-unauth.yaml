id: UB-2026-0043
title: Unauthenticated Valetudo Robot Vacuum Control API
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Valetudo
  product: Valetudo Local Robot Vacuum Firmware
  affected_versions: Default configuration (HTTP Basic Auth disabled)
  author: "@karalabe"
  references:
    - https://valetudo.cloud/pages/general/getting-started.html

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /api/v2/robot
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    json_match:
      - path: "$.manufacturer"
        exists: true
      - path: "$.modelName"
        exists: true
      - path: "$.implementation"
        regex: "ValetudoRobot"
    redact_body: true

grants:
  - effect: read
    basis: proven
    note: Valetudo exposed vacuum info without login
  - effect: control
    basis: conditional
    requires: Valetudo allows starting or steering the vacuum without login

remediation:
  summary: >
    Valetudo's REST API is accessible without HTTP Basic Authentication. Any
    LAN device can command the vacuum, trigger audio/locate alerts, download
    the complete LiDAR floorplan of your home, or modify MQTT settings. Enable
    HTTP Basic Auth in Valetudo Connectivity settings and isolate the robot on
    an IoT VLAN.
  unifi_actions:
    - enable_valetudo_http_auth
    - move_to_iot_vlan
    - block_wan_egress
