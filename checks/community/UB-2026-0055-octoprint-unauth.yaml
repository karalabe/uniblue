id: UB-2026-0055
title: Unauthenticated OctoPrint 3D Printer Control API
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: OctoPrint
  product: OctoPrint 3D Printer Server
  affected_versions: any (when access control is disabled)
  author: "@karalabe"
  references:
    - https://docs.octoprint.org/en/master/api/settings.html

preconditions:
  ports_any: [80, 5000]

probe:
  type: http
  method: GET
  path: /api/settings
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"appearance":'
      - '"printerProfiles":'
      - '"serial":'
    redact_body: true

grants:
  - effect: read
    basis: proven
    note: OctoPrint returned printer settings without login
  - effect: control
    basis: conditional
    requires: OctoPrint allows starting prints or controlling heaters without login
  - effect: configure
    basis: conditional
    requires: OctoPrint allows changing settings without login

remediation:
  summary: >
    OctoPrint returned full printer settings from /api/settings without an API
    key or session cookie, indicating Access Control is disabled. Any LAN host
    can execute G-code, control extruder/bed heaters (fire hazard), or install
    arbitrary plugins. Enable Access Control in OctoPrint and isolate 3D
    printers on a dedicated VLAN.
  unifi_actions:
    - enable_octoprint_access_control
    - move_to_iot_vlan
    - restrict_inter_vlan_access
