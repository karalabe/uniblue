id: UB-2026-0026
title: Unauthenticated Node-RED Admin Editor (No Auth)
cve: null
category: unauth-rce
claim: confirmed-permission
property: nodered-admin-noauth
severity: critical
safety: read-only
supersedes: ["UB-2026-0074"]

metadata:
  vendor: OpenJS Foundation
  product: Node-RED
  affected_versions: any (when adminAuth is unset)
  author: "@karalabe"
  references:
    - https://nodered.org/docs/api/admin/methods/get/auth/login/
    - https://nodered.org/docs/user-guide/runtime/securing-node-red

preconditions:
  ports_any: [1880]

probe:
  type: http
  timeout: 3s
  steps:
    - method: GET
      path: /flows
      match:
        status: [200]
        headers_absent: ["WWW-Authenticate"]
        body_contains_any: ['"type":"tab"', '[]']
        evidence_summary: "Node-RED served flows anonymously"
        redact_body: true
    - method: GET
      path: /auth/login
      match:
        status: [200]
        headers_absent: ["WWW-Authenticate"]
        body_regex: '^\s*\{\s*\}\s*$'
        evidence_summary: "Admin API reported no active authentication scheme"
        redact_body: true
    - method: GET
      path: /settings
      match:
        status: [200]
        headers_absent: ["WWW-Authenticate"]
        json_match:
          - path: "$.httpNodeRoot"
            exists: true
          - path: "$.user"
            exists: false
        evidence_summary: "Runtime settings confirmed adminAuth is unset"
        redact_body: true

grants:
  - effect: read
    basis: proven
    note: Node-RED returned its flows without login
  - effect: control
    basis: implied
    note: Node-RED confirmed admin authentication is turned off
  - effect: configure
    basis: implied
    note: Node-RED admin editor has no login configured
  - effect: pivot
    basis: implied
    note: Node-RED flows can run code and talk to other devices on this VLAN

remediation:
  summary: >
    Node-RED served flow data anonymously and confirmed adminAuth is unset.
    Anonymous users may deploy flows that run commands with the Node-RED
    service account's privileges. Enable adminAuth in settings.js and restrict
    port 1880 to trusted admin hosts.
  unifi_actions:
    - enable_nodered_admin_auth
    - restrict_inter_vlan_access
