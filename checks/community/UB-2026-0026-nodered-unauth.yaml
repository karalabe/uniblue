id: UB-2026-0026
title: Unauthenticated Node-RED Flow Editor
cve: null
category: unauth-rce
severity: critical
safety: read-only

metadata:
  vendor: OpenJS Foundation
  product: Node-RED
  affected_versions: any (when adminAuth is unset)
  author: "@karalabe"
  references:
    - https://nodered.org/docs/user-guide/runtime/securing-node-red

preconditions:
  ports_any: [1880]

probe:
  type: http
  method: GET
  path: /flows
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"type":"tab"'
    redact_body: true

remediation:
  summary: >
    Node-RED returned active automation flows from GET /flows without
    authentication. Because Node-RED includes the exec node and arbitrary
    JavaScript function nodes, an unauthenticated editor grants immediate
    remote code execution on the host. Enable adminAuth in settings.js and
    restrict port 1880 to trusted admin hosts.
  unifi_actions:
    - enable_nodered_admin_auth
    - restrict_inter_vlan_access
