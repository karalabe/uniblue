id: UB-2026-0074
title: Solar / Home Energy Gateway Discovered (Enphase / SolarEdge / Victron)
cve: null
category: service-inventory
claim: service-advertised
property: energy-gateway-identity
severity: info
safety: read-only

metadata:
  vendor: Enphase / SolarEdge / Victron
  product: Solar Inverter / Home Energy Gateway
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/enphase_envoy/
    - https://www.home-assistant.io/integrations/victron_gx/

preconditions:
  mdns_type_any: ["_enphase-envoy._tcp", "_solaredge-modbus._tcp", "_solarman._tcp", "_mypv._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Solar/energy gateway advertised via DNS-SD (keep inverter management isolated from guest/user networks)"

remediation:
  summary: >
    Home energy gateway inventory record. Restrict guest and untrusted user
    routing into inverter management or Modbus interfaces while preserving
    authorized local monitoring and firmware updates.
  unifi_actions:
    - restrict_energy_gateway_management
