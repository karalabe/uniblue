id: UB-2026-0019
title: Matter Operational Device Discovered
cve: null
category: service-inventory
claim: service-advertised
property: matter-operational-identity
severity: info
safety: read-only

metadata:
  vendor: Connectivity Standards Alliance (Matter)
  product: Matter Operational Accessory / Bridge
  affected_versions: any
  author: "@karalabe"
  references:
    - https://developers.home.google.com/matter/primer/commissionable-and-operational-discovery

preconditions:
  mdns_type_any: ["_matter._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Matter operational fabric service advertised via _matter._tcp (UDP MRP transport)"

remediation:
  summary: >
    An operational Matter device was discovered on the local network. Verify
    fabric controller reachability across IPv6 and keep smart-home accessories
    segmented from trusted workstations.
  unifi_actions:
    - verify_ipv6_fabric_path
