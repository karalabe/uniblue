id: UB-2026-0065
title: LG webOS TV Second-Screen Control Interface Advertised
cve: null
category: exposed-protocol
severity: low
safety: read-only

metadata:
  vendor: LG Electronics
  product: LG webOS Smart TV
  affected_versions: webOS Smart TVs advertising webos-second-screen:1
  author: "@karalabe"
  references:
    - https://github.com/home-assistant/core/blob/dev/homeassistant/components/webostv/manifest.json

preconditions:
  upnp_service_regex: "(?i)webos-second-screen"

probe:
  type: observe

grants:
  - effect: control
    basis: conditional
    requires: the TV pairs with the client or runs firmware vulnerable to PIN bypass

remediation:
  summary: >
    LG webOS TV advertises its second-screen control service (TCP 3000/3001) on
    the LAN. Keep webOS firmware up to date (patching CVE-2023-6317/6318 PIN
    bypass issues) and place smart TVs on an isolated IoT/Media VLAN.
  unifi_actions:
    - update_tv_firmware
    - move_to_iot_vlan
