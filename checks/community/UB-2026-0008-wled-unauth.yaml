id: UB-2026-0008
title: WLED Unauthenticated LED Controller & OTA Interface
cve: null
category: unauth-control
severity: medium
safety: read-only
supersedes: ["UB-0006"]

metadata:
  vendor: WLED
  product: WLED ESP8266 / ESP32 Controller
  affected_versions: any
  author: "@karalabe"
  references:
    - https://kno.wled.ge/interfaces/json-api/

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /json/info
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"brand":"WLED"'
      - '"leds":'
      - '"fxcount":'
    redact_body: true

remediation:
  summary: >
    WLED exposes its unauthenticated HTTP/JSON API and OTA firmware update
    endpoint on the LAN. Enable Settings PIN / OTA Lock in WLED Security &
    Updates settings, move the controller to an isolated IoT VLAN, and block
    outbound internet access.
  unifi_actions:
    - enable_wled_ota_lock
    - move_to_iot_vlan
    - block_wan_egress
