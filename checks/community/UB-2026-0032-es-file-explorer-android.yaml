id: UB-2026-0032
title: ES File Explorer Android Unauthenticated Open-Port Backdoor (CVE-2019-6447)
cve: CVE-2019-6447
category: info-disclosure
severity: critical
safety: read-only

metadata:
  vendor: ES Global
  product: ES File Explorer for Android
  affected_versions: Android app <= 4.1.9.7.4
  author: "@karalabe"
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2019-6447

preconditions:
  ports_any: [59777]

probe:
  type: esfile
  port: 59777
  timeout: 3s

remediation:
  summary: >
    An Android phone or tablet on the Wi-Fi network is running a vulnerable
    version of ES File Explorer exposing an unauthenticated HTTP server on TCP
    port 59777 (CVE-2019-6447). Any host on the same LAN can list and download
    all photos, videos, documents, and installed APKs, or remotely launch apps.
    Immediately uninstall ES File Explorer from the Android device.
  unifi_actions:
    - uninstall_es_file_explorer
    - isolate_unpatched_mobile_device
