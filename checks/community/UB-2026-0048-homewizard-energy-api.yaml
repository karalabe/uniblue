id: UB-2026-0048
title: Unauthenticated HomeWizard Energy Meter API
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: HomeWizard
  product: HomeWizard Energy P1 Meter / kWh Meter / Energy Socket
  affected_versions: Local API v1 enabled
  author: "@karalabe"
  references:
    - https://homewizard-energy-api.readthedocs.io/

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /api/v1/data
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"active_power_w":'
      - '"total_power_import_kwh":'
    redact_body: true

remediation:
  summary: >
    HomeWizard Energy device exposes its unauthenticated local API v1 on port
    80, leaking real-time household power/gas consumption patterns and (on
    Energy Sockets) allowing any LAN host to toggle mains power via
    /api/v1/state. Move the device to an isolated IoT VLAN and restrict access
    to your Home Assistant host, or migrate to token-authenticated API v2 where
    supported.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_port_80_to_controller
