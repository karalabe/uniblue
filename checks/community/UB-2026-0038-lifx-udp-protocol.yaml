id: UB-2026-0038
title: LIFX Smart Light Local UDP Protocol Discovered
cve: null
category: service-inventory
claim: service-observed
property: lifx-udp-protocol
severity: info
safety: read-only

metadata:
  vendor: LIFX
  product: LIFX LAN Protocol Light
  affected_versions: any
  author: "@karalabe"
  references:
    - https://lan.developer.lifx.com/docs/introduction

preconditions:
  mdns_type_any: ["_hap._tcp", "_lifx._udp"]
  hostname_regex: "(?i)lifx"
  discovery_only: true

probe:
  type: lifx
  port: 56700
  timeout: 2s

remediation:
  summary: >
    A LIFX bulb answered a read-only GetService UDP query on port 56700.
    The LIFX LAN protocol is unauthenticated on its L2 segment; place smart
    lighting on an isolated IoT VLAN.
  unifi_actions:
    - move_to_iot_vlan
