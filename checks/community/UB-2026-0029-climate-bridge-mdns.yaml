id: UB-2026-0029
title: Smart Climate / Bridge Gateway Discovered
cve: null
category: service-inventory
claim: service-advertised
property: climate-bridge-identity
severity: info
safety: read-only

metadata:
  vendor: ecobee / Bond / Plugwise / Somfy
  product: Climate / Fan / Shade Automation Bridge
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/ecobee/

preconditions:
  mdns_type_any: ["_ecobee._tcp", "_bond._tcp", "_plugwise._tcp", "_kizbox._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Climate or automation bridge advertised via DNS-SD"

grants: []

remediation:
  summary: >
    A smart climate or automation bridge was discovered on the LAN. Keep control
    endpoints segmented from guest networks while preserving heating schedules
    and approved local controllers.
  unifi_actions:
    - move_to_iot_vlan
