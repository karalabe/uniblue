id: UB-2026-0042
title: Unauthenticated AirGradient Air Quality Local API
cve: null
category: info-disclosure
severity: low
safety: read-only

metadata:
  vendor: AirGradient
  product: AirGradient ONE / Open Air Monitor
  affected_versions: any
  author: "@karalabe"
  references:
    - https://github.com/airgradienthq/arduino/blob/master/docs/local-server.md

preconditions:
  mdns_type_any: ["_airgradient._tcp"]

probe:
  type: http
  method: GET
  path: /measures/current
  timeout: 3s
  match:
    status: [200]
    json_match:
      - path: "$.pm02"
        exists: true
    evidence_summary: "AirGradient monitor served /measures/current sensor telemetry without authentication"
    redact_body: true

grants:
  - effect: read
    basis: proven
    note: AirGradient returned air-quality readings without login

remediation:
  summary: >
    AirGradient monitor exposes its local HTTP sensor API without
    authentication. Move environmental IoT sensors onto an isolated IoT VLAN
    and allow polling strictly from Home Assistant.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_port_80_to_controller
