id: UB-2026-0016
title: Hikvision IP Camera Authentication Bypass (CVE-2017-7921)
cve: CVE-2017-7921
category: auth-bypass
severity: critical
safety: read-only

metadata:
  vendor: Hikvision
  product: Hikvision / OEM IP Camera & NVR
  affected_versions: Legacy firmware vulnerable to CVE-2017-7921
  author: "@karalabe"
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2017-7921

preconditions:
  ports_any: [80, 8080]

probe:
  type: http
  method: GET
  path: /Security/users?auth=YWRtaW46MTEK
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - "<UserList"
      - "<userName>"
    redact_body: true

remediation:
  summary: >
    IP camera is vulnerable to the critical Hikvision authentication bypass
    (CVE-2017-7921), allowing any unauthenticated host to enumerate accounts,
    dump encrypted configuration files, and take full control of the camera.
    Immediately update firmware (or replace end-of-life hardware), isolate
    cameras on a no-WAN Camera VLAN, and block all external access.
  unifi_actions:
    - update_or_replace_camera_firmware
    - move_to_camera_vlan
    - block_wan_egress
