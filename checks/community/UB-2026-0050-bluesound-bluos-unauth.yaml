id: UB-2026-0050
title: Bluesound / BluOS Unauthenticated Playback & Control API
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Lenbrook / Bluesound
  product: Bluesound / NAD BluOS Player
  affected_versions: any
  author: "@karalabe"
  references:
    - https://github.com/home-assistant/core/blob/dev/homeassistant/components/bluesound/manifest.json

preconditions:
  mdns_type_any: ["_musc._tcp"]

probe:
  type: http
  method: GET
  path: /Status
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - "<status"
      - "<state>"
    evidence_summary: "BluOS player returned playback state on /Status without authentication"
    redact_body: true

remediation:
  summary: >
    BluOS media player exposes unauthenticated HTTP playback and volume control
    (typically port 11000) across the LAN. Move audio appliances to an isolated
    IoT/Media VLAN.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
