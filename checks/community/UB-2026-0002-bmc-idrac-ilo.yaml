id: UB-2026-0002
title: Server BMC Management Console (Dell iDRAC / HPE iLO)
cve: null
category: oob-bmc
severity: high
safety: read-only

metadata:
  vendor: Dell / HPE
  product: Dell iDRAC / HPE iLO Out-of-Band BMC
  affected_versions: Server BMCs reachable from non-management VLANs
  author: "@karalabe"
  references:
    - https://www.cisa.gov/news-events/alerts/2013/07/26/risks-using-intelligent-platform-management-interface-ipmi

preconditions:
  ports_any: [443, 80]
  discovery_only: true

probe:
  type: http
  method: GET
  paths:
    - /xmldata?item=All
    - /restgui/start.html
    - /data/login
  timeout: 3s
  match:
    status: [200]
    body_regex: "(?i)(<RIMP>|<HSI>[^<]{0,200}iLO|Integrated Dell Remote Access Controller|iDRAC[0-9]|Hewlett-Packard[^<]{0,80}iLO)"

grants:
  - effect: control
    basis: conditional
    requires: a BMC login to open the server console, reboot, or mount virtual media

remediation:
  summary: >
    A Dell iDRAC or HPE iLO out-of-band server management console is reachable
    on this network (and HPE iLO /xmldata discloses firmware versions and
    hardware serials without authentication). Move server BMCs onto an isolated
    Out-of-Band Management VLAN restricted strictly to administrator IPs and
    verify BMC firmware is up to date.
  unifi_actions:
    - move_bmc_to_dedicated_oob_mgmt_vlan
    - restrict_bmc_access_to_admin_ips
    - update_bmc_firmware
