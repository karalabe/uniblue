id: UB-2026-0001
title: Server BMC Web Console (MegaRAC / ASMB / iKVM)
cve: null
category: oob-bmc
claim: service-observed
severity: high
safety: read-only

metadata:
  vendor: AMI / ASUS / Supermicro / ASRock Rack
  product: MegaRAC SPX / ASMB / ATEN IPMI Web Console
  affected_versions: any matching console (firmware version unverified)
  author: "@karalabe"
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2024-54085
    - https://nvd.nist.gov/vuln/detail/CVE-2019-6260

preconditions:
  ports_any: [443, 80]
  discovery_only: true

probe:
  type: http
  method: GET
  paths:
    - /
    - /index.html
    - /page/login.html
    - /cgi/login.cgi
  timeout: 3s
  match:
    status: [200]
    body_regex: "(?i)(MegaRAC|ASMB[0-9]|American Megatrends[^<]{0,80}(BMC|IPMI|SPX)|ATEN International|jviewer\\.jnlp|SMCIPMITool|Supermicro[^<]{0,80}(IPMI|BMC|ATEN)|webgui[^<]{0,40}ipmi)"

grants:
  - effect: control
    basis: conditional
    requires: a BMC login to open the server console, reboot, or mount virtual media

remediation:
  summary: >
    An out-of-band server management console (AMI MegaRAC / ASUS ASMB /
    Supermicro ATEN BMC) is reachable on this network. The console can manage
    server power, boot media, and firmware. Check the installed firmware
    against vendor advisories. CVE-2024-54085 is an example of an authentication
    bypass affecting unpatched MegaRAC SPx versions. Apply vendor updates and
    restrict BMC access to trusted administrators on a dedicated management VLAN.
  unifi_actions:
    - move_bmc_to_dedicated_oob_mgmt_vlan
    - restrict_bmc_access_to_admin_ips
    - update_bmc_firmware
