id: UB-2026-0031
title: Transmission BitTorrent Unauthenticated RPC Daemon
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: Transmission Project
  product: transmission-daemon RPC
  affected_versions: any (when rpc-authentication-required is false)
  author: "@karalabe"
  references:
    - https://github.com/transmission/transmission/blob/main/docs/rpc-spec.md

preconditions:
  ports_any: [9091]

probe:
  type: http
  method: GET
  path: /transmission/rpc
  timeout: 3s
  match:
    status: [409]
    headers_present: ["X-Transmission-Session-Id"]
    headers_absent: ["WWW-Authenticate"]
    redact_body: true

remediation:
  summary: >
    Transmission RPC on port 9091 returned an X-Transmission-Session-Id CSRF
    token without requesting HTTP Basic authentication
    (rpc-authentication-required=false). Any LAN host can add/remove torrents,
    change download directories, or execute post-download scripts if enabled.
    Enable rpc-authentication-required with a strong password and restrict
    rpc-whitelist in settings.json.
  unifi_actions:
    - enable_transmission_rpc_auth
    - restrict_inter_vlan_access
