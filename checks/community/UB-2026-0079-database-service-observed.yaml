id: UB-2026-0079
title: Network Database Service Observed (SQL / Document / Time-Series)
cve: null
category: service-inventory
claim: service-observed
property: database-service-identity
severity: info
safety: read-only

metadata:
  vendor: Generic
  product: Networked Database Server
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.postgresql.org/docs/current/auth-pg-hba-conf.htm

preconditions:
  service_proto_any: ["postgresql", "mysql", "mssql", "mongodb", "clickhouse", "influxdb"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Database protocol observed on LAN endpoint (check host authentication policy and source-network scoping)"

remediation:
  summary: >
    Database service inventory record. Ensure host-based authentication (such as
    pg_hba.conf) and UniFi zone rules restrict access strictly to application
    clients rather than guest or general user networks.
  unifi_actions:
    - restrict_database_source_vlans
