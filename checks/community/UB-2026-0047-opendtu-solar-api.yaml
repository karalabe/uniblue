id: UB-2026-0047
title: Unauthenticated OpenDTU Solar Microinverter API
cve: null
category: info-disclosure
severity: low
safety: read-only

metadata:
  vendor: OpenDTU
  product: OpenDTU Hoymiles Solar Gateway
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.opendtu.solar/firmware/web_api/

preconditions:
  ports_any: [80]
  discovery_only: true

probe:
  type: http
  method: GET
  path: /api/livedata/status
  timeout: 3s
  match:
    status: [200]
    json_match:
      - path: "$.inverters"
        exists: true
      - path: "$.total"
        exists: true
    evidence_summary: "OpenDTU solar gateway served /api/livedata/status without authentication"
    redact_body: true

grants:
  - effect: read
    basis: proven
    note: OpenDTU returned live solar inverter readings without login

remediation:
  summary: >
    OpenDTU exposes its local solar telemetry API on port 80. Verify that an
    admin password is set for configuration/power-limit endpoints and place the
    ESP32 gateway on an isolated IoT/Energy VLAN.
  unifi_actions:
    - set_opendtu_admin_password
    - move_to_iot_vlan
