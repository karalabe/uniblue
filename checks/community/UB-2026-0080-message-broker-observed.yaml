id: UB-2026-0080
title: Message Broker / Event Stream Service Observed (AMQP / Kafka / NATS / Pulsar)
cve: null
category: service-inventory
claim: service-observed
property: message-broker-identity
severity: info
safety: read-only

metadata:
  vendor: Generic
  product: Message Broker / Event Stream
  affected_versions: any
  author: "@karalabe"
  references:
    - https://docs.nats.io/learn/security/

preconditions:
  service_proto_any: ["amqp", "kafka", "nats", "pulsar", "activemq"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Message broker protocol observed on LAN endpoint"

remediation:
  summary: >
    Message broker inventory record. Verify topic/queue ACLs and keep broker
    management consoles restricted to infrastructure admin sources.
  unifi_actions:
    - restrict_broker_admin_access
