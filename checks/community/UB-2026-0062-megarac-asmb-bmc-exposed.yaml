id: UB-2026-0062
title: Legacy Server BMC Web Console (AMI MegaRAC / ASUS ASMB / Supermicro iKVM) Exposed
cve: CVE-2024-54085
category: oob-bmc
severity: high
safety: read-only

metadata:
  vendor: AMI / ASUS / Supermicro / ASRock Rack
  product: MegaRAC SPX / ASMB / ATEN IPMI Web Console
  affected_versions: Legacy and unpatched AMI MegaRAC / ASMB / Supermicro BMC web stacks
  author: "@karalabe"
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2024-54085
    - https://nvd.nist.gov/vuln/detail/CVE-2019-6260

preconditions:
  ports_any: [443, 80]
  discovery_only: true

probe:
  type: http
  method: GET
  paths:
    - /
    - /index.html
    - /page/login.html
    - /cgi/login.cgi
  timeout: 3s
  match:
    status: [200]
    body_regex: "(?i)(MegaRAC|ASMB[0-9]|American Megatrends[^<]{0,80}(BMC|IPMI|SPX)|ATEN International|jviewer\\.jnlp|SMCIPMITool|Supermicro[^<]{0,80}(IPMI|BMC|ATEN)|webgui[^<]{0,40}ipmi)"

remediation:
  summary: >
    An out-of-band server management console (AMI MegaRAC / ASUS ASMB /
    Supermicro ATEN BMC) web interface is reachable on this network. Legacy BMC
    web stacks frequently run outdated embedded Linux/lighttpd firmware with
    critical authentication bypasses (such as CVE-2024-54085) and grant
    bare-metal console, power, virtual USB boot, and BIOS flashing access.
    Isolate the BMC onto a dedicated Out-of-Band Management VLAN with strict
    firewall ACLs and update BMC firmware immediately.
  unifi_actions:
    - move_bmc_to_dedicated_oob_mgmt_vlan
    - restrict_bmc_access_to_admin_ips
    - update_bmc_firmware
