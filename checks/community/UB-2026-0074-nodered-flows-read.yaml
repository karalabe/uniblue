id: UB-2026-0074
title: Unauthenticated Node-RED Flow Read Access
cve: null
category: info-disclosure
claim: confirmed-permission
property: nodered-flows-read
severity: high
safety: read-only

metadata:
  vendor: OpenJS Foundation
  product: Node-RED
  affected_versions: any configuration allowing anonymous flow reads
  author: "@karalabe"
  references:
    - https://nodered.org/docs/user-guide/runtime/securing-node-red

preconditions:
  ports_any: [1880]

probe:
  type: http
  method: GET
  path: /flows
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"type":"tab"'
    redact_body: true

remediation:
  summary: >
    Anonymous GET /flows exposes automation logic and configuration, including
    when adminAuth grants anonymous users read-only access. Configure adminAuth
    in settings.js to require sign-in for flow reads and restrict port 1880 to
    trusted admins.
  unifi_actions:
    - enable_nodered_admin_auth
    - restrict_inter_vlan_access
