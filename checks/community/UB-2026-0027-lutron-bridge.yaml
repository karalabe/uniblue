id: UB-2026-0027
title: Lutron Caséta / RadioRA Smart Bridge Discovered
cve: null
category: service-inventory
claim: service-advertised
property: lutron-bridge-identity
severity: info
safety: read-only

metadata:
  vendor: Lutron
  product: Lutron Smart Bridge / LEAP Gateway
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/lutron_caseta/

preconditions:
  mdns_type_any: ["_lutron._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Lutron lighting bridge advertised on _lutron._tcp (paired LEAP/LIP control bridge)"

remediation:
  summary: >
    A Lutron smart lighting bridge was discovered on the LAN. Keep bridge
    control access restricted to approved home-automation controllers and
    isolated from guest networks.
  unifi_actions:
    - restrict_bridge_to_controllers
