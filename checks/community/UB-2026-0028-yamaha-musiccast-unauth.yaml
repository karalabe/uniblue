id: UB-2026-0028
title: Yamaha MusicCast Unauthenticated Extended Control API
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Yamaha
  product: Yamaha MusicCast Receiver / Soundbar
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/yamaha_musiccast/

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /YamahaExtendedControl/v1/system/getDeviceInfo
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - '"response_code":0'
      - '"model_name":'
      - '"api_version":'
    redact_body: true

remediation:
  summary: >
    Yamaha MusicCast exposes its unauthenticated Extended Control (YXC) HTTP
    API on port 80. Any device on the LAN can power the amplifier on/off,
    change audio inputs, set maximum volume, or modify network configuration.
    Isolate AV gear on an IoT/Media VLAN and restrict port 80 to your Home
    Assistant or media controller subnet.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_port_80_to_controller
