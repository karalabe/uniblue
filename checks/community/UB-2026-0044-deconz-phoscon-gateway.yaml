id: UB-2026-0044
title: deCONZ / Phoscon Zigbee Gateway Local API Exposed
cve: null
category: info-disclosure
severity: low
safety: read-only

metadata:
  vendor: dresden elektronik
  product: deCONZ / Phoscon Zigbee Gateway
  affected_versions: any
  author: "@karalabe"
  references:
    - https://dresden-elektronik.github.io/deconz-rest-doc/endpoints/configuration/

preconditions:
  upnp_device_regex: "(?i)dresden-elektronik"

probe:
  type: http
  method: GET
  path: /api/config
  timeout: 3s
  match:
    status: [200]
    json_match:
      - path: "$.bridgeid"
        exists: true
      - path: "$.swversion"
        exists: true
    evidence_summary: "deCONZ/Phoscon gateway responded with public bridge metadata on /api/config"
    redact_body: true

remediation:
  summary: >
    deCONZ / Phoscon Zigbee gateway is reachable on the LAN. Keep the gateway
    on an isolated smart-home/IoT VLAN and restrict access to Home Assistant
    and trusted admin hosts so unauthorized clients cannot register API keys
    when gateway authentication is unlocked.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
