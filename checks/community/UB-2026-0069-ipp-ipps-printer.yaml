id: UB-2026-0069
title: IPP / IPPS Network Printer Service Discovered via DNS-SD
cve: null
category: service-inventory
claim: service-advertised
property: ipp-printer-identity
severity: info
safety: read-only

metadata:
  vendor: PWG / Generic
  product: IPP / IPPS Network Printer
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.pwg.org/ipp/everywhere.html

preconditions:
  mdns_type_any: ["_ipp._tcp", "_ipps._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "IPP/IPPS printing service advertised via DNS-SD (printing separated from printer administration)"

remediation:
  summary: >
    Network printer advertising IPP/IPPS. Approved printing access (TCP 631) is
    evaluated independently from printer web administration (TCP 80/443).
  unifi_actions:
    - separate_print_from_printer_admin
