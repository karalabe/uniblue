id: UB-2026-0073
title: Shelly Smart Relay / Plug Discovered via DNS-SD
cve: null
category: service-inventory
claim: service-advertised
property: shelly-mdns-identity
severity: info
safety: read-only

metadata:
  vendor: Shelly (Allterco)
  product: Shelly Smart Relay / Energy Monitor
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/shelly/

preconditions:
  mdns_type_any: ["_shelly._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Shelly device advertised on _shelly._tcp (authentication posture evaluated separately by UB-2026-0005 / UB-2026-0006)"

remediation:
  summary: >
    Shelly device inventory record. Separate authentication checks verify
    whether unauthenticated relay control is permitted.
  unifi_actions:
    - move_to_iot_vlan
