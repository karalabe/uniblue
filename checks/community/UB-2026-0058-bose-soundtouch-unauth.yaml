id: UB-2026-0058
title: Unauthenticated Bose SoundTouch Local Control API
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Bose
  product: Bose SoundTouch Wireless Speaker
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/soundtouch/

preconditions:
  mdns_type_any: ["_soundtouch._tcp"]

probe:
  type: http
  method: GET
  path: /info
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - "<info"
      - "<type>"
    evidence_summary: "Bose SoundTouch speaker returned /info device metadata over unauthenticated HTTP"
    redact_body: true

remediation:
  summary: >
    Bose SoundTouch exposes its unauthenticated HTTP control API (port 8090)
    to every host on the same LAN segment. Isolate SoundTouch speakers onto an
    IoT/Media VLAN and restrict access to trusted controllers.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
