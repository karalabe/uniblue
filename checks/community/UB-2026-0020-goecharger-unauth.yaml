id: UB-2026-0020
title: go-eCharger EV Wallbox Unauthenticated Local Control API
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: go-e
  product: go-eCharger HOME / Gemini EV Wallbox
  affected_versions: Local HTTP API v2 enabled
  author: "@karalabe"
  references:
    - https://github.com/goecharger/go-eCharger-API-v2

preconditions:
  ports_any: [80]

probe:
  type: http
  method: GET
  path: /api/status
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"car":'
      - '"amp":'
      - '"alw":'
      - '"nrg":'
    redact_body: true

remediation:
  summary: >
    go-eCharger exposes its local HTTP API v2 without authentication. Any host
    on the LAN can alter charging current limits, stop or start charging,
    unlock the charging cable, or read live grid power telemetry. Isolate the
    wallbox on an IoT VLAN and restrict port 80 strictly to your energy
    management or Home Assistant host.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_port_80_to_controller
    - block_wan_egress
