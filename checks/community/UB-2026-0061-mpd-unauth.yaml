id: UB-2026-0061
title: Unauthenticated Music Player Daemon (MPD / Volumio / moOde)
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Generic
  product: Music Player Daemon (MPD / Volumio / moOde)
  affected_versions: any
  author: "@karalabe"
  references:
    - https://mpd.readthedocs.io/en/latest/protocol.html

preconditions:
  mdns_type_any: ["_Volumio._tcp", "_mpd._tcp"]

probe:
  type: mpd
  port: 6600
  timeout: 3s

remediation:
  summary: >
    Music Player Daemon (MPD) answered with its greeting banner on TCP port
    6600. Verify that an MPD password is configured (or bind MPD to localhost)
    and isolate standalone audio streamers onto an IoT/Media VLAN.
  unifi_actions:
    - set_mpd_password_or_bind_localhost
    - move_to_iot_vlan
