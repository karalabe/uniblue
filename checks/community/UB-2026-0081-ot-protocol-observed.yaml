id: UB-2026-0081
title: Building Automation / Industrial OT Protocol Observed
cve: null
category: service-inventory
claim: service-observed
property: ot-protocol-identity
severity: info
safety: read-only

metadata:
  vendor: Generic (OT / BMS)
  product: Building / Industrial Control Endpoint
  affected_versions: any
  author: "@karalabe"
  references:
    - https://csrc.nist.gov/pubs/sp/800/82/r3/final

preconditions:
  service_proto_any: ["bacnet", "knxip", "opcua", "s7comm", "ethernetip", "dnp3", "iec104"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "OT / building control protocol observed (verify isolation from guest and general user VLANs; OPC UA discovery alone does not prove unauthorized actuation)"

remediation:
  summary: >
    OT/BMS protocol inventory record. Segment building/industrial controllers on
    a dedicated OT VLAN reachable only from authorized engineering/BMS hosts.
  unifi_actions:
    - isolate_ot_vlan
