id: UB-2026-0057
title: Unauthenticated Sonos Speaker Diagnostics & UPnP Control
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Sonos
  product: Sonos Wireless Speaker / Amp
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.home-assistant.io/integrations/sonos/

preconditions:
  ports_any: [1400]

probe:
  type: http
  method: GET
  path: /status/zp
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - "<ZPSupportInfo>"
      - "<ZPInfo>"
      - "<ZoneName>"
    redact_body: true

remediation:
  summary: >
    Sonos exposes unauthenticated UPnP playback/volume control and embedded
    Linux diagnostics (/status/zp, /status/ifconfig, /status/topology) on TCP
    port 1400 to every host on the same L2/L3 segment. Place Sonos speakers on
    an isolated IoT/Media VLAN and allow control only from trusted subnets or
    Home Assistant.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
