id: UB-0047
title: Network UPS Tools (NUT) Daemon Discovered
cve: null
category: service-inventory
claim: service-observed
property: nut-ups-daemon
severity: info
safety: read-only

metadata:
  vendor: Network UPS Tools (NUT)
  product: upsd UPS Monitor Daemon
  affected_versions: any
  author: "@karalabe"
  references:
    - https://networkupstools.org/docs/developer-guide.chunked/net-protocol.html

preconditions:
  ports_any: [3493]
  discovery_only: true

probe:
  type: nut
  timeout: 3s

remediation:
  summary: >
    A NUT upsd daemon answered read-only VER/LIST UPS queries on TCP 3493.
    Restrict TCP 3493 to monitored hosts and ensure upsd.users requires strong
    credentials for INSTCMD or SET VAR power-control actions.
  unifi_actions:
    - restrict_ups_monitor_access
