id: UB-0048
title: Unauthenticated Modbus TCP Interface
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: Generic
  product: Modbus TCP Device (HVAC / Inverter / PLC)
  affected_versions: any
  author: "@karalabe"
  references:
    - https://cwe.mitre.org/data/definitions/306.html

preconditions:
  ports_any: [502]

probe:
  type: modbus
  port: 502
  timeout: 3s

remediation:
  summary: >
    Device responds to unauthenticated Modbus TCP requests on port 502. Modbus
    has no built-in authentication, allowing any reachable host on the LAN to
    read telemetry or alter operational registers (e.g., ventilation, heat pump,
    or inverter settings). Place Modbus controllers on an isolated OT/IoT VLAN
    and restrict TCP port 502 strictly to your authorized home-automation or BMS
    controller IP.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
    - block_wan_egress
