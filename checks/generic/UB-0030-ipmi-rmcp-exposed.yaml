id: UB-0030
title: Out-of-Band BMC IPMI (RMCP/RMCP+) Exposed on LAN
cve: CVE-2013-4786
category: oob-bmc
severity: high
safety: read-only

metadata:
  vendor: Generic
  product: Server BMC / IPMI v1.5 / v2.0 (RMCP+)
  affected_versions: BMCs with IPMI-over-LAN (UDP 623) reachable from general LAN/Server VLANs
  author: "@karalabe"
  references:
    - https://nvd.nist.gov/vuln/detail/CVE-2013-4786
    - https://www.cisa.gov/news-events/alerts/2013/07/26/risks-using-intelligent-platform-management-interface-ipmi

preconditions:
  ports_any: [80, 443, 623, 5120, 5123, 7578]
  discovery_only: true

probe:
  type: ipmi
  port: 623
  timeout: 2s

remediation:
  summary: >
    Bare-metal server management controller (BMC) responded to IPMI RMCP on UDP
    port 623. IPMI grants ring-(-3) bare-metal control (power, BIOS/UEFI, virtual
    USB boot, KVM) and IPMI v2.0 RAKP-HMAC-SHA1 exposes salted password hashes
    to offline cracking without authentication (and Cipher 0 bypass on older
    firmware). Move BMCs onto a dedicated, firewall-isolated Out-of-Band
    Management VLAN, disable IPMI-over-LAN if unused, disable Cipher 0 / IPMI
    v1.5, and update BMC firmware.
  unifi_actions:
    - move_bmc_to_dedicated_oob_mgmt_vlan
    - disable_ipmi_over_lan_or_restrict_by_acl
    - update_bmc_firmware
