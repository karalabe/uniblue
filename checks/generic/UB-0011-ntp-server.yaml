id: UB-0011
title: Local NTP Time Server Discovered
cve: null
category: service-inventory
claim: service-observed
property: ntp-server
severity: info
safety: read-only

metadata:
  vendor: Generic
  product: Network Time Protocol (NTP) Server
  affected_versions: any
  author: "@karalabe"
  references:
    - https://datatracker.ietf.org/doc/html/rfc5905

preconditions:
  ports_any: [22, 53, 80, 443]
  hostname_regex: "(?i)(ntp|time|gw|gateway|router|nas|pve|server)"
  discovery_only: true

probe:
  type: ntp
  port: 123
  timeout: 2s

grants:
  - effect: read
    basis: implied
    note: NTP server answered a time request

remediation:
  summary: >
    A local NTP server responded to a read-only mode-3 time request on UDP 123.
    Verify mode-6/mode-7 control queries are restricted and UDP 123 is not
    forwarded from WAN.
  unifi_actions:
    - verify_ntp_access_scope
