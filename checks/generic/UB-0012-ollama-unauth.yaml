id: UB-0012
title: Unauthenticated Ollama Local LLM API
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Ollama
  product: Ollama Server
  affected_versions: any
  author: "@karalabe"
  references:
    - https://github.com/ollama/ollama/blob/main/docs/faq.md

preconditions:
  ports_any: [11434]

probe:
  type: http
  method: GET
  path: /api/tags
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"models":'
    redact_body: true

remediation:
  summary: >
    Ollama is bound to a LAN interface on port 11434 without authentication.
    Any host on the network can run GPU inference, pull large models to exhaust
    disk space, or delete local models. Bind OLLAMA_HOST to 127.0.0.1 or place
    it behind an authenticated reverse proxy.
  unifi_actions:
    - bind_ollama_to_localhost
    - restrict_inter_vlan_access
