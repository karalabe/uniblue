id: UB-0029
title: Unauthenticated Docker Engine TCP API
cve: null
category: unauth-rce
severity: critical
safety: read-only

metadata:
  vendor: Docker
  product: Docker Engine Remote API
  affected_versions: any
  author: "@karalabe"
  references:
    - https://docs.docker.com/engine/security/protect-access/

preconditions:
  ports_any: [2375]

probe:
  type: http
  method: GET
  path: /version
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - '"Version":'
      - '"Os":'
    body_contains_any:
      - '"ApiVersion":'
      - '"APIVersion":'
    redact_body: true

grants:
  - effect: read
    basis: proven
    note: Docker API returned version and host details without login
  - effect: control
    basis: implied
    note: Docker TCP API answered without TLS client certificates or login
  - effect: configure
    basis: conditional
    requires: the Docker API allows creating or modifying containers
  - effect: pivot
    basis: conditional
    requires: a container started via Docker can reach the host or other LAN devices

remediation:
  summary: >
    Docker Engine is listening on unencrypted TCP port 2375 without TLS client
    certificate authentication. Any host on the LAN can start a privileged
    container mounting the host filesystem for immediate root takeover. Bind
    dockerd strictly to its local Unix socket or enable mutual TLS on port 2376.
  unifi_actions:
    - disable_unencrypted_docker_tcp_2375
    - enable_docker_mtls_or_unix_socket
    - restrict_inter_vlan_access
