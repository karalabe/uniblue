id: UB-0040
title: Unauthenticated Embedded Device Control Panel
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Generic
  product: Embedded Web Control Panel (IoT / HVAC / Relay)
  affected_versions: any
  author: "@karalabe"
  references:
    - https://cwe.mitre.org/data/definitions/306.html

preconditions:
  ports_any: [80, 8080]
  http_status_any: [200]
  http_title_regex: "(?i)(tasmota|shelly|esphome|ventilation|hvac|solar\\s*inverter|modbus|smart\\s*meter)"

probe:
  type: http
  method: GET
  path: /
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_regex: '(?is)<(button|form|table|select|input|a\s+href)\b'
    body_not_regex: '(?is)(type\s*=\s*["'']?password\b|autocomplete\s*=\s*["'']?current-password|name\s*=\s*["'']?(password|passwd|passcode)\b|<form[^>]*(login|signin|sign-in|auth)|<div\s+id\s*=\s*["'']?(app|root)["'']?[^>]*>\s*</div>|<script[^>]+(login|auth|signin|bundle|chunk))'
    redact_body: true

remediation:
  summary: >
    Embedded device exposes a web control interface without HTTP
    authentication. If the vendor does not support authentication, place the
    device on an isolated IoT VLAN and restrict access to trusted admin hosts.
  unifi_actions:
    - enable_web_authentication
    - move_to_iot_vlan
    - restrict_inter_vlan_access
