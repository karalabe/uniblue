id: UB-0013
title: NAT-PMP Dynamic Port-Mapping Service
cve: null
category: exposed-protocol
severity: medium
safety: read-only

metadata:
  vendor: Generic
  product: NAT-PMP / PCP Gateway Service
  affected_versions: Routers with NAT-PMP enabled on LAN
  author: "@karalabe"
  references:
    - https://www.rfc-editor.org/rfc/rfc6886

preconditions:
  upnp_device_regex: "(?i)InternetGatewayDevice"

probe:
  type: natpmp
  port: 5351
  timeout: 2s

grants:
  - effect: read
    basis: proven
    note: "NAT-PMP returned the gateway's external IP address"
  - effect: configure
    basis: conditional
    requires: the gateway allows creating port forwards via NAT-PMP

remediation:
  summary: >
    Gateway responded to a read-only NAT-PMP v0 external-address query on UDP
    5351. NAT-PMP allows any host on the reachable segment to dynamically open
    inbound WAN port forwards without administrator approval (and often stays
    enabled even after UPnP is turned off). Disable NAT-PMP/PCP on guest and
    IoT VLANs.
  unifi_actions:
    - disable_natpmp_on_untrusted_vlans
