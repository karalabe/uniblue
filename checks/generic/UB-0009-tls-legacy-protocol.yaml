id: UB-0009
title: Deprecated TLS 1.0 / TLS 1.1 Protocol
cve: null
category: misconfig
severity: medium
safety: read-only

metadata:
  vendor: Generic
  product: Legacy HTTPS / Embedded TLS Appliance
  affected_versions: Devices permitting TLS 1.0 or TLS 1.1 (RFC 8996)
  author: "@karalabe"
  references:
    - https://www.rfc-editor.org/rfc/rfc8996

preconditions:
  ports_any: [443, 8443]
  discovery_only: true

probe:
  type: tls-legacy
  timeout: 3s

remediation:
  summary: >
    HTTPS service negotiated deprecated TLS 1.0 or TLS 1.1 (deprecated by RFC
    8996). Legacy TLS typically indicates unmaintained firmware on older
    printers, cameras, BMCs, NASes, or routers. Disable TLS 1.0/1.1 in the
    device's security settings or isolate legacy hardware on an IoT/Mgmt VLAN.
  unifi_actions:
    - disable_tls_10_and_11
    - update_device_firmware
    - move_to_iot_vlan
