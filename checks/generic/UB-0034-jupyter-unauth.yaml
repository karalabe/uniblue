id: UB-0034
title: Unauthenticated Jupyter Notebook / Lab Server
cve: null
category: unauth-rce
severity: critical
safety: read-only

metadata:
  vendor: Project Jupyter
  product: Jupyter Notebook / JupyterLab Server
  affected_versions: any (token/password disabled on LAN interface)
  author: "@karalabe"
  references:
    - https://jupyter-server.readthedocs.io/en/latest/operators/security.html

preconditions:
  ports_any: [8888]

probe:
  type: http
  method: GET
  path: /api/contents
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_all:
      - '"type":"directory"'
      - '"content":'
    redact_body: true

remediation:
  summary: >
    Jupyter Server returned workspace contents from /api/contents on port 8888
    without token or password authentication. Because Jupyter provides built-in
    Python kernels and a web terminal, any LAN host gains immediate shell code
    execution on this laptop or server. Bind Jupyter to 127.0.0.1 and never
    disable token authentication (--NotebookApp.token='').
  unifi_actions:
    - enable_jupyter_token_or_password
    - bind_jupyter_to_localhost
    - restrict_inter_vlan_access
