id: UB-0046
title: Network UPS Tools (NUT) Service Advertised
cve: null
category: service-inventory
claim: service-advertised
property: nut-ups-identity
severity: info
safety: read-only

metadata:
  vendor: Network UPS Tools (NUT)
  product: NUT upsd Power Monitoring Daemon
  affected_versions: any
  author: "@karalabe"
  references:
    - https://networkupstools.org/docs/man/upsd.conf.html

preconditions:
  mdns_type_any: ["_nut._tcp"]
  discovery_only: true

probe:
  type: observe
  match:
    evidence_summary: "Network UPS Tools daemon advertised on _nut._tcp (multiple read-only monitoring clients are normal)"

grants: []

remediation:
  summary: >
    A Network UPS Tools (NUT) power-monitoring daemon is advertised on the LAN.
    Separate read-only monitoring users from primary shutdown administrators in
    upsd.users and keep power-control access restricted to infrastructure
    admins.
  unifi_actions:
    - restrict_ups_admin_access
