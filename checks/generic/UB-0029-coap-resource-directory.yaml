id: UB-0029
title: Unauthenticated CoAP Resource Directory Exposed
cve: null
category: exposed-protocol
severity: low
safety: read-only

metadata:
  vendor: Generic
  product: CoAP IoT Endpoint (RFC 7252)
  affected_versions: Unencrypted UDP 5683 CoAP servers
  author: "@karalabe"
  references:
    - https://www.rfc-editor.org/rfc/rfc7252

preconditions:
  mdns_type_any: ["_coap._udp", "_esphomelib._tcp"]

probe:
  type: coap
  port: 5683
  timeout: 2s

remediation:
  summary: >
    IoT endpoint responded with CoAP 2.05 Content to /.well-known/core over
    unencrypted UDP 5683. Isolate CoAP devices onto a dedicated IoT VLAN or
    enable DTLS (port 5684) where supported.
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
