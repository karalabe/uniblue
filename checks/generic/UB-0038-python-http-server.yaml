id: UB-0038
title: Ad-Hoc Python HTTP File Server
cve: null
category: info-disclosure
severity: medium
safety: read-only

metadata:
  vendor: Python Software Foundation
  product: Python http.server (SimpleHTTP)
  affected_versions: any
  author: "@karalabe"
  references:
    - https://docs.python.org/3/library/http.server.html

preconditions:
  ports_any: [8000, 8080]

probe:
  type: http
  method: GET
  path: /
  timeout: 3s
  match:
    status: [200]
    header_contains:
      Server: "SimpleHTTP/"
    body_contains_all:
      - "Directory listing for /"
    redact_body: true

remediation:
  summary: >
    A workstation or laptop is running Python's unauthenticated http.server
    bound to a LAN interface, exposing a browsable directory listing of local
    files to everyone on the network. Stop the temporary server or bind it
    strictly to localhost (--bind 127.0.0.1).
  unifi_actions:
    - stop_python_http_server_or_bind_localhost
