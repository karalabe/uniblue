id: UB-0003
title: Unauthenticated Modbus TCP Interface Exposed
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: Generic
  product: Modbus TCP Device (HVAC / Inverter / PLC)
  affected_versions: any
  author: "@uniblue"
  references:
    - https://cwe.mitre.org/data/definitions/306.html

preconditions:
  ports_any: [502]

probe:
  type: modbus
  port: 502
  timeout: 3s

remediation:
  summary: >
    Device responds to unauthenticated Modbus TCP requests on port 502.
    Modbus has no built-in authentication, allowing any reachable host on the
    LAN to read telemetry or alter operational registers (e.g., ventilation,
    heat pump, or inverter settings).
  unifi_actions:
    - move_to_iot_vlan
    - restrict_inter_vlan_access
    - block_wan_egress
