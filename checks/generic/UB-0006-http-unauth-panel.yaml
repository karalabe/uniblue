id: UB-0006
title: Unauthenticated Embedded Device Control Interface
cve: null
category: unauth-control
severity: medium
safety: read-only

metadata:
  vendor: Generic
  product: Embedded Web Control Panel (IoT / HVAC / Relay)
  affected_versions: any
  author: "@uniblue"
  references:
    - https://cwe.mitre.org/data/definitions/306.html

preconditions:
  ports_any: [80, 8080]
  http_status_any: [200]
  http_title_regex: "(?i)(tasmota|shelly|esphome|ventilation|hvac|inverter|modbus|smart\\s*meter|controller)"

probe:
  type: http
  method: GET
  path: /
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    redact_body: true

remediation:
  summary: >
    Embedded device exposes a web control interface without HTTP
    authentication. If the vendor does not support authentication, place the
    device on an isolated IoT VLAN and restrict access to trusted admin hosts.
  unifi_actions:
    - enable_web_authentication
    - move_to_iot_vlan
    - restrict_inter_vlan_access
