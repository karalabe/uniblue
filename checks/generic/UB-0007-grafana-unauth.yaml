id: UB-0007
title: Unauthenticated Grafana Organization API
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: Grafana Labs
  product: Grafana
  affected_versions: any
  author: "@karalabe"
  references:
    - https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/grafana/#anonymous-authentication

preconditions:
  ports_any: [3000]

probe:
  type: http
  method: GET
  path: /api/org
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - '"address":'
      - '"zipCode":'
    redact_body: true

remediation:
  summary: >
    Grafana's /api/org endpoint responded with HTTP 200 without credentials,
    confirming anonymous access is enabled (GF_AUTH_ANONYMOUS_ENABLED=true).
    Disable anonymous authentication unless dashboards are intentionally public.
  unifi_actions:
    - disable_grafana_anonymous_auth
    - restrict_inter_vlan_access
