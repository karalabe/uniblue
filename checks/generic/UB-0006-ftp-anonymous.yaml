id: UB-0006
title: Anonymous FTP Login Enabled
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: Generic
  product: FTP Server (NAS / Router USB / Android WiFi FTP App / Camera)
  affected_versions: any
  author: "@karalabe"
  references:
    - https://cwe.mitre.org/data/definitions/306.html

preconditions:
  ports_any: [21, 2121]

probe:
  type: ftp-anon
  timeout: 3s

grants:
  - effect: read
    basis: conditional
    requires: at least one file is shared for anonymous FTP download

remediation:
  summary: >
    FTP daemon accepted passwordless login as "anonymous" over cleartext TCP.
    Anonymous FTP is frequently left enabled on Android WiFi FTP apps (port
    2121), NAS media shares, old router USB storage, and IP cameras, exposing
    files to every host on the LAN. Disable anonymous FTP and migrate file
    transfers to SFTP or authenticated SMB3.
  unifi_actions:
    - disable_anonymous_ftp
    - restrict_inter_vlan_access
