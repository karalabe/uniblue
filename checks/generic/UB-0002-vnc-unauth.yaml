id: UB-0002
title: Unauthenticated VNC Remote Desktop
cve: null
category: unauth-control
severity: critical
safety: read-only

metadata:
  vendor: Generic
  product: VNC / RFB Server
  affected_versions: any
  author: "@karalabe"
  references:
    - https://cwe.mitre.org/data/definitions/306.html

preconditions:
  ports_any: [5900, 5901]

probe:
  type: vnc
  timeout: 3s

grants:
  - effect: read
    basis: implied
    when_field: session_accepted
    note: VNC accepted a connection with no password
  - effect: control
    basis: implied
    when_field: session_accepted
    note: VNC connected with no password (could still be view-only)
  - effect: configure
    basis: conditional
    when_field: session_accepted
    requires: the VNC session is not view-only
  - effect: pivot
    basis: conditional
    when_field: session_accepted
    requires: the VNC desktop user can reach other devices or services

remediation:
  summary: >
    VNC server advertises RFB security type "None", granting full remote
    graphical control without a password to any reachable host. Require a strong
    VNC password (or disable VNC if unused) and restrict remote screen sharing
    to trusted admin hosts.
  unifi_actions:
    - require_vnc_authentication_or_disable
    - restrict_inter_vlan_access
    - block_wan_egress
