id: UB-0017
title: Exposed Chrome / Chromium Remote Debugging Port (Session Hijack)
cve: null
category: unauth-rce
severity: critical
safety: read-only

metadata:
  vendor: Google / Generic
  product: Chrome / Chromium / Edge / Electron DevTools Protocol
  affected_versions: any (launched with --remote-debugging-port on LAN)
  author: "@karalabe"
  references:
    - https://chromedevtools.github.io/devtools-protocol/

preconditions:
  ports_any: [9222]

probe:
  type: http
  method: GET
  path: /json/version
  timeout: 3s
  match:
    status: [200]
    body_contains_all:
      - '"webSocketDebuggerUrl":'
      - '"Browser":'
    redact_body: true

remediation:
  summary: >
    A browser or Electron app on this workstation is exposing the Chrome
    DevTools Protocol on LAN port 9222 without authentication. Any device on
    the network can attach via WebSocket to read all open tabs, dump logged-in
    session cookies and saved passwords, or execute JavaScript in authenticated
    origins. Bind --remote-debugging-address strictly to 127.0.0.1 or close the
    debugging browser instance.
  unifi_actions:
    - bind_chrome_devtools_to_localhost
    - restrict_inter_vlan_access
