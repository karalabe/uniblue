id: UB-0001
title: Cleartext Telnet Service Exposed
cve: null
category: exposed-protocol
severity: high
safety: read-only

metadata:
  vendor: Generic
  product: Telnet Server
  affected_versions: any
  author: "@uniblue"
  references:
    - https://cwe.mitre.org/data/definitions/319.html

preconditions:
  ports_any: [23]

probe:
  type: tcp
  port: 23
  timeout: 3s

remediation:
  summary: >
    Device accepts cleartext Telnet connections on port 23. Credentials and
    commands sent over Telnet can be intercepted on the LAN, and embedded
    Telnet daemons frequently ship with hardcoded or default logins.
  unifi_actions:
    - disable_telnet_on_device
    - move_to_iot_vlan
    - restrict_inter_vlan_access
