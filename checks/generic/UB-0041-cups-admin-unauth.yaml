id: UB-0041
title: Unauthenticated CUPS Printer Administration Panel
cve: null
category: unauth-control
severity: high
safety: read-only

metadata:
  vendor: OpenPrinting
  product: CUPS Print Server
  affected_versions: any
  author: "@karalabe"
  references:
    - https://www.cups.org/doc/admin.html

preconditions:
  ports_any: [631]

probe:
  type: http
  method: GET
  path: /admin/conf/cupsd.conf
  timeout: 3s
  match:
    status: [200]
    headers_absent: ["WWW-Authenticate"]
    body_contains_any:
      - "<Location"
      - "<Policy"
      - "Listen "
      - "Port 631"
      - "DefaultAuthType"
      - "LogLevel"
    evidence_summary: "CUPS served /admin/conf/cupsd.conf without authentication"
    redact_body: true

remediation:
  summary: >
    CUPS exposed its admin configuration endpoint (/admin/conf/cupsd.conf) on
    port 631 without requiring HTTP authentication. Remote users on the LAN can
    add malicious printer queues, modify cupsd settings, or intercept jobs.
    Restrict /admin in cupsd.conf to localhost and require @SYSTEM authentication.
  unifi_actions:
    - require_cups_admin_auth
    - bind_cups_to_localhost
    - restrict_inter_vlan_access
