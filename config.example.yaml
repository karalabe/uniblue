# Minimal UniBlue configuration.
# Everything except your UniFi URL and credentials is inferred automatically
# (VLAN trust tiers, curated 30-port discovery list, local CVE cache path).
#
# You can even skip config.yaml altogether using environment variables:
#   UNIBLUE_UNIFI_URL=https://192.168.1.1
#   UNIBLUE_UNIFI_API_KEY=...

unifi:
  # Local URL of your UDM Pro / Cloud Gateway (or Cloud Key on :8443).
  url: "https://192.168.1.1"

  # Recommended (works with 2FA enabled on your UI.com account):
  # Settings -> Control Plane -> Integrations -> Create API Key
  api_key: ""

  # Optional fallback for older Cloud Keys without Integration API v1:
  # username: ""
  # password: ""   # or UNIBLUE_UNIFI_PASSWORD

# --- Optional Overrides (smart defaults apply when omitted) ---

