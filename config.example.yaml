#   # Assign entire switches/APs outside your secured physical building perimeter
#   # (by UniFi device name or MAC). UniBlue automatically flags unrestricted
#   # ports on these devices AND traces their indoor parent-switch feeder cable!
#   external_devices: ["Garage Switch"]
#
#   # Optional per-port physical perimeter overrides & MAC allowlists.
