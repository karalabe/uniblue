# Declarative fingerprint rules mapping observed LAN host signals to exact NVD
# CPE vendor/product tokens. Patterns without "*" require exact equality so
# generic names (e.g., "nginx") never bleed into unrelated products like
# "nginx_unit" or "nginx_controller".

- name: TrueNAS
  hostname_regex: "(?i)truenas"
  http_title_regex: "(?i)truenas"
  vendors: ["ixsystems"]
  products: ["truenas_firmware", "truenas"]

- name: Unraid
  hostname_regex: "(?i)unraid"
  http_title_regex: "(?i)unraid"
  vendors: ["unraid"]
  products: ["unraid"]

- name: Home Assistant
  hostname_regex: "(?i)home.?assistant"
  http_title_regex: "(?i)home\\s+assistant"
  ports_any: [8123]
  vendors: ["home-assistant"]
  products: ["home-assistant"]

- name: Grafana
  http_title_regex: "(?i)^grafana$"
  vendors: ["grafana"]
  products: ["grafana"]

- name: Pi-hole
  http_title_regex: "(?i)pi-hole"
  vendors: ["pi-hole"]
  products: ["pi-hole", "adminlte"]

- name: llama.cpp Server
  http_server_regex: "(?i)^llama\\.cpp"
  vendors: ["ggerganov", "llama.cpp"]
  products: ["llama.cpp"]

- name: HP LaserJet
  hostname_regex: "(?i)laserjet[^a-z0-9]*([a-z][0-9]{3,4})?"
  http_title_regex: "(?i)hp\\s+laserjet[^a-z0-9]*([a-z][0-9]{3,4})?"
  vendors: ["hp"]
  products: ["*laserjet*{model}*"]
  model_group: 1

- name: Prusa 3D Printer
  hostname_regex: "(?i)prusa"
  http_title_regex: "(?i)prusalink|prusa"
  vendors: ["prusa3d", "prusa"]
  products: ["*prusa*"]

- name: Zehnder ComfoConnect
  hostname_regex: "(?i)zehnder|comfoconnect|comfoair"
  mac_prefix: ["14:4f:d7"]
  vendors: ["zehnder"]
  products: ["*comfo*"]

- name: Marantz / Denon AVR
  hostname_regex: "(?i)marantz|denon"
  mac_prefix: ["00:05:cd"]
  vendors: ["marantz", "denon", "soundunited"]
  products: ["*avr*", "*marantz*", "*denon*"]

- name: iRobot Roomba
  hostname_regex: "(?i)roomba|irobot"
  mac_prefix: ["50:14:79"]
  vendors: ["irobot"]
  products: ["*roomba*"]

- name: Google Chromecast
  hostname_regex: "(?i)chromecast"
  vendors: ["google"]
  products: ["chromecast", "chromecast_firmware"]

- name: Synology DSM
  hostname_regex: "(?i)synology|diskstation"
  http_title_regex: "(?i)synology|diskstation"
  vendors: ["synology"]
  products: ["diskstation_manager"]

- name: Nginx
  http_server_regex: "(?i)nginx(?:/([0-9][0-9a-zA-Z._-]*))?"
  vendors: ["f5", "nginx"]
  products: ["nginx", "nginx_open_source"]
  version_group: 1

- name: Apache HTTP Server
  http_server_regex: "(?i)apache(?:/([0-9][0-9a-zA-Z._-]*))?"
  vendors: ["apache"]
  products: ["http_server"]
  version_group: 1

- name: Lighttpd
  http_server_regex: "(?i)lighttpd(?:/([0-9][0-9a-zA-Z._-]*))?"
  vendors: ["lighttpd"]
  products: ["lighttpd"]
  version_group: 1

- name: OpenSSH
  ssh_banner_regex: "(?i)OpenSSH[_-]([0-9]+\\.[0-9]+(?:p[0-9]+)?)"
  vendors: ["openbsd"]
  products: ["openssh"]
  version_group: 1

- name: Dropbear SSH
  ssh_banner_regex: "(?i)dropbear[_-]([0-9]+\\.[0-9]+)"
  vendors: ["dropbear_ssh_project"]
  products: ["dropbear_ssh"]
  version_group: 1

- name: CUPS Print Server
  http_server_regex: "(?i)CUPS/([0-9]+\\.[0-9]+(?:\\.[0-9]+)?)"
  vendors: ["openprinting", "apple"]
  products: ["cups"]
  version_group: 1

- name: Node-RED
  http_title_regex: "(?i)^node-red"
  ports_any: [1880]
  vendors: ["nodered", "openjsf"]
  products: ["node-red"]

- name: OctoPrint
  http_title_regex: "(?i)octoprint"
  vendors: ["octoprint"]
  products: ["octoprint"]

- name: Tasmota
  http_title_regex: "(?i)tasmota"
  vendors: ["tasmota"]
  products: ["tasmota"]

- name: Shelly
  hostname_regex: "(?i)^shelly"
  http_title_regex: "(?i)shelly"
  vendors: ["shelly", "allterco"]
  products: ["*shelly*"]

- name: Brother Printer
  hostname_regex: "(?i)^br[nw][0-9a-f]{6}"
  http_title_regex: "(?i)brother"
  vendors: ["brother"]
  products: ["*mfc*", "*hl-*", "*dcp-*"]

- name: Hikvision Camera
  http_server_regex: "(?i)(App-webs|DNVRS-Webs|Hikvision)"
  vendors: ["hikvision"]
  products: ["*ds-*", "*ip_camera*"]

- name: Kodi
  http_title_regex: "(?i)kodi|chorus"
  vendors: ["kodi", "xbmc"]
  products: ["kodi"]

- name: Transmission
  http_title_regex: "(?i)transmission web interface"
  ports_any: [9091]
  vendors: ["transmissionbt"]
  products: ["transmission"]

- name: Traefik
  http_title_regex: "(?i)^traefik$"
  vendors: ["traefik"]
  products: ["traefik"]

- name: Ollama
  ports_any: [11434]
  vendors: ["ollama"]
  products: ["ollama"]

- name: AMI MegaRAC / ASUS ASMB BMC
  hostname_regex: "(?i)(megarac|asmb|management console|ipmi|bmc)"
  http_title_regex: "(?i)(megarac|asmb|american megatrends|ikvm)"
  ports_any: [623, 5120, 5123, 7578]
  vendors: ["ami", "asus"]
  products: ["*megarac*", "*asmb*"]

- name: Supermicro IPMI / BMC
  hostname_regex: "(?i)(supermicro|ipmi)"
  http_title_regex: "(?i)(supermicro|aten)"
  vendors: ["supermicro"]
  products: ["*bmc*", "*ipmi*", "*x10*", "*x11*", "*x12*"]

- name: Dell iDRAC
  hostname_regex: "(?i)idrac"
  http_title_regex: "(?i)idrac|integrated dell remote access"
  vendors: ["dell"]
  products: ["*idrac*"]

- name: HPE iLO
  hostname_regex: "(?i)(^|[-_.])ilo([0-9]|$)"
  http_title_regex: "(?i)ilo\\s*[0-9]|integrated lights-out"
  vendors: ["hp", "hpe"]
  products: ["*integrated_lights-out*", "*ilo*"]

- name: Intel AMT / vPro
  ports_any: [16992, 16993]
  http_title_regex: "(?i)intel.*active management"
  vendors: ["intel"]
  products: ["*active_management_technology*"]
