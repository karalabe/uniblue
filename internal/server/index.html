function wifiSecurityBadge(w) {
  const sec = (w.security || "").toLowerCase().trim();
  const mode = (w.wpa_mode || "").toLowerCase().trim();
  if (sec === "open" || sec === "") return { label: "Open (no password)", tone: "crit" };
  if (sec === "wep") return { label: "Legacy (WEP)", tone: "crit" };
  if (mode === "wpa1") return { label: "Legacy (WPA1)", tone: "warn" };
  if (mode === "wpa3" || w.wpa3_support) {
    return { label: mode === "wpa3" ? "Modern (WPA3)" : "Modern (WPA2/WPA3)", tone: "ok" };
  }
  if (mode === "wpa2" || sec === "wpapsk" || sec === "wpaeap") {
    return { label: sec === "wpaeap" ? "Enterprise (WPA2)" : "Standard (WPA2)", tone: "neutral" };
  }
  return { label: w.security || "Unknown", tone: "neutral" };
}

function renderDevices() {
  const vm = state.view;
  if (!vm) return;
  const c = vm.census || {};
  const wanIPSet = new Set((vm.wan_flows || []).map(f => (f.target_ip || "").toLowerCase()).filter(Boolean));
  const wanTargetIDSet = new Set((vm.wan_flows || []).map(f => f.target_id).filter(Boolean));
  const allHosts = Object.values(vm.entities || {}).filter(e => e.kind === "host");
  const totalHosts = allHosts.length;
  const hostCVECount = allHosts.filter(e => e.exact_cve_count > 0).length;

  const isHostWANExposed = (ent) => {
    if (wanTargetIDSet.has(ent.id)) return true;
    if (ent.ip && wanIPSet.has(ent.ip.toLowerCase())) return true;
    for (const ip6 of (ent.ipv6 || [])) {
      if (ip6 && wanIPSet.has(ip6.toLowerCase())) return true;
    }
    return false;
  };

  const matchHost = (ent) => {
    if (!ent) return false;
    if (deviceFilter === "issues" && ent.state !== "exposed") return false;
    if (deviceFilter === "bmc" && !ent.is_bmc) return false;
    if (deviceFilter === "cve" && !(ent.exact_cve_count > 0)) return false;
    if (deviceFilter === "wan" && !isHostWANExposed(ent)) return false;
    if (deviceFilter === "checking" && (ent.state !== "unknown" || ent.skipped)) return false;
    if (deviceSearch) {
      const hay = [ent.label, ent.ip, ent.mac, ent.network_name, ent.role, humanRole(ent.role, ent.is_bmc), ent.vendor, (ent.services || []).map(s => s.label + " " + s.port).join(" "), (ent.reasons || []).map(r => r.ref + " " + r.title).join(" ")].join(" ").toLowerCase();
      if (!hay.includes(deviceSearch.toLowerCase())) return false;
    }
    return true;
  };

  let html = `
  <div class="bar">
    <div class="seg" style="flex-wrap:wrap">
      <button class="seg-b ${deviceFilter === "all" ? "active" : ""}" data-action="device-filter" data-filter="all">All (${totalHosts})</button>
      <button class="seg-b ${deviceFilter === "issues" ? "active" : ""}" data-action="device-filter" data-filter="issues">Needs attention</button>
      ${c.bmc_count ? `<button class="seg-b ${deviceFilter === "bmc" ? "active" : ""}" data-action="device-filter" data-filter="bmc">Hardware controls (${c.bmc_count})</button>` : ""}
      ${hostCVECount ? `<button class="seg-b ${deviceFilter === "cve" ? "active" : ""}" data-action="device-filter" data-filter="cve">Security updates (${hostCVECount})</button>` : ""}
      <button class="seg-b ${deviceFilter === "wan" ? "active" : ""}" data-action="device-filter" data-filter="wan">Open to internet</button>
      ${c.unassessed_count ? `<button class="seg-b ${deviceFilter === "checking" ? "active" : ""}" data-action="device-filter" data-filter="checking">Checking (${c.unassessed_count})</button>` : ""}
    </div>
    <div class="search-box">
      <span class="muted">${ICONS.search}</span>
      <input id="dev-search" type="search" value="${esc(deviceSearch)}" placeholder="Search device, network, or IP…">
    </div>
  </div>`;

  let shown = 0;
  for (const lane of (vm.logical || [])) {
    const bmcs = (lane.bmc_ids || []).map(id => vm.entities[id]).filter(matchHost);
    const otherIDs = [...(lane.pinned_host_ids || []), ...(lane.unknown_host_ids || []), ...(lane.clean_host_ids || [])];
    const others = otherIDs.map(id => vm.entities[id]).filter(matchHost);
    if ((deviceFilter !== "all" || deviceSearch) && !bmcs.length && !others.length) continue;
    shown += bmcs.length + others.length;

    const expN = [...(lane.bmc_ids || []), ...otherIDs].map(id => vm.entities[id]).filter(e => e?.state === "exposed").length;
    const cont = lane.containment || null;
    const archLabel = cont && cont.archetype && cont.archetype !== "isolated"
      ? ({ guest: "Guest", iot: "IoT", camera: "Cameras" }[cont.archetype] || cont.archetype)
      : "";
    const peerState = cont?.peers?.state;
    const peerIssue = ["open", "partial", "unknown"].includes(peerState);
    const zoneExplain = peerIssue ? cont.peers.detail
      : (lane.isolated ? "Inter-network isolation configured." : "Shared network.");
    const axisChip = (label, axis, openIsOK) => {
      if (!axis || !axis.state) return "";
      const st = axis.state;
      let tone = "neutral";
      if (axis.violation) tone = "crit";
      else if (st === "isolated" || st === "blocked" || st === "restricted" || (openIsOK && st === "open")) tone = "ok";
      else if (st === "unknown" || st === "partial") tone = "warn";
      else if (st === "open") tone = "warn";
      return `<span class="tag ${tone}" title="${esc(axis.detail || "")}">${esc(label)}: ${esc(st)}</span>`;
    };
    const contStrip = cont
      ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
          ${axisChip("Peers", cont.peers, false)}
          ${axisChip("LAN egress", cont.lan_egress, false)}
          ${axisChip("Internet", cont.internet_egress, cont.archetype === "guest")}
          ${axisChip("LAN inbound", cont.lan_inbound, false)}
        </div>`
      : "";

    const netEnt = lane.network_id ? vm.entities?.[lane.network_id] : null;
    const netIssueCount = netEnt ? (netEnt.reasons || []).length : 0;
    html += `<div class="zone-card">
      <div class="zone-hd" style="border-left-color:${vlanColor(lane.name)}">
        <div>
          <div class="zone-title">
            <span>${esc(lane.name)}</span>
            ${peerIssue
              ? `<span class="tag warn">${peerState === "unknown" ? "Peer isolation unverified" : "Peer isolation needs attention"}</span>`
              : lane.isolated ? `<span class="tag neutral">${ICONS.lock} Network isolation configured</span>`
              : `<span class="tag blue">${ICONS.house} Shared</span>`}
            ${archLabel ? `<span class="tag neutral" title="${esc(cont.archetype_reason || "")}">${esc(archLabel)}</span>` : ""}
            ${lane.vlan ? `<span class="small mono">VLAN ${esc(lane.vlan)}</span>` : ""}
          </div>
          <div class="zone-desc">${esc(zoneExplain)}</div>
          ${contStrip}
        </div>
        <div class="small" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span><strong>${bmcs.length + others.length}</strong> device${(bmcs.length + others.length) === 1 ? "" : "s"}${expN ? ` · <strong style="color:var(--crit)">${expN} need attention</strong>` : ""}</span>
          ${netEnt && netIssueCount ? `<button class="btn sm" data-entity-id="${esc(lane.network_id)}">Inspect (${netIssueCount})</button>` : ""}
        </div>
      </div>`;

    if (lane.migration_hint && deviceFilter === "all" && !deviceSearch) {
      html += `<div class="zone-tip">💡 Tip: Moving smart-home gadgets with warnings from your main network into <strong>${esc(lane.name)}</strong> can reduce their access once containment is verified.</div>`;
    }

    if (bmcs.length) {
      html += `<div class="bmc-band">${ICONS.cpu} Server hardware remote controls on ${esc(lane.name)}: best kept on their own private admin network</div>`;
      html += bmcs.map(e => renderDeviceRow(vm, e)).join("");
    }
    if (others.length) {
      html += others.map(e => renderDeviceRow(vm, e)).join("");
    } else if (!bmcs.length) {
      html += `<div class="empty">No devices currently connected to ${esc(lane.name)}.</div>`;
    }
    html += `</div>`;
  }

  if (!shown && (deviceFilter !== "all" || deviceSearch)) {
    html += `<div class="card"><div class="empty">No devices match your current filter.</div></div>`;
  }

  // Wi-Fi Networks
  const wlans = state.report?.unifi_posture?.wlans || [];
  if (wlans.length && deviceFilter === "all" && !deviceSearch) {
    html += `<div class="card">
      <div class="card-hd">
        <div class="card-title">${ICONS.wifi} Your Wi-Fi Networks (${wlans.length})</div>
        <span class="small">${state.report?.unifi_posture?.neighbor_aps || 0} neighboring Wi-Fi routers nearby</span>
      </div>
      <div class="wifi-grid">
        ${wlans.map(w => {
          const isDisabled = w.enabled === false;
          const badge = wifiSecurityBadge(w);
          const encTone = isDisabled ? "neutral" : badge.tone;
          return `<div class="wifi-card"${isDisabled ? ` style="opacity:.65"` : ""}>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
              <strong style="font-size:15px">${esc(w.name)}</strong>
              <span style="display:inline-flex;gap:5px">
                ${isDisabled ? `<span class="tag neutral">Disabled</span>` : ""}
                ${w.is_guest ? `<span class="tag blue">Guest</span>` : ""}
              </span>
            </div>
            <div class="small" style="margin-bottom:10px">${isDisabled ? "Disabled SSID · " : ""}Connects to <strong>${esc(w.network_name || "Main")}</strong> network</div>
            <div class="pills">
              <span class="tag ${encTone}">${esc(badge.label)}</span>
              <span class="tag ${!isDisabled && w.l2_isolation ? "ok" : "neutral"}">${w.l2_isolation ? "Devices isolated" : "Devices can talk"}</span>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  // Internet Port Forwards
  const wanFlows = (vm.wan_flows || []).filter(f => f.kind === "forward");
  if (wanFlows.length && (deviceFilter === "all" || deviceFilter === "wan")) {
    html += `<div class="card">
      <div class="card-hd">
        <div class="card-title">${ICONS.globe} Open Doors to the Internet (${wanFlows.length})</div>
        <span class="small">Traffic from outside your home forwarded by your router</span>
      </div>`;
    for (const f of wanFlows) {
      const target = f.target_id || vm.gateway_id || "";
      html += `<div class="story-item" ${target ? `data-entity-id="${esc(target)}"` : ""}>
        <div class="story-item-l">
          <div class="story-item-name">${esc(f.rule_name)} <span class="tag ${f.expected ? "neutral" : humanStateTone(f.severity)}">${f.expected ? "Normal P2P" : "Review"}</span></div>
          <div class="story-item-sub">Sends internet traffic to <strong>${esc(f.target_name || f.target_ip)}</strong> · <span class="mono">${esc(f.label)}</span></div>
        </div>
        <div class="story-item-r"><span class="go-arrow">Inspect →</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  if (patchContainerHTML(document.getElementById("view-devices"), html)) {
    const sEl = document.getElementById("dev-search");
    if (sEl) {
      sEl.addEventListener("input", e => {
        deviceSearch = e.target.value;
        renderDevices();
      });
    }
  }
}

function renderDeviceRow(vm, ent) {
  const portEnt = ent.port_id ? vm.entities[ent.port_id] : null;
  const connHTML = portEnt
    ? `<span class="tag click ${portEnt.state === "exposed" ? humanStateTone(portEnt) : ""}" data-stop-entity-id="${esc(portEnt.id)}">${ICONS.plug} ${esc(portEnt.label)}</span>`
    : (ent.essid
      ? `<span class="tag neutral">${ICONS.wifi} ${esc(ent.essid)}</span>`
      : `<span class="small">${ent.is_wired ? "Wired cable" : "Wi-Fi"}</span>`);

  const pills = [];
  if (ent.exact_cve_count) {
    pills.push(`<span class="tag ${humanStateTone(ent)}">${ent.exact_cve_count} security bug${ent.exact_cve_count === 1 ? "" : "s"}</span>`);
  }
  if (ent.child_ids && ent.child_ids.length) {
    pills.push(`<span class="tag blue">+${ent.child_ids.length} managed</span>`);
  }
  const seenWanPorts = new Set();
  const seenExposedLabels = new Set();
  for (const svc of (ent.services || [])) {
    if (svc.exposed) {
      const chip = humanServiceChip(svc);
      if (seenExposedLabels.has(chip)) continue;
      seenExposedLabels.add(chip);
      pills.push(`<span class="tag ${humanStateTone(svc.severity)}">${esc(chip)}</span>`);
    } else if (svc.reachable === "wan" || svc.reachable === "wan-restricted" || svc.reachable === "wan-cgnat") {
      const colonIdx = (svc.label || "").indexOf(":");
      const labelPortPart = colonIdx >= 0 ? svc.label.slice(colonIdx + 1).trim().split(/\s+/)[0] : "";
      const portDisp = /^\d+-\d+$/.test(labelPortPart) ? labelPortPart : String(svc.port);
      const wKey = `${svc.reachable}:${portDisp}`;
      if (seenWanPorts.has(wKey)) continue;
      seenWanPorts.add(wKey);
      if (svc.reachable === "wan") pills.push(`<span class="tag blue">Internet :${esc(portDisp)}</span>`);
      else if (svc.reachable === "wan-restricted") pills.push(`<span class="tag blue">Internet (restricted) :${esc(portDisp)}</span>`);
      else pills.push(`<span class="tag neutral">Forward (CGNAT) :${esc(portDisp)}</span>`);
    }
  }
  if (!pills.length) {
    pills.push(`<span class="tag ${humanStateTone(ent)}">${esc(humanStateLabel(ent))}</span>`);
  }

  return `<div class="dev-row" data-entity-id="${esc(ent.id)}">
    <div class="dev-id">
      <div class="dev-ico">
        ${roleIcon(ent.role, ent.is_bmc)}
        <span class="sbadge ${humanStateTone(ent)}"></span>
      </div>
      <div style="min-width:0">
        <div class="dev-name">${esc(ent.label)}</div>
        <div class="dev-meta">${esc(humanRole(ent.role, ent.is_bmc))}${ent.vendor ? " · " + esc(ent.vendor) : ""} · <span class="mono">${esc(ent.ip || "")}</span></div>
      </div>
    </div>
    <div>${connHTML}</div>
    <div class="pills">${pills.join("")}</div>
    <div class="go-arrow">Inspect →</div>
  </div>`;
}

/* ============================================================================
   TAB 4: ACTIVITY (Friendly Chronological Timeline)
   ========================================================================== */
function renderActivity() {
  const vm = state.view || { entities: {} };
  const logs = [];
  const seen = new Set();

  for (const ev of (state.events || [])) {
    logs.push({ time: ev.time, severity: ev.severity || "info", type: ev.type || "event", summary: ev.summary, subject: ev.subject_id || "", ip: ev.ip || "" });
    seen.add(ev.summary);
  }
  for (const lg of (state.report?.unifi_posture?.recent_logs || [])) {
    if (seen.has(lg.message)) continue;
    let t = "controller";
    const evName = (lg.event || "").toUpperCase();
    if (lg.category === "ADMIN") t = "admin_activity";
    else if (evName.includes("HONEYPOT")) t = "honeypot_hit";
    else if (lg.category === "SECURITY" || evName.includes("THREAT")) t = "ids_threat";
    else if (evName.includes("VPN")) t = "vpn_connected";
    logs.push({ time: lg.timestamp, severity: lg.severity || "info", type: t, summary: lg.message || lg.event, subject: "", ip: lg.src_ip || "", dst_ip: lg.dst_ip || "" });
  }
  logs.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));

  const filtered = logs.filter(ev => {
    const t = ev.type.toLowerCase();
    if (activityFilter === "threats") return t.includes("threat") || t.includes("honeypot") || t.includes("evil") || t.includes("tamper") || t.includes("surge") || t.includes("spike") || t.includes("finding");
    if (activityFilter === "ports") return t.startsWith("port_");
    if (activityFilter === "clients") return t.startsWith("client_") || t.startsWith("vpn_") || t.includes("host_scan");
    if (activityFilter === "admin") return t.includes("admin") || t.includes("policy") || t.includes("config") || t.includes("wan_");
    return true;
  });

  const entByIP = {};
  for (const e of Object.values(vm.entities || {})) {
    if (e.kind === "host" || e.kind === "device") {
      if (e.ip) entByIP[e.ip] = e.id;
      for (const v6 of (e.ipv6 || [])) {
        if (v6) entByIP[v6] = e.id;
      }
    }
  }

  const actHTML = `
    <div class="bar">
      <div class="seg" style="flex-wrap:wrap">
        ${[["all", "Everything (" + logs.length + ")"], ["threats", "Security alerts"], ["ports", "Cables"], ["clients", "Devices & VPN"], ["admin", "Settings"]].map(([k, lbl]) =>
          `<button class="seg-b ${activityFilter === k ? "active" : ""}" data-action="activity-filter" data-filter="${k}">${lbl}</button>`
        ).join("")}
      </div>
      <span class="small">Live updates + past 24 hours from your router</span>
    </div>
    <div class="card">
      ${filtered.length ? filtered.map(ev => {
        let rawTarget = ev.subject || (ev.ip ? entByIP[ev.ip] : "") || (ev.dst_ip ? entByIP[ev.dst_ip] : "") || "";
        if (rawTarget.startsWith("host:vlan:")) rawTarget = "net:" + rawTarget.slice("host:vlan:".length);
        const target = (rawTarget && vm.entities && vm.entities[rawTarget]) ? rawTarget : "";
        const ht = humanEventType(ev.type);
        const clickAttr = target ? ` class="act-row clickable" data-entity-id="${esc(target)}"` : ` class="act-row"`;
        const isOfflineHost = !target && rawTarget.startsWith("host:") && !/^host:(vlan|iso|gw|wlan):/i.test(rawTarget);
        return `<div${clickAttr}>
          <div class="act-l">
            <span class="act-time mono">${fmtTime(ev.time)}</span>
            <span class="tag ${ht.tone}">${esc(ht.label)}</span>
            <span style="font-weight:500">${esc(ev.summary)}</span>
          </div>
          ${target ? `<span class="go-arrow">Inspect →</span>` : (isOfflineHost ? `<span class="small" style="color:var(--muted)">Offline</span>` : "")}
        </div>`;
      }).join("") : `<div class="empty">No matching activity yet.</div>`}
    </div>`;
  patchContainerHTML(document.getElementById("view-activity"), actHTML);
}

/* ============================================================================
   SLIDE-OVER INSPECTOR DRAWER (Human First + Collapsible Technical Details)
   ========================================================================== */
function plainSummaryForEntity(vm, ent) {
  if (ent.kind === "port") {
    const peers = peerNamesForPort(vm, ent);
    const where = ent.port_zone === "external_uplink"
      ? "This socket feeds a cable running outside your house."
      : (ent.side === "outside" ? "This socket is on an outdoor switch." : "This is an indoor switch socket.");
    const conn = peers.length
      ? ` Connected to <strong>${esc(peers.join(", "))}</strong>.`
      : (ent.port_state === "disabled" ? " Currently turned off." : " Nothing is plugged in right now.");
    return where + conn;
  }
  if (ent.kind === "host") {
    if (ent.skipped && ent.state === "unknown") {
      return `Active probing was skipped for <strong>${esc(ent.label)}</strong>${ent.skip_reason ? ` (${esc(ent.skip_reason)})` : ""}.`;
    }
    if (ent.state === "unknown") {
      return `UniBlue hasn't finished checking <strong>${esc(ent.label)}</strong> yet. Once scanned, any open services or outdated software will appear right here.`;
    }
    if (ent.is_bmc) {
      return `This is a server's built-in <strong>hardware remote control (BMC)</strong>. It gives direct power, BIOS, and virtual keyboard access even when the server is off; keep it isolated from everyday devices.`;
    }
    if (ent.state === "exposed") {
      const bits = [];
      if (ent.exact_cve_count) bits.push(`${ent.exact_cve_count} known security bug${ent.exact_cve_count === 1 ? "" : "s"} in its software`);
      const nonCVE = (ent.reasons || []).filter(r => r.kind !== "cve").length;
      if (nonCVE) bits.push(`${nonCVE} configuration or protocol warning${nonCVE === 1 ? "" : "s"}`);
      return `<strong>${esc(ent.label)}</strong> has ${bits.join(" and ")}. Follow the steps below to resolve ${bits.length > 1 ? "them" : "it"}.`;
    }
    return `<strong>${esc(ent.label)}</strong> looks healthy. We checked its open services and software versions and found no active problems.`;
  }
  if (ent.kind === "child") {
    const parent = ent.parent_id ? vm.entities[ent.parent_id] : null;
    return `<strong>${esc(ent.label)}</strong> is a downstream device reported by ${parent ? `<strong>${esc(parent.label)}</strong>` : "its parent bridge/recorder"} (source: ${esc(ent.identity_source || "bridge inventory")}). Direct reachability from the reporting LAN is <strong>${esc(ent.direct_lan_reachability || "unknown")}</strong>.`;
  }
  if (ent.kind === "network") {
    const count = (ent.reasons || []).length;
    return count
      ? `<strong>${esc(ent.label)}</strong> (${esc(ent.subtitle || "network")}) has ${count} isolation item${count === 1 ? "" : "s"} worth reviewing below.`
      : `<strong>${esc(ent.label)}</strong> (${esc(ent.subtitle || "network")}) matches its configured isolation policy.`;
  }
  if (ent.kind === "device") {
    const count = (ent.reasons || []).length;
    return count
      ? `<strong>${esc(ent.label)}</strong> (${esc(ent.model || "UniFi device")}) has ${count} item${count === 1 ? "" : "s"} worth reviewing below.`
      : `<strong>${esc(ent.label)}</strong> (${esc(ent.model || "UniFi device")}) is operating cleanly.`;
  }
  return `Review this security rule below to make sure it matches what you want allowed on your network.`;
}

function isInternalIP(ip) {
  if (!ip) return false;
  const s = String(ip).trim().toLowerCase();
  if (!s) return false;
  if (s.startsWith("10.") || s.startsWith("192.168.") || /^172\.(1[6-9]|2\d|3[01])\./.test(s) || /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(s) || s.startsWith("127.") || s.startsWith("169.254.")) {
    return true;
  }
  if (s === "::1" || /^f[cd][0-9a-f]{2}:/.test(s) || /^fe[89ab][0-9a-f]:/.test(s)) {
    return true;
  }
  const entities = state?.view?.entities || {};
  for (const ent of Object.values(entities)) {
    if (!ent) continue;
    if (ent.ip && String(ent.ip).toLowerCase() === s) return true;
    for (const ip6 of (ent.ipv6 || [])) {
      if (ip6 && String(ip6).toLowerCase() === s) return true;
    }
  }
  return false;
}

function hostSecurityLogs(ent) {
  if (!ent || ent.kind !== "host") return [];
  const ips = new Set();
  if (ent.ip) ips.add(ent.ip.toLowerCase());
  for (const ip6 of (ent.ipv6 || [])) {
    if (ip6) ips.add(ip6.toLowerCase());
  }
  if (ips.size === 0) return [];
  const out = [];
  const seen = new Set();
  for (const lg of (state?.report?.unifi_posture?.recent_logs || [])) {
    const evName = (lg.event || "").toUpperCase();
    const isThreat = evName.includes("HONEYPOT") || lg.category === "SECURITY" || evName.includes("THREAT");
    if (!isThreat) continue;
    const srcLow = (lg.src_ip || "").toLowerCase();
    const dstLow = (lg.dst_ip || "").toLowerCase();
    const isSrc = srcLow !== "" && ips.has(srcLow);
    const isDst = dstLow !== "" && ips.has(dstLow);
    if (!isSrc && !isDst) continue;
    const key = (lg.timestamp || "") + "|" + (lg.message || lg.event || "");
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({
      time: lg.timestamp,
      severity: lg.severity || "high",
      type: evName.includes("HONEYPOT") ? "honeypot_hit" : "ids_threat",
      message: lg.message || lg.event,
      src_ip: lg.src_ip || "",
      dst_ip: lg.dst_ip || "",
      direction: isSrc ? "outbound" : "inbound"
    });
  }
  out.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
  return out;
}

function renderDrawer() {
  const vm = state?.view;
  const id = currentDrawerID();
  if (!vm || !id) return;
  if (id.startsWith("panel:isolation:")) {
    renderIsolationPanelDrawer(vm, id.slice("panel:isolation:".length));
    return;
  }
  if (id === "panel:coverage") {
    renderCoveragePanelDrawer(vm);
    return;
  }
  if (!vm.entities[id]) return;
  const ent = vm.entities[id];
  const tone = humanStateTone(ent);
  const hostAlerts = hostSecurityLogs(ent);
  const hasOutboundAlert = hostAlerts.some(a => a.direction === "outbound" || a.type === "honeypot_hit");
  const alertOnlyHost = ent.kind === "host" && ent.state === "ok" && hostAlerts.length > 0;
  const summaryTone = alertOnlyHost ? (hasOutboundAlert ? "crit" : "warn") : (tone === "unk" ? "blue" : tone);
  const summaryText = alertOnlyHost
    ? (hasOutboundAlert
      ? `<strong>${esc(ent.label)}</strong> has no open-port vulnerabilities, but your UniFi router blocked <strong>${hostAlerts.length} security alert${hostAlerts.length === 1 ? "" : "s"} originating from this device</strong> in the last 24h. Review the alert${hostAlerts.length === 1 ? "" : "s"} below.`
      : `<strong>${esc(ent.label)}</strong> has no open-port vulnerabilities, and your UniFi router blocked <strong>${hostAlerts.length} inbound intrusion attempt${hostAlerts.length === 1 ? "" : "s"} targeting this device</strong> in the last 24h.`)
    : plainSummaryForEntity(vm, ent);

  const hdHTML = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      ${drawerStack.length > 1 ? `<button class="btn sm" data-action="pop-drawer">← Back</button>` : ""}
      ${alertOnlyHost
        ? `<span class="tag ${hasOutboundAlert ? "crit" : "warn"}">Router alert (${hostAlerts.length})</span><span class="tag neutral">Services clean</span>`
        : `<span class="tag ${tone}">${esc(humanStateLabel(ent))}</span>`}
      ${!alertOnlyHost && hostAlerts.length ? `<span class="tag ${hasOutboundAlert ? "crit" : "warn"}">${hostAlerts.length} router alert${hostAlerts.length === 1 ? "" : "s"}</span>` : ""}
      ${ent.is_bmc ? `<span class="tag warn">Hardware Control</span>` : ""}
      ${ent.side === "outside" ? `<span class="tag neutral">Outside House</span>` : ""}
      ${!isStaticMode && ent.kind === "host" && (ent.ip || (ent.ipv6 && ent.ipv6.length)) ? `<button class="btn sm" data-action="rescan" data-rescan-ip="${esc(ent.ip || ent.ipv6[0])}">Recheck</button>` : ""}
    </div>
    <div style="font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2">${esc(ent.label)}</div>
    <div class="small" style="margin-top:3px">${esc(ent.kind === "host" ? humanRole(ent.role, ent.is_bmc) : (ent.subtitle || ent.model || ""))}${ent.network_name ? ` · ${esc(ent.network_name)} network` : ""}${ent.ip ? ` · <span class="mono">${esc(ent.ip)}</span>` : ""}</div>`;
  patchContainerHTML(document.getElementById("drawer-hd-content"), hdHTML);

  let b = `<div class="summary-box ${summaryTone}">${summaryText}</div>`;

  // 0. Recent UniFi Router Security Alerts (IPS / Honeypot) involving this host
  if (hostAlerts.length) {
    b += `<div class="dsec"><div class="dsec-t">Recent Router Security Alerts (${hostAlerts.length})</div>`;
    for (const al of hostAlerts) {
      const aTone = (al.direction === "outbound" || al.type === "honeypot_hit") ? "crit" : "warn";
      const title = al.type === "honeypot_hit"
        ? "Triggered UniFi internal honeypot"
        : (al.direction === "outbound"
          ? `Blocked outbound threat${al.dst_ip ? " → " + al.dst_ip : ""}`
          : `Blocked inbound threat${al.src_ip ? " from " + al.src_ip : ""}`);
      let hint = "Verify no unnecessary ports are forwarded to this device from the internet.";
      if (al.direction === "outbound") {
        hint = isInternalIP(al.dst_ip)
          ? `Your router's IPS blocked traffic from this device to internal IP ${al.dst_ip}. If UniBlue or another network scanner is running on this machine, its probes can trigger UniFi IPS. Otherwise, check what app on this device is scanning your LAN.`
          : `Your router's IPS blocked suspicious outbound traffic from this device${al.dst_ip ? " to " + al.dst_ip : ""}. Inspect running apps and recent downloads on this device.`;
      }
      b += `<div class="fix-card ${aTone}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
          <strong style="font-size:14.5px">${esc(title)}</strong>
          <span class="tag ${aTone}">${esc(fmtTime(al.time))}</span>
        </div>
        <div class="small" style="margin-top:6px;color:var(--text-2)">${esc(al.message)}</div>
        <div class="fix-step"><strong>What to check:</strong> ${esc(hint)}</div>
      </div>`;
    }
    b += `</div>`;
  }

  // 1. Known Software Security Bugs (Exact CVEs, always prominently at the top)
  if (ent.exact_cves && ent.exact_cves.length) {
    b += `<div class="dsec"><div class="dsec-t">Software Updates Needed (${ent.exact_cve_count} known bug${ent.exact_cve_count === 1 ? "" : "s"})</div>`;
    for (const s of ent.exact_cves) {
      const fixTxt = s.min_fixed_version
        ? `Update ${s.product.label} to version ${s.min_fixed_version} or newer.`
        : `Install the latest security updates for ${s.product.label} on this device.`;
      b += `<div class="fix-card ${humanStateTone(s.max_severity)}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <strong style="font-size:14.5px">${esc(s.product.label)} ${esc(s.product.version || "")}</strong>
          <span class="tag ${humanStateTone(s.max_severity)}">${s.total_cves} CVE${s.total_cves === 1 ? "" : "s"} · CVSS ${Number(s.max_cvss).toFixed(1)}</span>
        </div>
        <div class="small" style="margin-top:5px;color:var(--text-2)">
          This exact version has ${s.total_cves} publicly documented security flaw${s.total_cves === 1 ? "" : "s"}${s.kev_count ? ` (${s.kev_count} actively exploited in the wild)` : ""}.
        </div>
        <div class="fix-step"><strong>How to fix:</strong> ${esc(fixTxt)}</div>
        <div class="small mono" style="margin-top:8px">${esc((s.top_cves || []).join(", "))}</div>
      </div>`;
    }
    b += `</div>`;
  }

  // 2. Plain-English Findings & Fix Steps
  const nonCVE = (ent.reasons || []).filter(r => r.kind !== "cve");
  if (nonCVE.length) {
    b += `<div class="dsec"><div class="dsec-t">What Needs Attention (${nonCVE.length})</div>`;
    for (const r of nonCVE) {
      const hr = humanReason(r, ent);
      const rTone = r.state === "exposed" ? humanStateTone(r.severity) : "warn";
      const portTag = r.port ? ` (port ${r.port})` : "";
      const titleWithPort = hr.title.includes(String(r.port || "")) ? hr.title : (hr.title + portTag);
      const showEvidence = r.evidence && r.evidence !== hr.why && r.evidence !== hr.title;
      b += `<div class="fix-card ${rTone}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <strong style="font-size:14.5px">${esc(titleWithPort)}</strong>
          <span class="tag ${rTone}">${r.severity === "critical" ? "Urgent" : (r.state === "review" ? "Review" : "Fix")}</span>
        </div>
        ${hr.why ? `<div class="small" style="margin-top:6px;color:var(--text-2)">${esc(hr.why)}</div>` : ""}
        ${showEvidence ? `<div class="small mono" style="margin-top:5px;color:var(--muted)">Observed: ${esc(r.evidence)}</div>` : ""}
        ${hr.fix ? `<div class="fix-step"><strong>How to fix:</strong> ${esc(hr.fix)}</div>` : ""}
      </div>`;
    }
    b += `</div>`;
  }

  // 3. Connected To (clickable cross-links with Back stack)
  const links = [];
  if (ent.kind === "host") {
    if (ent.port_id && vm.entities[ent.port_id]) {
      const pe = vm.entities[ent.port_id];
      links.push({ id: pe.id, icon: ICONS.plug, title: `Plugged into ${pe.label}`, sub: `${pe.native_vlan || "Main"} network${pe.poe_enabled && pe.poe_power ? " · Powered (" + pe.poe_power + "W)" : ""}` });
    } else if (ent.ap_id && vm.entities[ent.ap_id]) {
      const ap = vm.entities[ent.ap_id];
      links.push({ id: ap.id, icon: ICONS.wifi, title: `Connected to ${ap.label}`, sub: ent.essid ? `Wi-Fi: ${ent.essid}` : "Wireless connection" });
    }
  } else if (ent.kind === "port") {
    if (ent.device_id && vm.entities[ent.device_id]) {
      const sw = vm.entities[ent.device_id];
      links.push({ id: sw.id, icon: ICONS.server, title: `On switch ${sw.label}`, sub: sw.model || "UniFi Switch" });
    }
    for (const pid of (ent.peer_ids || [])) {
      const peer = vm.entities[pid];
      if (peer) links.push({ id: peer.id, icon: roleIcon(peer.role, peer.is_bmc), title: peer.label, sub: `Connected device · ${humanStateLabel(peer)}` });
    }
  } else if (ent.kind === "child" && ent.parent_id && vm.entities[ent.parent_id]) {
    const par = vm.entities[ent.parent_id];
    links.push({ id: par.id, icon: roleIcon(par.role, par.is_bmc), title: `Managed by ${par.label}`, sub: `Parent bridge / recorder · ${esc(ent.identity_source || "inventory")}` });
  }
  if (ent.child_ids && ent.child_ids.length) {
    for (const cid of ent.child_ids) {
      const ch = vm.entities[cid];
      if (ch) links.push({ id: ch.id, icon: roleIcon(ch.role, false), title: ch.label, sub: `${ch.model || ch.subtitle || "Child device"} · Direct LAN: ${ch.direct_lan_reachability || "unknown"}` });
    }
  }
  if (links.length) {
    b += `<div class="dsec"><div class="dsec-t">Connections</div>`;
    for (const lk of links) {
      b += `<div class="link-card" data-entity-id="${esc(lk.id)}">
        <div style="display:flex;align-items:center;gap:11px;min-width:0">
          <span class="muted">${lk.icon}</span>
          <div style="min-width:0">
            <div style="font-weight:700;font-size:13.5px">${esc(lk.title)}</div>
            <div class="small">${esc(lk.sub)}</div>
          </div>
        </div>
        <span class="go-arrow">Open →</span>
      </div>`;
    }
    b += `</div>`;
  }

  // 4. Collapsible Technical Details
  b += `<details class="tech" data-details-key="entity-tech:${esc(ent.id)}">
    <summary>Technical details (IP, MAC, ports &amp; raw checks)</summary>
    <div class="tech-body">
      <div class="kv-grid">`;
  if (ent.kind === "port") {
    b += `<div class="kv"><div class="k">Link State</div><div class="v">${esc(ent.port_state)} ${fmtSpeed(ent.speed)}</div></div>
      <div class="kv"><div class="k">Native VLAN</div><div class="v">${esc(ent.native_vlan || "-")}</div></div>
      <div class="kv"><div class="k">Tagged VLANs</div><div class="v mono">${esc(ent.tagged_policy || "-")}</div></div>
      <div class="kv"><div class="k">MAC Security</div><div class="v">${ent.port_security ? "Enabled" : "Off"} (${ent.mac_table_count || 0} MACs)</div></div>
      <div class="kv"><div class="k">Port Isolation</div><div class="v">${ent.port_isolation_unknown ? "Unknown" : (ent.port_isolation ? "Enabled" : "Off")}</div></div>
      <div class="kv"><div class="k">PoE Power</div><div class="v mono">${ent.poe_enabled ? "⚡ " + esc(ent.poe_power || "ON") + "W" : "Off"}</div></div>
      <div class="kv"><div class="k">STP State</div><div class="v mono">${esc(ent.stp_state || "-")}</div></div>`;
  } else {
    b += `<div class="kv"><div class="k">IP Address</div><div class="v mono">${esc(ent.ip || "-")}</div></div>
      <div class="kv"><div class="k">MAC Address</div><div class="v mono">${esc(ent.mac || "-")}</div></div>
      <div class="kv"><div class="k">Network / VLAN</div><div class="v">${esc(ent.network_name || "-")}</div></div>
      <div class="kv"><div class="k">${ent.kind === "device" ? "Firmware" : "Last Checked"}</div><div class="v mono">${esc(ent.kind === "device" ? (ent.firmware || "-") : (ent.scanned_at ? fmtTime(ent.scanned_at) : (ent.skipped ? (ent.state_label || "Skipped") : "Not yet scanned")))}</div></div>`;
  }
  b += `</div>`;

  if (ent.services && ent.services.length) {
    const reachMap = {
      wan: "Internet",
      "wan-restricted": "Internet (Restricted Source)",
      "wan-cgnat": "Configured Forward (Behind CGNAT)",
      lan: "Whole Home",
      "vlan-only": "This Network Only",
      advertised: "Advertised (mDNS/Discovery)"
    };
    b += `<div class="dsec-t" style="margin-top:8px">Network Services &amp; Ports (${ent.services.length})</div>
      <div class="pills" style="margin-bottom:12px">
        ${ent.services.map(svc => `<span class="tag ${svc.exposed ? humanStateTone(svc.severity) : (svc.reachable === "wan" || svc.reachable === "wan-restricted" ? "blue" : "neutral")}">
          <span class="mono">${esc(svc.label || (svc.proto + ":" + svc.port))}</span> · ${esc(reachMap[svc.reachable] || svc.reachable)}${svc.state && svc.state !== "observed-protocol" ? ` (${esc(svc.state)})` : ""}
        </span>`).join("")}
      </div>`;
  }

  if (nonCVE.length) {
    b += `<div class="dsec-t" style="margin-top:8px">Raw Check Evidence</div>`;
    for (const r of nonCVE) {
      b += `<div style="padding:9px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:12px">
        <div class="mono" style="font-weight:700">${esc(r.ref)}${r.port ? " :" + r.port : ""} · ${esc(r.severity)}</div>
        ${r.observed ? `<div class="small" style="margin-top:3px"><strong>Observed:</strong> ${esc(r.observed)}</div>` : ""}
        ${r.expected ? `<div class="small"><strong>Expected:</strong> ${esc(r.expected)}</div>` : ""}
        ${r.evidence ? `<div class="small" style="margin-top:3px">${esc(r.evidence)}</div>` : ""}
      </div>`;
    }
  }

  if (ent.outbound_dependencies && ent.outbound_dependencies.length) {
    b += `<div class="dsec-t" style="margin-top:8px">Outbound Internet Dependencies (${ent.outbound_dependencies.length})</div>`;
    for (const dep of ent.outbound_dependencies) {
      b += `<div style="padding:9px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:12px">
        <strong>${esc(dep.service_name)}</strong> <span class="small">(${esc(dep.category)} · ${esc(dep.attribution_level)})</span>
        <div class="small mono" style="margin-top:2px">${esc(dep.destination_host || dep.destination_ip || "-")}${dep.port ? ":" + dep.port : ""} (${esc(dep.transport || "tcp")})</div>
      </div>`;
    }
  }

  if (ent.potential_cves && ent.potential_cves.length) {
    b += `<div class="dsec-t" style="margin-top:8px">Unverified Patch Advisories (${ent.potential_cves.length})</div>`;
    for (const s of ent.potential_cves) {
      b += `<div style="padding:9px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:12px">
        <strong>${esc(s.product.label)}</strong> · ${s.total_cves} possible CVE(s) (version hidden)
        <div class="small mono" style="margin-top:2px">${esc((s.top_cves || []).join(", "))}</div>
      </div>`;
    }
  }

  b += `</div></details>`;
  patchContainerHTML(document.getElementById("drawer-body"), b);
}

function renderIsolationPanelDrawer(vm, filter) {
  const iso = vm.isolation || { cells: [] };
  const allCells = iso.cells || [];
  const verdictOrder = { violation: 0, "broken-dependency": 1, unknown: 2, approved: 3, "blocked-ok": 4 };
  const cells = (filter === "all" ? [...allCells] : allCells.filter(c => c.verdict === filter))
    .sort((a, b) => (verdictOrder[a.verdict] ?? 9) - (verdictOrder[b.verdict] ?? 9));

  const verdictInfo = {
    approved: { label: "Approved ✓", tone: "ok" },
    "blocked-ok": { label: "Blocked ✓", tone: "ok" },
    violation: { label: "Needs narrower rule", tone: "crit" },
    "broken-dependency": { label: "Broken dependency", tone: "warn" },
    unknown: { label: "Unknown (missing data)", tone: "warn" }
  };
  const fnLabel = {
    "ipps-printing": "IPPS Printing",
    "printer-admin": "Printer Admin Settings",
    "printer-admin-shared-ipp": "CUPS Admin (Shared Port)",
    "bmc-redfish-admin": "Server Hardware Control (Redfish)",
    "bmc-ipmi": "Server Hardware Control (IPMI)",
    "trusted-lan-transit": "Trusted Home Network",
    "gateway-admin": "Router Admin Login",
    "gateway-dns": "Router DNS",
    "gateway-dhcp": "Router DHCP",
    "same-vlan-wifi-peers": "Same-AP Wi-Fi Peers",
    "cross-ap-wifi-peers": "Cross-AP Wi-Fi Peers",
    "same-vlan-wired-peers": "Wired Same-Network Peers",
    "same-vlan-mixed-peers": "Wired ↔ Wi-Fi Peers"
  };

  patchContainerHTML(document.getElementById("drawer-hd-content"), `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      ${drawerStack.length > 1 ? `<button class="btn sm" data-action="pop-drawer">← Back</button>` : ""}
      <span class="tag blue">Isolation Policy Check</span>
    </div>
    <div style="font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2">Network Isolation Boundaries</div>
    <div class="small" style="margin-top:3px">Shows which network paths are blocked, approved, violating policy, or missing controller evidence.</div>`);

  const filters = [
    { key: "all", label: `All (${allCells.length})` },
    { key: "violation", label: `Violations (${iso.violation_count || 0})` },
    { key: "approved", label: `Approved (${iso.approved_count || 0})` },
    { key: "blocked-ok", label: `Blocked (${iso.blocked_ok_count || 0})` },
    { key: "unknown", label: `Unknown (${iso.unknown_count || 0})` }
  ];
  let b = `<div class="pills" style="margin-bottom:14px">
    ${filters.map(f => `<button class="btn sm ${filter === f.key ? "primary" : ""}" data-panel-id="panel:isolation:${f.key}">${esc(f.label)}</button>`).join("")}
  </div>`;

  if (!cells.length) {
    b += `<div class="summary-box ok">No boundary checks match this filter.</div>`;
    patchContainerHTML(document.getElementById("drawer-body"), b);
    return;
  }

  // Index hosts by IPv4, all IPv6 addresses, and label for clickable "Inspect device ->" jumps.
  const hostByAddr = {};
  const hostByLabel = {};
  for (const e of Object.values(vm.entities || {})) {
    if (e.kind !== "host") continue;
    if (e.ip) hostByAddr[e.ip.toLowerCase()] = e.id;
    for (const v6 of (e.ipv6 || [])) {
      if (v6) hostByAddr[v6.toLowerCase()] = e.id;
    }
    if (e.label) hostByLabel[e.label.toLowerCase()] = e.id;
  }

  for (const c of cells) {
    const vi = verdictInfo[c.verdict] || { label: c.verdict, tone: "neutral" };
    const dst = c.dest_host || c.dest_network || c.dest_zone;
    const fn = fnLabel[c.dest_function] || c.dest_function;
    const hostID = (c.dest_ip && hostByAddr[c.dest_ip.toLowerCase()]) || (c.dest_host && hostByLabel[c.dest_host.toLowerCase()]) || "";
    b += `<div class="fix-card ${vi.tone}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <strong style="font-size:14px">${esc(c.source_network || c.source_zone)} → ${esc(dst)}</strong>
        <span class="tag ${vi.tone}">${esc(vi.label)}</span>
      </div>
      <div class="pills" style="margin-top:6px">
        <span class="tag neutral">${esc(fn)}</span>
        <span class="tag neutral mono">${esc((c.ip_family || "ipv4").toUpperCase())}${c.port ? " · " + esc((c.transport || "tcp").toUpperCase()) + "/" + c.port : ""}</span>
        <span class="tag neutral">${esc(c.enforcer || c.path_kind)}</span>
      </div>
      ${c.decisive_rule_name ? `<div class="small" style="margin-top:6px"><strong>Decisive rule:</strong> ${esc(c.decisive_rule_name)}</div>` : ""}
      ${c.missing_input ? `<div class="small" style="margin-top:6px;color:var(--warn)"><strong>Missing evidence:</strong> ${esc(c.missing_input)}</div>` : ""}
      ${c.recommended_fix ? `<div class="fix-step"><strong>How to fix:</strong> ${esc(c.recommended_fix)}</div>` : ""}
      ${hostID ? `<div style="margin-top:8px"><button class="btn sm ghost" data-entity-id="${esc(hostID)}">Inspect ${esc(dst)} →</button></div>` : ""}
    </div>`;
  }
  patchContainerHTML(document.getElementById("drawer-body"), b);
}

    <div class="kv"><div class="k">Pinned Recognizers</div><div class="v mono">${sc.pinned_nerva_tcp_capable || 0} TCP/TLS · ${sc.pinned_nerva_udp_only || 0} UDP</div></div>
  </div></div></details>`;

  patchContainerHTML(document.getElementById("drawer-body"), b);
}

/* ============================================================================
   LIVE LOOP & OFFLINE SNAPSHOT BOOTSTRAP
   ============================================================================ */
function renderActiveTab(progressOnly = false) {
  if (!state) return;
  const initial = isInitialScanActive();
  if (!initial) bypassInitialSplash = false;
  renderHeader();
  renderScanBanner(initial);

  const initSec = document.getElementById("view-initial");
  const hadSplash = Boolean(initSec && initSec.classList.contains("active"));
  const hasActiveView = Boolean(document.querySelector("main > section.view.active:not(#view-initial)"));
  const showSplash = initial && !bypassInitialSplash;
  const navPills = document.querySelector(".nav-pills");
  if (navPills) navPills.classList.toggle("locked", showSplash);
  if (initSec) initSec.classList.toggle("active", showSplash);
  if (showSplash) {
    document.querySelectorAll("main > section.view:not(#view-initial)").forEach(s => s.classList.remove("active"));
    renderInitialSplash();
    return;
  }

  // During scan_progress ticks when a tab view is already visible, header + scan
  // banner already updated above; avoid rebuilding active views/drawer. When
  // transitioning out of the initial splash (or when no tab view is active),
  // perform a full render so the dashboard never flashes blank.
  if (progressOnly && !hadSplash && hasActiveView) return;

  document.querySelectorAll("main > section.view:not(#view-initial)").forEach(s => s.classList.toggle("active", s.id === "view-" + activeTab));
  if (activeTab === "checkup") renderCheckup();
  else if (activeTab === "house") renderHouse();
  else if (activeTab === "devices") renderDevices();
  else if (activeTab === "activity") renderActivity();
  if (drawerStack.length) renderDrawer();
}

function showAuthOverlay(errMsg) {
  authRequired = true;
  if (sseRetryTimer) {
    clearTimeout(sseRetryTimer);
    sseRetryTimer = null;
  }
  if (sseSource) {
    try { sseSource.close(); } catch (_) {}
    sseSource = null;
  }
  const ov = document.getElementById("auth-overlay");
  const errEl = document.getElementById("auth-err");
  if (errEl) {
    if (errMsg) {
      errEl.textContent = errMsg;
      errEl.classList.add("show");
    } else {
      errEl.textContent = "";
      errEl.classList.remove("show");
    }
  }
  if (ov) {
    ov.classList.add("open");
    const inp = document.getElementById("auth-token-input");
    if (inp) inp.focus();
  }
  const pill = document.getElementById("status-pill");
  const lbl = document.getElementById("status-lbl");
  if (pill) pill.className = "status-pill";
  if (lbl) lbl.textContent = "Sign in required";
}

function hideAuthOverlay() {
  authRequired = false;
  const ov = document.getElementById("auth-overlay");
  if (ov) ov.classList.remove("open");
  const errEl = document.getElementById("auth-err");
  if (errEl) {
    errEl.textContent = "";
    errEl.classList.remove("show");
  }
}

function updateLogoutControl(visible) {
  const btn = document.getElementById("logout-btn");
  if (btn) btn.style.display = (!isStaticMode && visible) ? "" : "none";
}

async function refreshSessionControl() {
  if (isStaticMode) return;
  try {
    const resp = await fetch("/api/v1/session", { cache: "no-store" });
    if (!resp.ok) return;
    const data = await resp.json();
    updateLogoutControl(Boolean(data && data.required && data.authenticated));
  } catch (_) {}
}

const logoutBtn = document.getElementById("logout-btn");
if (logoutBtn) {
  logoutBtn.addEventListener("click", async () => {
    logoutBtn.disabled = true;
    const status = document.getElementById("logout-error");
    status.textContent = "";
    try {
      const response = await fetch("/api/v1/session", {
        method: "DELETE",
        headers: { "X-UniBlue-Request": "1" }
      });
      if (!response.ok) throw new Error();
      updateLogoutControl(false);
      showAuthOverlay("");
    } catch (_) {
      status.textContent = "Sign-out failed. Try again.";
    } finally {
      logoutBtn.disabled = false;
    }
  });
}

const authForm = document.getElementById("auth-form");
if (authForm) {
  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const inp = document.getElementById("auth-token-input");
    const btn = document.getElementById("auth-submit");
    const token = (inp?.value || "").trim();
    if (!token) return;
    if (btn) btn.disabled = true;
    try {
      const resp = await fetch("/api/v1/session", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-UniBlue-Request": "1"
        },
        body: JSON.stringify({ token })
      });
      if (!resp.ok) {
        if (resp.status === 429) {
          const retrySecs = parseInt(resp.headers.get("Retry-After") || "0", 10);
          const waitText = retrySecs >= 60 ? `${Math.ceil(retrySecs / 60)} minutes` : "a few minutes";
          showAuthOverlay(`Too many failed attempts. Please wait ${waitText} and try again.`);
        } else {
          showAuthOverlay("Invalid API token. Check UNIBLUE_API_TOKEN and try again.");
        }
        return;
      }
      if (inp) inp.value = "";
      hideAuthOverlay();
      updateLogoutControl(true);
      sseDisconnected = false;
      sseRetryMs = 1000;
      await fetchState(false);
      if (!sseSource) connectSSE();
    } catch (err) {
      showAuthOverlay("Sign-in request failed: " + (err?.message || "network error"));
    } finally {
      if (btn) btn.disabled = false;
    }
  });
}

let fetchQueuedProgressOnly = true;
async function fetchState(progressOnly = false) {
  if (isStaticMode) return;
  if (fetchInFlight) {
    fetchQueued = true;
    if (!progressOnly) fetchQueuedProgressOnly = false;
    return;
  }
  fetchInFlight = true;
  try {
    const r = await fetch("/api/v1/state", {cache: "no-store"});
    if (r.status === 401) {
      if (!authRequired) showAuthOverlay("");
      return;
    }
    if (r.status === 429) {
      const retrySecs = parseInt(r.headers.get("Retry-After") || "0", 10);
      const waitText = retrySecs >= 60 ? `${Math.ceil(retrySecs / 60)} minutes` : "a few minutes";
      showAuthOverlay(`Too many failed sign-in attempts from this address. Please wait ${waitText} and try again.`);
      return;
    }
    if (!r.ok) return;
    const needReconnectSSE = authRequired || !sseSource;
    state = await r.json();
    if (needReconnectSSE) {
      hideAuthOverlay();
      if (sseRetryTimer) {
        clearTimeout(sseRetryTimer);
        sseRetryTimer = null;
      }
      sseDisconnected = false;
      sseRetryMs = 1000;
      connectSSE();
    }
    if (!initialHashApplied) {
      initialHashApplied = true;
      applyHash();
      syncHash(false);
    }
    renderActiveTab(progressOnly);
  } finally {
    fetchInFlight = false;
    if (fetchQueued) {
      const nextProgressOnly = fetchQueuedProgressOnly;
      fetchQueued = false;
      fetchQueuedProgressOnly = true;
      fetchState(nextProgressOnly);
    }
  }
}

async function triggerRescan(ip) {
  if (isStaticMode) return;
  const url = ip ? ("/api/v1/hosts/" + encodeURIComponent(ip) + "/scan") : "/api/v1/scans";
  try {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "X-UniBlue-Request": "1" }
    });
    if (resp.status === 401) {
      showAuthOverlay("Session expired. Enter your API token to continue.");
      return;
    }
    if (!resp.ok) {
      let detail = `HTTP ${resp.status}`;
      try {
        const body = await resp.json();
        if (body?.message) detail += ": " + String(body.message).slice(0, 120);
        else if (body?.error) detail += ": " + String(body.error).slice(0, 120);
      } catch (_) {}
      showToast({
        type: "finding",
        severity: "high",
        time: new Date().toISOString(),
        summary: `Rescan request failed (${detail})`
      });
      return;
    }
    setTimeout(fetchState, 600);
  } catch (err) {
    showToast({
      type: "finding",
      severity: "high",
      time: new Date().toISOString(),
      summary: `Rescan request failed: ${err?.message || "network error"}`
    });
  }
}

function resolveEventSubject(ev) {
  const ents = state?.view?.entities || {};
  if (ev.subject_id && ents[ev.subject_id]) return ev.subject_id;
  if (ev.ip) {
    for (const e of Object.values(ents)) {
      if ((e.kind === "host" || e.kind === "device") && (e.ip === ev.ip || (e.ipv6 || []).includes(ev.ip))) return e.id;
    }
  }
  return "";
}

function showToast(ev) {
  if (!ev || !ev.summary) return;
  const t = (ev.type || "").toLowerCase();
  if (t === "startup" || t === "scan_progress") return;
  const stack = document.getElementById("toast-stack");
  if (!stack) return;

  const info = humanEventType(ev.type);
  const sev = (ev.severity || "info").toLowerCase();
  let tone = info.tone;
  if (sev === "critical") tone = "crit";
  else if (sev === "high" || sev === "medium") tone = "warn";

  const el = document.createElement("div");
  el.className = "toast " + tone;
  el.innerHTML = `
    <div class="toast-body">
      <div class="toast-hd">
        <span class="tag ${tone}">${esc(info.label)}</span>
        <span class="small">${esc(fmtTime(ev.time))}</span>
      </div>
      <div class="toast-msg">${esc(ev.summary)}</div>
    </div>
    <button class="toast-x" type="button" title="Dismiss">✕</button>`;

  const dismiss = () => { if (el.parentNode) el.parentNode.removeChild(el); };
  el.querySelector(".toast-x").addEventListener("click", (e) => {
    e.stopPropagation();
    dismiss();
  });
  el.addEventListener("click", () => {
    const sid = resolveEventSubject(ev);
    dismiss();
    if (sid) openEntity(sid);
    else switchTab("activity");
  });

  stack.prepend(el);
  while (stack.children.length > 4) {
    stack.removeChild(stack.lastElementChild);
  }
  const ttl = (tone === "crit" || tone === "warn") ? 10000 : 6000;
  setTimeout(dismiss, ttl);
}

function scheduleSSEReconnect() {
  if (isStaticMode || authRequired || sseRetryTimer) return;
  const delay = sseRetryMs;
  sseRetryMs = Math.min(30000, sseRetryMs * 2);
  sseRetryTimer = setTimeout(() => {
    sseRetryTimer = null;
    connectSSE();
  }, delay);
}

function connectSSE() {
  if (isStaticMode || authRequired) return;
  if (sseSource) {
    try { sseSource.close(); } catch (_) {}
    sseSource = null;
  }
  const es = new EventSource("/api/v1/events/stream");
  sseSource = es;
  es.addEventListener("uniblue", (msg) => {
    sseDisconnected = false;
    sseRetryMs = 1000;
    let ev = null;
    try { ev = JSON.parse(msg.data); } catch (_) {}
    if (ev && ev.type === "scan_progress") {
      fetchState(true);
      return;
    }
    fetchState(false).then(() => {
      if (ev) showToast(ev);
    });
  });
  es.onerror = () => {
    sseDisconnected = true;
    const pill = document.getElementById("status-pill");
    const lbl = document.getElementById("status-lbl");
    if (pill) pill.className = "status-pill";
    if (lbl) lbl.textContent = es.readyState === EventSource.CLOSED ? "Offline (reconnecting...)" : "Reconnecting...";
    if (es.readyState === EventSource.CLOSED) {
      try { es.close(); } catch (_) {}
      if (sseSource === es) sseSource = null;
      scheduleSSEReconnect();
    }
  };
  es.onopen = () => {
    sseDisconnected = false;
    sseRetryMs = 1000;
    fetchState(false);
  };
}

const staticEl = document.getElementById("uniblue-static-state");
if (staticEl && staticEl.textContent.trim()) {
  isStaticMode = true;
  state = JSON.parse(staticEl.textContent);
  initialHashApplied = true;
  applyHash();
  syncHash(false);
  renderActiveTab();
} else {
  fetchState();
  refreshSessionControl();
  connectSSE();
  setInterval(fetchState, 15000);
}
</script>
</body>
</html>
