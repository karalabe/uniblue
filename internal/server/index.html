<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniBlue: Home Network Security Checkup</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #eef2f6;
    --border: #e5eaf1;
    --border-strong: #cdd6e2;
    --text: #0f172a;
    --text-2: #334155;
    --muted: #64748b;

    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --blue-bd: #bfdbfe;

    /* Calm colour law: warm accents ONLY for real issues */
    --crit: #b91c1c;
    --crit-bg: #fef2f2;
    --crit-bd: #fecaca;
    --crit-solid: #dc2626;

    --warn: #b45309;
    --warn-bg: #fffbeb;
    --warn-bd: #fde68a;
    --warn-solid: #d97706;

    --info: #0369a1;
    --info-bg: #f0f9ff;
    --info-bd: #bae6fd;

    --ok: #047857;
    --ok-bg: #ecfdf5;
    --ok-bd: #a7f3d0;
    --ok-solid: #10b981;

    /* Calm hardware socket palette */
    --port-up-bg: #e2e8f0;
    --port-up-bd: #94a3b8;
    --port-up-fg: #1e293b;
    --port-open-bg: #ffffff;
    --port-open-bd: #cbd5e1;
    --port-off-bg: #f1f5f9;

    /* Subtle zone accents */
    --vlan-0: #3b82f6;
    --vlan-1: #6366f1;
    --vlan-2: #0d9488;
    --vlan-3: #0284c7;
    --vlan-4: #64748b;

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04);
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 6px 20px rgba(15, 23, 42, .03);
    --shadow-lg: 0 20px 50px rgba(15, 23, 42, .18);
    --radius: 16px;
    --radius-sm: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b101b;
      --surface: #111827;
      --surface-2: #162033;
      --surface-3: #1e293b;
      --border: #1f2a3d;
      --border-strong: #334155;
      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --muted: #94a3b8;

      --blue: #60a5fa;
      --blue-bg: rgba(59, 130, 246, .15);
      --blue-bd: rgba(96, 165, 250, .35);

      --crit: #fca5a5;
      --crit-bg: rgba(153, 27, 27, .28);
      --crit-bd: rgba(248, 113, 113, .45);
      --crit-solid: #ef4444;

      --warn: #fcd34d;
      --warn-bg: rgba(146, 64, 14, .26);
      --warn-bd: rgba(251, 191, 36, .40);
      --warn-solid: #f59e0b;

      --info: #7dd3fc;
      --info-bg: rgba(7, 89, 133, .28);
      --info-bd: rgba(56, 189, 248, .38);

      --ok: #6ee7b7;
      --ok-bg: rgba(6, 95, 70, .25);
      --ok-bd: rgba(52, 211, 153, .36);
      --ok-solid: #10b981;

      --port-up-bg: #1e293b;
      --port-up-bd: #475569;
      --port-up-fg: #e2e8f0;
      --port-open-bg: #0f172a;
      --port-open-bd: #334155;
      --port-off-bg: #0c1220;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow: 0 2px 10px rgba(0, 0, 0, .3);
      --shadow-lg: 0 20px 56px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; color: var(--muted); }
  .icon { width: 17px; height: 17px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
  .icon-lg { width: 22px; height: 22px; flex-shrink: 0; }

  /* ==========================================================================
     HEADER: Clean, airy, focused navigation
     ========================================================================== */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .hdr-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand img { height: 28px; display: block; }

  .nav-pills {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .nav-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .nav-cnt {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--surface-3);
    color: var(--text-2);
  }
  .nav-cnt.crit { background: var(--crit-bg); color: var(--crit); }
  .nav-cnt.warn { background: var(--warn-bg); color: var(--warn); }
  .nav-cnt.blue { background: var(--blue-bg); color: var(--blue); }

  .hdr-r { display: flex; align-items: center; gap: 10px; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .status-pill.live { color: var(--text-2); }
  .status-pill.scanning { background: var(--blue-bg); border-color: var(--blue-bd); color: var(--blue); }
  .sdot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status-pill.live .sdot { background: var(--ok-solid); }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.85); } }
  .status-pill.scanning .sdot { animation: pulse 1.2s infinite; }

  /* Buttons */
  .btn {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { opacity: .92; color: #fff; }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }

  /* Main canvas */
  main {
    flex: 1;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .view { display: none; animation: fadeIn .16s ease-out; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

  /* Friendly Badges & Tags */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
  }
  .tag.crit { background: var(--crit-bg); border-color: var(--crit-bd); color: var(--crit); }
  .tag.warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn); }
  .tag.info { background: var(--info-bg); border-color: var(--info-bd); color: var(--info); }
  .tag.blue { background: var(--blue-bg); border-color: var(--blue-bd); color: var(--blue); }
  .tag.ok { background: var(--ok-bg); border-color: var(--ok-bd); color: var(--ok); }
  .tag.unk { background: var(--blue-bg); border: 1px dashed var(--blue-bd); color: var(--blue); }
  .tag.neutral { background: var(--surface-2); border-color: var(--border); color: var(--muted); }
  .tag.click { cursor: pointer; transition: border-color .12s, transform .1s; }
  .tag.click:hover { border-color: var(--blue); color: var(--blue); }
  .chk-row.click { cursor: pointer; border-radius: 8px; transition: background .12s; }
  .chk-row.click:hover { background: var(--surface-2); }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .card-title { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
  .card-body { padding: 20px 22px; }

  /* ==========================================================================
     TAB 1: CHECKUP HERO & GUIDED STORY CARDS
     ========================================================================== */
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 26px 28px;
    margin-bottom: 24px;
  }
  .hero-top {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .ring-wrap {
    width: 84px;
    height: 84px;
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring-svg { width: 84px; height: 84px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 7; }
  .ring-fg { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .ring-fg.spin { animation: spin 1.8s linear infinite; transform-origin: 42px 42px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -.02em;
  }
  .hero-copy { flex: 1; min-width: 240px; }
  .hero-title { font-size: 23px; font-weight: 800; letter-spacing: -.025em; margin: 0 0 5px; line-height: 1.25; }
  .hero-sub { font-size: 14.5px; color: var(--text-2); margin: 0; max-width: 680px; }

  .hero-pillars {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  @media (max-width: 760px) { .hero-pillars { grid-template-columns: 1fr; } }
  .pillar {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 15px;
    border-radius: 13px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .pillar:hover { border-color: var(--blue); background: var(--surface); transform: translateY(-1px); }
  .pillar-ico {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--surface-3);
    color: var(--text-2);
  }
  .pillar-ico.crit { background: var(--crit-bg); color: var(--crit); }
  .pillar-ico.warn { background: var(--warn-bg); color: var(--warn); }
  .pillar-ico.ok { background: var(--ok-bg); color: var(--ok); }
  .pillar-ico.blue { background: var(--blue-bg); color: var(--blue); }
  .pillar-lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
  .pillar-val { font-size: 14.5px; font-weight: 700; color: var(--text); margin-top: 1px; }

  /* Two-column Checkup Body */
  .checkup-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.65fr) minmax(290px, 1fr);
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 960px) { .checkup-grid { grid-template-columns: 1fr; } }

  .section-kicker {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 12px 4px;
  }

  /* Story Action Group Card */
  .story {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .story-hd {
    padding: 18px 22px 15px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }
  .story-hd-l { display: flex; gap: 13px; align-items: flex-start; min-width: 0; }
  .story-hd > .btn { white-space: nowrap; flex-shrink: 0; }
  .story-ico {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .story-ico.crit { background: var(--crit-bg); color: var(--crit); }
  .story-ico.warn { background: var(--warn-bg); color: var(--warn); }
  .story-ico.blue { background: var(--blue-bg); color: var(--blue); }
  .story-title { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
  .story-why { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.45; }

  .story-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .12s;
  }
  .story-item:last-child { border-bottom: 0; }
  .story-item:hover { background: var(--surface-2); }
  .story-item-l { min-width: 0; flex: 1; }
  .story-item-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .story-item-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .story-item-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .go-arrow { color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .story-item:hover .go-arrow { color: var(--blue); }

  /* Router Safety Checklist */
  .checklist { padding: 6px 0; }
  .chk-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
  }
  .chk-row:last-child { border-bottom: 0; }
  .chk-l { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .chk-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--border-strong); }
  .chk-dot.ok { background: var(--ok-solid); }
  .chk-dot.warn { background: var(--warn-solid); }
  .chk-dot.crit { background: var(--crit-solid); }
  .chk-name { font-weight: 600; font-size: 13.5px; }
  .chk-hint { font-size: 11.5px; color: var(--muted); }
  .chk-val { font-size: 12.5px; font-weight: 600; text-align: right; white-space: nowrap; }
  .chk-val.ok { color: var(--ok); }
  .chk-val.warn { color: var(--warn); }
  .chk-val.crit { color: var(--crit); }

  /* ==========================================================================
     TAB 2: HOUSE & CABLES (Architectural Cutaway)
     ========================================================================== */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .seg {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 3px;
    gap: 3px;
    box-shadow: var(--shadow-sm);
  }
  .seg-b {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 6px 13px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .seg-b:hover { color: var(--text); }
  .seg-b.active { background: var(--blue-bg); color: var(--blue); }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .leg { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--border-strong); display: inline-block; }
  .sw.up { background: var(--port-up-bg); border-color: var(--port-up-bd); }
  .sw.open { background: var(--port-open-bg); border-style: dashed; }
  .sw.off { background: var(--port-off-bg); opacity: .5; }
  .sw.crit { background: var(--crit-bg); border-color: var(--crit-bd); }
  .sw.warn { background: var(--warn-bg); border-color: var(--warn-bd); }
  .sw.hatch { background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 3px, var(--surface-3) 3px, var(--surface-3) 6px); }

  .house-zone {
    border: 1.5px solid var(--border-strong);
    border-radius: 20px;
    padding: 22px 24px;
    background: var(--surface-2);
    margin-bottom: 18px;
  }
  .house-zone.outside {
    border-style: dashed;
    background: var(--surface);
  }
  .house-hd {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .house-title { font-size: 16px; font-weight: 800; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px; }
  .house-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* Architectural Wall Boundary */
  .wall-band {
    margin: 22px 0;
    padding: 18px 22px;
    border-radius: 16px;
    border: 1.5px solid var(--border-strong);
    background: repeating-linear-gradient(-45deg, var(--surface-2), var(--surface-2) 10px, var(--surface-3) 10px, var(--surface-3) 20px);
  }
  .wall-title { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .wall-cables { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .cable-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color .15s, transform .1s;
  }
  .cable-pill:hover { border-color: var(--blue); transform: translateY(-1px); }
  .cable-pill.crit { border-color: var(--crit-bd); background: var(--crit-bg); }
  .cable-pill.warn { border-color: var(--warn-bd); background: var(--warn-bg); }
  .cable-pill.inferred { border-style: dashed; }

  .hw-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .hw-card:last-child { margin-bottom: 0; }
  .hw-card.d1 { margin-left: 24px; }
  .hw-card.d2 { margin-left: 48px; }
  @media (max-width: 720px) { .hw-card.d1, .hw-card.d2 { margin-left: 0; } }
  .hw-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    flex-wrap: wrap;
    transition: background .12s;
  }
  .hw-hd:hover { background: var(--surface-2); }

  /* Roomy Physical Switch Sockets */
  .fp-wrap { padding: 16px 18px; display: flex; align-items: center; gap: 16px; overflow-x: auto; }
  .fp-bank { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 46px); gap: 7px; }
  .fp-bank.single { grid-template-rows: 46px; }
  .fp-sep { width: 2px; height: 84px; background: var(--border-strong); border-radius: 2px; flex-shrink: 0; }
  .sock {
    width: 50px;
    height: 46px;
    border-radius: 9px;
    position: relative;
    border: 1.5px solid var(--port-open-bd);
    background: var(--port-open-bg);
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .sock:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 4px 10px rgba(37, 99, 235, .14); z-index: 2; }
  .sock.up { background: var(--port-up-bg); border-color: var(--port-up-bd); color: var(--port-up-fg); }
  .sock.open { border-style: dashed; }
  .sock.off { background: var(--port-off-bg); border-color: var(--border); opacity: .45; }
  .sock.trunk {
    background-image: repeating-linear-gradient(-45deg, transparent, transparent 4px, rgba(100, 116, 139, .14) 4px, rgba(100, 116, 139, .14) 8px);
  }
  .sock.crit { background-color: var(--crit-bg); border-color: var(--crit-bd); color: var(--crit); opacity: 1; }
  .sock.warn { background-color: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn); opacity: 1; }
  .sock.sel { outline: 2.5px solid var(--blue); outline-offset: 2px; z-index: 4; }
  .sock.dim { opacity: .2 !important; }
  .sock .sn { font-size: 12.5px; font-weight: 800; line-height: 1.1; }
  .sock .sm { font-size: 10px; opacity: .82; line-height: 1.1; margin-top: 2px; }
  .sock .ubar { position: absolute; left: 5px; right: 5px; bottom: 3px; height: 3px; border-radius: 2px; }

  .hw-foot {
    padding: 11px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  /* ==========================================================================
     TAB 3: DEVICES & WI-FI (Zones as Rooms)
     ========================================================================== */
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 11px;
    padding: 0 13px;
    width: 300px;
    max-width: 100%;
    box-shadow: var(--shadow-sm);
  }
  .search-box:focus-within { border-color: var(--blue); }
  .search-box input {
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 8px 0;
    font-size: 13.5px;
    width: 100%;
    outline: none;
  }

  .zone-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .zone-hd {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    border-left: 5px solid var(--vlan-0);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .zone-title { font-size: 16.5px; font-weight: 800; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .zone-desc { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .zone-tip {
    padding: 11px 22px;
    background: var(--blue-bg);
    color: var(--blue);
    border-bottom: 1px solid var(--blue-bd);
    font-size: 13px;
    font-weight: 600;
  }
  .bmc-band {
    padding: 10px 22px;
    background: var(--warn-bg);
    border-bottom: 1px solid var(--warn-bd);
    color: var(--warn);
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dev-row {
    display: grid;
    grid-template-columns: minmax(220px, 1.5fr) minmax(150px, 1fr) minmax(200px, 1.4fr) auto;
    gap: 14px;
    align-items: center;
    padding: 13px 22px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .12s;
  }
  .dev-row:last-child { border-bottom: 0; }
  .dev-row:hover { background: var(--surface-2); }
  @media (max-width: 860px) { .dev-row { grid-template-columns: 1fr; gap: 8px; } }
  .dev-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .dev-ico {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .dev-ico .sbadge {
    position: absolute;
    right: -3px;
    bottom: -3px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    background: var(--border-strong);
  }
  .dev-ico .sbadge.crit { background: var(--crit-solid); }
  .dev-ico .sbadge.warn { background: var(--warn-solid); }
  .dev-ico .sbadge.ok { background: var(--ok-solid); }
  .dev-ico .sbadge.unk { background: var(--blue); animation: pulse 1.2s infinite; }
  .dev-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .wifi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 18px 22px; }
  .wifi-card {
    padding: 15px 16px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--surface-2);
  }

  /* ==========================================================================
     TAB 4: ACTIVITY FEED
     ========================================================================== */
  .act-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 13px 22px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .act-row:last-child { border-bottom: 0; }
  .act-row.clickable { cursor: pointer; transition: background .12s; }
  .act-row.clickable:hover { background: var(--surface-2); }
  .act-l { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 240px; }
  .act-time { font-size: 12px; color: var(--muted); min-width: 72px; white-space: nowrap; flex-shrink: 0; }

  .empty { padding: 28px 22px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ==========================================================================
     SLIDE-OVER INSPECTOR DRAWER (Human First + Collapsible Technical Details)
     ========================================================================== */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .34);
    backdrop-filter: blur(2px);
    z-index: 45;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 500px;
    max-width: 100vw;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    z-index: 50;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.16, 1, .3, 1);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-hd {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }

  .summary-box {
    padding: 15px 17px;
    border-radius: 13px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    font-size: 13.5px;
    color: var(--text-2);
    line-height: 1.55;
  }
  .summary-box.crit { background: var(--crit-bg); border-color: var(--crit-bd); color: var(--text); }
  .summary-box.warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--text); }
  .summary-box.ok { background: var(--ok-bg); border-color: var(--ok-bd); color: var(--text); }
  .summary-box.blue { background: var(--blue-bg); border-color: var(--blue-bd); color: var(--text); }

  .dsec { margin-bottom: 22px; }
  .dsec-t { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; }

  .fix-card {
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px 16px;
    margin-bottom: 12px;
    background: var(--surface);
  }
  .fix-card.crit { border-color: var(--crit-bd); background: var(--crit-bg); }
  .fix-card.warn { border-color: var(--warn-bd); background: var(--warn-bg); }
  .fix-step {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
  }

  .link-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    cursor: pointer;
    margin-bottom: 8px;
    transition: border-color .12s, background .12s;
  }
  .link-card:hover { border-color: var(--blue); background: var(--surface); }

  /* Collapsible Technical Details */
  details.tech {
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--surface-2);
    overflow: hidden;
    margin-top: 16px;
  }
  details.tech summary {
    padding: 13px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-2);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  details.tech summary::-webkit-details-marker { display: none; }
  details.tech summary::after { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.tech[open] summary::after { transform: rotate(90deg); }
  details.tech[open] summary { border-bottom: 1px solid var(--border); }
  .tech-body { padding: 14px 16px; }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .kv { padding: 9px 11px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); }
  .kv .k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .kv .v { font-size: 12.5px; font-weight: 600; margin-top: 2px; word-break: break-word; }

  /* Footer */
  footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .ft-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 15px 24px;
    color: var(--muted);
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer a { color: var(--text-2); text-decoration: none; font-weight: 600; }
  footer a:hover { color: var(--blue); text-decoration: underline; }

  /* Live toast notifications */
  .toast-stack {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 44;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 380px;
    width: calc(100vw - 40px);
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 12px 14px;
    border-radius: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    animation: toastIn .18s cubic-bezier(.16, 1, .3, 1);
  }
  .toast.crit { border-left-color: var(--crit-solid); }
  .toast.warn { border-left-color: var(--warn-solid); }
  .toast.ok { border-left-color: var(--ok-solid); }
  .toast.blue { border-left-color: var(--blue); }
  .toast.neutral { border-left-color: var(--border-strong); }
  .toast-body { flex: 1; min-width: 0; }
  .toast-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .toast-msg { font-size: 13px; color: var(--text); line-height: 1.4; word-break: break-word; }
  .toast-x {
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    font-size: 13px;
    line-height: 1;
    border-radius: 6px;
  }
  .toast-x:hover { color: var(--text); background: var(--surface-2); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Initial baseline scan progress screen & slim rescan bar */
  .init-splash {
    max-width: 640px;
    margin: 34px auto 24px;
    padding: 34px 36px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .init-ring { margin: 0 auto 18px; width: 88px; height: 88px; position: relative; }
  .init-title { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.025em; }
  .init-sub { margin: 8px auto 0; max-width: 500px; font-size: 14.5px; color: var(--text-2); line-height: 1.55; }
  .pbar-wrap { margin: 22px 0 8px; text-align: left; }
  .pbar-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
  .pbar-track {
    width: 100%;
    height: 9px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .pbar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--blue);
    transition: width .35s cubic-bezier(.16, 1, .3, 1);
  }
  .pbar-host { font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 7px; text-align: left; }
  .init-steps {
    margin: 20px 0 0;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .init-step { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
  .init-step.done { color: var(--text-2); }
  .init-step.active { color: var(--text); font-weight: 600; }
  .step-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    flex-shrink: 0;
    border: 1.5px solid var(--border-strong);
    color: var(--muted);
  }
  .init-step.done .step-dot { background: var(--ok-solid); border-color: var(--ok-solid); color: #fff; }
  .init-step.active .step-dot { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); animation: pulse 1.2s infinite; }
  .init-foot { margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .scan-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 11px 16px;
    margin-bottom: 18px;
    border-radius: 13px;
    background: var(--blue-bg);
    border: 1px solid var(--blue-bd);
    color: var(--text);
    font-size: 13px;
  }
  .scan-banner-bar { width: 160px; height: 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--blue-bd); overflow: hidden; flex-shrink: 0; }
  .scan-banner-bar > div { height: 100%; background: var(--blue); transition: width .35s ease; }
  .nav-pills.locked { opacity: .45; pointer-events: none; }
  .auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, .56);
    backdrop-filter: blur(4px);
  }
  .auth-overlay.open { display: flex; }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-lg);
  }
  .auth-card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .auth-card p { margin: 0 0 16px; font-size: 13px; color: var(--text-2); line-height: 1.5; }
  .auth-input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-bottom: 12px;
  }
  .auth-err {
    display: none;
    margin-bottom: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--crit-bg);
    border: 1px solid var(--crit-bd);
    color: var(--crit);
    font-size: 12.5px;
  }
  .auth-err.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="hdr-inner">
    <div class="brand" data-action="switch-tab" data-tab-target="checkup" title="Back to Network Checkup">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/assets/logo-dark.svg">
        <img src="/assets/logo-light.svg" alt="UniBlue">
      </picture>
    </div>

    <nav class="nav-pills" role="tablist">
      <button class="nav-btn active" data-tab="checkup">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        Checkup <span id="nb-ck" class="nav-cnt">0</span>
      </button>
      <button class="nav-btn" data-tab="house">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        House &amp; Cables <span id="nb-hs" class="nav-cnt">0</span>
      </button>
      <button class="nav-btn" data-tab="devices">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Devices &amp; Wi-Fi <span id="nb-dv" class="nav-cnt">0</span>
      </button>
      <button class="nav-btn" data-tab="activity">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Activity <span id="nb-ac" class="nav-cnt">0</span>
      </button>
    </nav>

    <div class="hdr-r">
      <span id="status-pill" class="status-pill"><span class="sdot"></span><span id="status-lbl">Loading…</span></span>
      <button id="rescan-btn" class="btn sm" data-action="rescan" title="Check all devices again">
        <svg class="icon" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        Scan
      </button>
      <span id="logout-error" role="status"></span>
      <button id="logout-btn" class="btn sm ghost" type="button" style="display:none" title="Sign out of dashboard session">Sign out</button>
    </div>
  </div>
</header>

<main>
  <div id="scan-banner"></div>
  <section id="view-initial" class="view"></section>
  <section id="view-checkup" class="view active"></section>
  <section id="view-house" class="view"></section>
  <section id="view-devices" class="view"></section>
  <section id="view-activity" class="view"></section>
</main>

<div id="backdrop" class="backdrop" data-action="close-drawer"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-hd">
    <div id="drawer-hd-content" style="flex:1;min-width:0"></div>
    <button class="btn sm ghost" data-action="close-drawer" title="Close (Esc)">✕</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

<div id="auth-overlay" class="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title">
  <div class="auth-card">
    <h2 id="auth-title">Sign in to UniBlue</h2>
    <p>This dashboard is protected by an API token (<span class="mono">UNIBLUE_API_TOKEN</span>). Enter your token to establish an HttpOnly session cookie.</p>
    <form id="auth-form">
      <div id="auth-err" class="auth-err"></div>
      <input id="auth-token-input" class="auth-input" type="password" autocomplete="current-password" placeholder="API token" required>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button id="auth-submit" class="btn primary" type="submit">Sign in</button>
      </div>
    </form>
  </div>
</div>

<footer>

const vlanColorCache = {};
const vlanPalette = ["var(--vlan-0)", "var(--vlan-1)", "var(--vlan-2)", "var(--vlan-3)", "var(--vlan-4)"];
function vlanColor(name) {
  if (!name) return "var(--border-strong)";
  const k = name.toLowerCase();
  if (!vlanColorCache[k]) {
    let h = 0;
    for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
    vlanColorCache[k] = vlanPalette[h % vlanPalette.length];
  }
  return vlanColorCache[k];
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function fmtTime(iso) {
  if (!iso || String(iso).startsWith("0001-")) return "-";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "-";
  const now = new Date();
  const sameDay = d.getFullYear() === now.getFullYear() &&
    d.getMonth() === now.getMonth() &&
    d.getDate() === now.getDate();
  const timePart = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  if (isStaticMode || !sameDay) {
    return d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + timePart;
  }
  return timePart;
}

// Safely update a container's HTML while skipping unchanged renders and
// preserving input focus/selection and open <details> elements across refreshes.
function patchContainerHTML(container, html) {
  if (!container) return false;
  const key = container.id || "";
  if (key && lastRenderedHTML[key] === html) return false;

  const openDetails = new Set();
  container.querySelectorAll("details").forEach((el, idx) => {
    if (el.open) {
      openDetails.add(el.getAttribute("data-details-key") || ("idx:" + idx));
    }
  });

  let focusSnap = null;
  const active = document.activeElement;
  if (active && container.contains(active) && active.id) {
    focusSnap = {
      id: active.id,
      start: typeof active.selectionStart === "number" ? active.selectionStart : null,
      end: typeof active.selectionEnd === "number" ? active.selectionEnd : null,
      dir: active.selectionDirection || "none"
    };
  }

  container.innerHTML = html;
  if (key) lastRenderedHTML[key] = html;

  if (openDetails.size) {
    container.querySelectorAll("details").forEach((el, idx) => {
      const dk = el.getAttribute("data-details-key") || ("idx:" + idx);
      if (openDetails.has(dk)) el.open = true;
    });
  }

  if (focusSnap) {
    const next = document.getElementById(focusSnap.id);
    if (next && container.contains(next)) {
      try { next.focus({ preventScroll: true }); } catch (_) { next.focus(); }
      if (focusSnap.start !== null && typeof next.setSelectionRange === "function") {
        try { next.setSelectionRange(focusSnap.start, focusSnap.end, focusSnap.dir); } catch (_) {}
      }
    }
  }
  return true;
}

function humanStateTone(entOrSev) {
  if (!entOrSev) return "neutral";
  if (typeof entOrSev === "string") {
    const l = entOrSev.toLowerCase();
    if (l === "critical") return "crit";
    if (l === "high" || l === "medium" || l === "review") return "warn";
    if (l === "unknown" || l === "unk") return "unk";
    if (l === "ok" || l === "clean") return "ok";
    return "neutral";
  }
  if (entOrSev.skipped && entOrSev.state === "unknown") return "neutral";
  if (entOrSev.state === "unknown") return "unk";
  if (entOrSev.state === "ok") return "ok";
  if (entOrSev.max_severity === "critical") return "crit";
  return "warn";
}

function humanStateLabel(ent) {
  if (!ent) return "";
  if (ent.skipped && ent.state === "unknown") return ent.state_label || "Skipped";
  if (ent.state === "unknown") return "Checking…";
  if (ent.state === "ok") return "Looks good";
  if (ent.state === "review") return "Worth checking";
  if (ent.exact_cve_count && ent.reasons?.every(r => r.kind === "cve" || r.kind === "placement")) {
    return `${ent.exact_cve_count} security update${ent.exact_cve_count === 1 ? "" : "s"}`;
  }
  if (ent.max_severity === "critical") return "Needs fixing";
  return "Needs attention";
}

function isOutdoorEntity(ent, r) {

    if (ent.kind === "port") {

    }
    if (ent.kind === "device" && state?.view?.entities) {
      for (const other of Object.values(state.view.entities)) {
        if (other.kind === "port" && other.device_id === ent.id && other.port_zone === "external" && other.port_state === "inactive_enabled") {
          return true;
        }
      }
      return false;
    }
  }
  if (r && r.title && r.title.toLowerCase().includes("external")) return true;
  return false;
}
