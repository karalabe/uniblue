function humanEventType(t) {
  const l = (t || "").toLowerCase();
  if (l.includes("threat")) return { label: "Blocked threat", tone: "crit" };
  if (l.includes("honeypot")) return { label: "Intruder trap", tone: "crit" };
  if (l.includes("evil")) return { label: "Fake Wi-Fi", tone: "crit" };
  if (l.includes("tamper")) return { label: "Cable swapped", tone: "crit" };
  if (l.includes("port_link_down") || l.includes("port_down")) return { label: "Cable unplugged", tone: "warn" };
  if (l.includes("port_link_up") || l.includes("port_up")) return { label: "Cable plugged in", tone: "blue" };
  if (l.startsWith("port_")) return { label: "Cable change", tone: "neutral" };
  if (l.includes("admin")) return { label: "Admin login", tone: "blue" };
  if (l.includes("client_joined")) return { label: "Device joined", tone: "ok" };
  if (l.includes("client_moved")) return { label: "Device moved", tone: "warn" };
  if (l.includes("client_left")) return { label: "Device left", tone: "neutral" };
  if (l.includes("host_scanning")) return { label: "Rescanning", tone: "blue" };
  if (l.includes("host_scanned")) return { label: "Device checked", tone: "neutral" };
  if (l.includes("scan_complete")) return { label: "Scan complete", tone: "ok" };
  if (l.includes("startup")) return { label: "Started", tone: "neutral" };
  if (l.includes("vpn")) return { label: "Remote VPN", tone: "blue" };
  if (l.includes("finding")) return { label: "New alert", tone: "warn" };
  if (l === "controller") return { label: "Router log", tone: "neutral" };
  return { label: t.replace(/_/g, " "), tone: "neutral" };
}

function peerNamesForPort(vm, pe) {
  if (!pe?.peer_ids?.length) return [];
  return pe.peer_ids.map(id => vm.entities[id]?.label).filter(Boolean);
}

/* ============================================================================
   NAVIGATION & DRAWER STATE
   ============================================================================ */
function currentDrawerID() {
  return drawerStack.length ? drawerStack[drawerStack.length - 1] : null;
}

function navStateSnapshot() {
  return {
    tab: activeTab,
    drawerStack: [...drawerStack],
    portFilter,
    deviceFilter,
    activityFilter
  };
}

function setActiveTabDOM(tab) {
  activeTab = tab;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
}

function setDrawerOpenDOM(open) {
  const dr = document.getElementById("drawer");
  const bd = document.getElementById("backdrop");
  if (open) {
    renderDrawer();
    dr.classList.add("open");
    dr.setAttribute("aria-hidden", "false");
    bd.classList.add("open");
  } else {
    dr.classList.remove("open");
    dr.setAttribute("aria-hidden", "true");
    bd.classList.remove("open");
  }
}

function switchTab(tab, updateHash = true) {
  const mapOld = { overview: "checkup", physical: "house", logical: "devices" };
  tab = mapOld[tab] || tab;
  if (!["checkup", "house", "devices", "activity"].includes(tab)) tab = "checkup";
  drawerStack = [];
  setDrawerOpenDOM(false);
  setActiveTabDOM(tab);
  if (updateHash) syncHash(true);
  renderActiveTab();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function openEntity(id) {
  if (!id) return;
  const isPanel = id.startsWith("panel:");
  if (!isPanel && !state?.view?.entities?.[id]) return;
  const cur = currentDrawerID();
  if (cur !== id) {
    // Switching filter tabs inside the isolation panel updates the current panel view cleanly.
    if (cur && cur.startsWith("panel:isolation:") && id.startsWith("panel:isolation:")) {
      drawerStack[drawerStack.length - 1] = id;
    } else {
      drawerStack.push(id);
    }
  }
  syncHash(true);
  setDrawerOpenDOM(true);
  if (activeTab === "house") renderHouse();
}

function popDrawer() {
  drawerStack.pop();
  if (!drawerStack.length) {
    closeDrawer(true);
    return;
  }
  syncHash(true);
  setDrawerOpenDOM(true);
  if (activeTab === "house") renderHouse();
}

function closeDrawer(updateHash = true) {
  drawerStack = [];
  if (updateHash) syncHash(true);
  setDrawerOpenDOM(false);
  if (activeTab === "house") renderHouse();
}

function syncHash(push = true) {
  const sel = currentDrawerID();
  const next = sel ? ("#/" + activeTab + "/" + encodeURIComponent(sel)) : ("#/" + activeTab);
  const snap = navStateSnapshot();
  if (!push) {
    history.replaceState(snap, "", next);
    return;
  }
  const cur = history.state;
  const sameDrawer = cur && Array.isArray(cur.drawerStack)
    && cur.drawerStack.length === snap.drawerStack.length
    && cur.drawerStack.every((v, i) => v === snap.drawerStack[i]);
  if (location.hash === next && cur && cur.tab === snap.tab && sameDrawer && cur.deviceFilter === snap.deviceFilter && cur.portFilter === snap.portFilter) {
    return;
  }
  history.pushState(snap, "", next);
}

function setPortFilter(f) {
  portFilter = f;
  syncHash(false);
  renderHouse();
}

function setDeviceFilter(f) {
  deviceFilter = f;
  syncHash(false);
  renderDevices();
}

function setActivityFilter(f) {
  activityFilter = f;
  syncHash(false);
  renderActivity();
}

function applyHash(histState) {
  if (histState && typeof histState === "object" && histState.tab) {
    const tab = ["checkup", "house", "devices", "activity"].includes(histState.tab) ? histState.tab : "checkup";
    if (histState.portFilter) portFilter = histState.portFilter;
    if (histState.deviceFilter) deviceFilter = histState.deviceFilter;
    if (histState.activityFilter) activityFilter = histState.activityFilter;
    setActiveTabDOM(tab);
    const stack = Array.isArray(histState.drawerStack)
      ? histState.drawerStack.filter(id => id && (id.startsWith("panel:") || state?.view?.entities?.[id]))
      : [];
    drawerStack = stack;
    setDrawerOpenDOM(drawerStack.length > 0);
    return;
  }

  const h = (location.hash || "").replace(/^#\/?/, "");
  if (!h) {
    setActiveTabDOM("checkup");
    drawerStack = [];
    setDrawerOpenDOM(false);
    return;
  }
  const slash = h.indexOf("/");
  let tab = slash === -1 ? h : h.slice(0, slash);
  const mapOld = { overview: "checkup", physical: "house", logical: "devices" };
  tab = mapOld[tab] || tab;
  let ent = "";
  if (slash !== -1) {
    try {
      ent = decodeURIComponent(h.slice(slash + 1));
    } catch (_) {
      return;
    }
  }
  if (["checkup", "house", "devices", "activity"].includes(tab)) {
    setActiveTabDOM(tab);
  }
  if (ent && (ent.startsWith("panel:") || state?.view?.entities?.[ent])) {
    drawerStack = [ent];
    setDrawerOpenDOM(true);
  } else {
    drawerStack = [];
    setDrawerOpenDOM(false);
  }
}

document.querySelectorAll(".nav-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawerStack.length) closeDrawer(true); });
window.addEventListener("popstate", e => { applyHash(e.state); renderActiveTab(); });
window.addEventListener("hashchange", () => { applyHash(history.state); renderActiveTab(); });
// Safe delegated click handler for entity/panel/action navigation (eliminates inline JS string handlers).
document.addEventListener("click", e => {
  const stopEntEl = e.target.closest("[data-stop-entity-id]");
  if (stopEntEl) {
    e.stopPropagation();
    openEntity(stopEntEl.getAttribute("data-stop-entity-id"));
    return;
  }
  const actEl = e.target.closest("[data-action]");
  if (actEl) {
    const act = actEl.getAttribute("data-action");
    if (act === "switch-tab") {
      const df = actEl.getAttribute("data-device-filter");
      if (df) deviceFilter = df;
      switchTab(actEl.getAttribute("data-tab-target") || "checkup");
    } else if (act === "close-drawer") {
      closeDrawer(true);
    } else if (act === "pop-drawer") {
      popDrawer();
    } else if (act === "rescan") {
      triggerRescan(actEl.getAttribute("data-rescan-ip") || "");
    } else if (act === "port-filter") {
      setPortFilter(actEl.getAttribute("data-filter") || "all");
    } else if (act === "device-filter") {
      setDeviceFilter(actEl.getAttribute("data-filter") || "all");
    } else if (act === "activity-filter") {
      setActivityFilter(actEl.getAttribute("data-filter") || "all");
    } else if (act === "show-splash") {
      bypassInitialSplash = false;
      renderActiveTab();
    } else if (act === "bypass-splash") {
      bypassInitialSplash = true;
      renderActiveTab();
    }
    return;
  }
  const entEl = e.target.closest("[data-entity-id]");
  if (entEl) {
    openEntity(entEl.getAttribute("data-entity-id"));
    return;
  }
  const panEl = e.target.closest("[data-panel-id]");
  if (panEl) {
    openEntity(panEl.getAttribute("data-panel-id"));
  }
});

/* ============================================================================
   HEADER & NAV COUNTS
   ============================================================================ */
function isInitialScanActive() {
  if (!state || isStaticMode) return false;
  const hasBaseline = Boolean(state.last_full_scan_at && !String(state.last_full_scan_at).startsWith("0001-"));
  if (hasBaseline) return false;
  return Boolean(state.scan_progress && state.scan_progress.initial);
}

function hasPrimaryExposedReason(ent) {
  if (!ent || ent.state !== "exposed") return false;
  const exposedReasons = (ent.reasons || []).filter(r => r.state === "exposed");
  if (!exposedReasons.length) return true;
  return exposedReasons.some(r => !r.secondary);
}

function isOutdoorPerimeterItem(vm, item) {
  const ent = vm?.entities?.[item.subject_id];
  if (!ent) return true;
  if (ent.kind === "port") {
    return ent.side === "outside" || ent.port_zone === "external" || ent.port_zone === "external_uplink";
  }
  if (ent.kind === "device") {
    if (ent.side === "outside") return true;
    for (const other of Object.values(vm.entities || {})) {
      if (other.kind === "port" && other.device_id === ent.id && other.port_zone === "external" && other.port_state === "inactive_enabled") {
        return true;
      }
    }
    return false;
  }
  return ent.side === "outside";
}

function matchQueueReason(ent, item) {
  const reasons = ent?.reasons || [];
  return reasons.find(r => r.ref === item.reason_ref && item.sentence && item.sentence.includes(r.title))
    || reasons.find(r => r.ref === item.reason_ref)
    || reasons[0]
    || null;
}

function renderScanBanner(initial) {
  const host = document.getElementById("scan-banner");
  if (!host) return;
  if (state?.last_scan_error && !state?.scanning) {
    host.innerHTML = `<div class="scan-banner" style="background:var(--crit-bg);border-color:var(--crit-bd);color:var(--crit)">
      <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
        <span class="sdot" style="background:var(--crit-solid);flex-shrink:0"></span>
        <div style="min-width:0">
          <strong>Network scan failed:</strong>
          <span>${esc(state.last_scan_error)}</span>
        </div>
      </div>
      ${isStaticMode ? "" : `<button class="btn sm" data-action="rescan">Retry now</button>`}
    </div>`;
    return;
  }
  const sp = state?.scan_progress;
  if (!state?.scanning || !sp || (initial && !bypassInitialSplash)) {
    host.innerHTML = "";
    return;
  }
  const pct = Math.max(4, Math.min(99, Number(sp.percent) || 0));
  host.innerHTML = `<div class="scan-banner">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
      <span class="sdot" style="background:var(--blue);animation:pulse 1.2s infinite;flex-shrink:0"></span>
      <div style="min-width:0">
        <strong>${initial ? "Initial checkup in progress" : "Refreshing network scan"}:</strong>
        <span>${esc(sp.label || "Checking devices…")}</span>
        ${sp.current_host ? `<span class="small mono"> · ${esc(sp.current_host)}</span>` : ""}
        ${initial ? `<span class="small"> · Counts below are partial until baseline completes.</span>` : ""}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="scan-banner-bar"><div style="width:${pct}%"></div></div>
      <span class="mono" style="font-size:12px;font-weight:700;color:var(--blue)">${pct}%</span>
      ${initial ? `<button class="btn sm" data-action="show-splash">Show progress</button>` : ""}
    </div>
  </div>`;
}

function renderInitialSplash() {
  const vm = state?.view || { census: {}, entities: {} };
  const hosts = Object.values(vm.entities || {}).filter(e => e.kind === "host");
  const sp = state?.scan_progress || {
    phase: "topology",
    label: "Starting initial network checkup…",
    completed: 0,
    total: hosts.length,
    percent: 4
  };
  const pct = Math.max(4, Math.min(99, Number(sp.percent) || 4));
  const totalHosts = hosts.length || ((sp.phase === "probing" || sp.phase === "checks") ? sp.total : 0);
  const C = 226.2;
  const offset = C * (1 - pct / 100);

  const phaseRank = { topology: 0, discovery: 1, probing: 1, fingerprinting: 2, "fingerprinting-fallback": 2, checks: 3, evaluating: 4 };
  const rank = phaseRank[sp.phase] ?? 0;
  const stepState = (idx) => (idx < rank ? "done" : (idx === rank ? "active" : ""));
  const stepMark = (idx) => (idx < rank ? "✓" : (idx === rank ? "·" : ""));

  const probeCount = (sp.phase === "probing" && sp.total > 0)
    ? ` (${sp.completed} / ${sp.total} devices)`
    : (rank > 1 && totalHosts > 0 ? ` (${totalHosts} / ${totalHosts} devices)` : "");
  const fpCount = ((sp.phase === "fingerprinting" || sp.phase === "fingerprinting-fallback") && sp.total > 0)
    ? ` (${sp.completed} / ${sp.total} ports)`
    : "";
  const checkCount = (sp.phase === "checks" && sp.total > 0)
    ? ` (${sp.completed} / ${sp.total} devices)`
    : (rank > 3 && totalHosts > 0 ? ` (${totalHosts} / ${totalHosts} devices)` : "");

  document.getElementById("view-initial").innerHTML = `
    <div class="init-splash">
      <div class="init-ring">
        <svg class="ring-svg" viewBox="0 0 84 84">
          <circle class="ring-bg" cx="42" cy="42" r="36"></circle>
          <circle class="ring-fg" cx="42" cy="42" r="36" stroke="var(--blue)" stroke-dasharray="${C}" stroke-dashoffset="${offset.toFixed(1)}"></circle>
        </svg>
        <div class="ring-center" style="color:var(--blue)">${pct}%</div>
      </div>
      <h1 class="init-title">Checking your home network…</h1>
      <p class="init-sub">
        UniBlue is gently checking ${totalHosts ? `<strong>${totalHosts}</strong> devices` : "your devices"}, cables, and firewall rules.
        Your full security checkup will appear automatically as soon as this first scan completes.
      </p>

      <div class="pbar-wrap">
        <div class="pbar-meta">
          <strong style="color:var(--text)">${esc(sp.label || "Checking devices…")}</strong>
          <span class="mono" style="font-weight:700;color:var(--blue)">${pct}%</span>
        </div>
        <div class="pbar-track"><div class="pbar-fill" style="width:${pct}%"></div></div>
        <div class="pbar-host">${sp.current_host ? `Last checked: <strong>${esc(sp.current_host)}</strong>` : "Read-only &amp; rate-paced so fragile IoT gear stays undisturbed."}</div>
      </div>

      <div class="init-steps">
        <div class="init-step ${stepState(0)}"><span class="step-dot">${stepMark(0)}</span>Read UniFi router, switches, cables &amp; firewall rules</div>
        <div class="init-step ${stepState(1)}"><span class="step-dot">${stepMark(1)}</span>Discover devices &amp; scan open ports${esc(probeCount)}</div>
        <div class="init-step ${stepState(2)}"><span class="step-dot">${stepMark(2)}</span>Identify services across open ports${esc(fpCount)}</div>
        <div class="init-step ${stepState(3)}"><span class="step-dot">${stepMark(3)}</span>Run read-only security checks${esc(checkCount)}</div>
        <div class="init-step ${stepState(4)}"><span class="step-dot">${stepMark(4)}</span>Evaluate firewall isolation &amp; known security bugs (CVEs)</div>
      </div>

      <div class="init-foot">
        <button class="btn sm ghost" data-action="bypass-splash">Peek at partial cables &amp; devices while scanning →</button>
      </div>
    </div>`;
}

function renderHeader() {
  const vm = state.view || { census: {}, queue: [], entities: {} };
  const c = vm.census || {};
  const hosts = Object.values(vm.entities || {}).filter(e => e.kind === "host");
  const skippedCount = hosts.filter(e => e.skipped).length;
  const scannableCount = Math.max(0, hosts.length - skippedCount);
  const unassessed = c.unassessed_count || 0;
  const initial = isInitialScanActive();
  const checking = Boolean(state.scanning || (state.scan_progress && state.scan_progress.initial));
  const sp = state.scan_progress;

  const pill = document.getElementById("status-pill");
  const lbl = document.getElementById("status-lbl");
  if (isStaticMode) {
    pill.className = "status-pill";
    lbl.textContent = "Saved Snapshot · " + fmtTime(state.updated_at);
    document.getElementById("rescan-btn").style.display = "none";
  } else if (sseDisconnected) {
    pill.className = "status-pill";
    lbl.textContent = sseSource ? "Reconnecting..." : "Offline (reconnecting...)";
  } else if (checking) {
    pill.className = "status-pill scanning";
    if (sp && sp.percent > 0) {
      lbl.textContent = `Scanning ${sp.percent}%…`;
    } else {
      const done = Math.max(0, scannableCount - unassessed);
      lbl.textContent = unassessed > 0 ? `Checking ${done}/${scannableCount}…` : "Checking network…";
    }
  } else if (state.last_scan_error) {
    pill.className = "status-pill";
    lbl.textContent = "Scan error";
  } else {
    pill.className = "status-pill live";
    lbl.textContent = "Live · " + fmtTime(state.updated_at);
  }

  const q = vm.queue || [];
  const exposedBMCCount = hosts.filter(e => e.is_bmc && hasPrimaryExposedReason(e)).length;
  const exposedHostCount = hosts.filter(e => !e.is_bmc && hasPrimaryExposedReason(e)).length;
  const wanAlertCount = (vm.wan_flows || []).filter(f => !f.expected && f.kind !== "coverage" && f.state !== "unknown").length;
  const perimCount = q.filter(x => x.category === "perimeter").length;
  const ctrlCount = q.filter(x => x.category === "controller").length;
  const checkupTotal = exposedBMCCount + perimCount + wanAlertCount + exposedHostCount + ctrlCount;
  const checkupHasCrit = q.some(x => x.severity === "critical")
    || hosts.some(e => hasPrimaryExposedReason(e) && e.max_severity === "critical")
    || (vm.wan_flows || []).some(f => !f.expected && f.kind !== "coverage" && f.state !== "unknown" && f.severity === "critical");
  const ckB = document.getElementById("nb-ck");
  if (initial && !bypassInitialSplash) {
    ckB.textContent = "…";
    ckB.className = "nav-cnt blue";
  } else {
    ckB.textContent = checking && !checkupTotal ? "…" : checkupTotal;
    ckB.className = "nav-cnt" + (checkupHasCrit ? " crit" : checkupTotal ? " warn" : checking ? " blue" : "");
  }

  const openGates = c.open_wall_gates || 0;
  const hsB = document.getElementById("nb-hs");
  hsB.textContent = openGates;
  hsB.style.display = (openGates && !(initial && !bypassInitialSplash)) ? "" : "none";
  hsB.className = "nav-cnt crit";

  const expHosts = hosts.filter(e => e.state === "exposed").length;
  const dvB = document.getElementById("nb-dv");
  if (initial && !bypassInitialSplash) {
    dvB.textContent = hosts.length ? String(hosts.length) : "…";
    dvB.className = "nav-cnt";
  } else {
    dvB.textContent = expHosts || hosts.length;
    dvB.className = "nav-cnt" + (hosts.some(e => e.state === "exposed" && e.max_severity === "critical") ? " crit" : expHosts ? " warn" : "");
  }

  const actCount = (state.events || []).length + (state.report?.unifi_posture?.recent_logs || []).length;
  document.getElementById("nb-ac").textContent = actCount;

  if (vm.copyright) {
    const authorURL = vm.author_url || "https://x.com/peter_szilagyi";
    const cpHTML = esc(vm.copyright).replace(
      "Péter Szilágyi",
      `<a href="${esc(authorURL)}" target="_blank" rel="noopener noreferrer">Péter Szilágyi</a>`
    );
    document.getElementById("app-footer").innerHTML = `
      <span><strong>UniBlue</strong> · Home &amp; UniFi network security checkup · Site: <strong>${esc(state.site || "default")}</strong></span>
      <span>${cpHTML} · <a href="${esc(vm.repo_url)}/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">${esc(vm.license)}</a> · <a href="${esc(vm.repo_url)}" target="_blank" rel="noopener noreferrer">github.com/karalabe/uniblue</a></span>`;
  }
}

/* ============================================================================
   TAB 1: CHECKUP (Plain-English Security Checkup Hero + Guided Story Cards)
   ========================================================================== */
function renderCheckup() {
  const vm = state.view;
  if (!vm) return;
  const c = vm.census || {};
  const ents = Object.values(vm.entities || {});
  const hosts = ents.filter(e => e.kind === "host");
  const skippedCount = hosts.filter(e => e.skipped).length;
  const scannableCount = Math.max(0, hosts.length - skippedCount);
  const unassessed = c.unassessed_count || 0;
  const checking = Boolean(state.scanning || (state.scan_progress && state.scan_progress.initial));
  const assessedCount = Math.max(0, scannableCount - unassessed);

  const bmcHosts = hosts.filter(e => e.is_bmc);
  const exposedBMCs = bmcHosts.filter(e => hasPrimaryExposedReason(e));
  const exposedHosts = hosts.filter(e => !e.is_bmc && hasPrimaryExposedReason(e));
  const secondaryExposedHosts = hosts.filter(e => e.state === "exposed" && !hasPrimaryExposedReason(e));
  const wanFlowsAll = vm.wan_flows || [];
  const wanAlerts = wanFlowsAll.filter(f => !f.expected && f.kind !== "coverage" && f.state !== "unknown");
  const wanCoverageUnknown = wanFlowsAll.filter(f => f.kind === "coverage" || f.state === "unknown");
  const perimItems = (vm.queue || []).filter(x => x.category === "perimeter");
  const outdoorPerimItems = perimItems.filter(x => isOutdoorPerimeterItem(vm, x));
  const indoorPortItems = perimItems.filter(x => !isOutdoorPerimeterItem(vm, x));
  const ctrlItems = (vm.queue || []).filter(x => x.category === "controller");
  const totalIssues = exposedBMCs.length + perimItems.length + wanAlerts.length + exposedHosts.length + ctrlItems.length;
  const hasCrit = (vm.queue || []).some(x => x.severity === "critical")
    || exposedBMCs.some(x => x.max_severity === "critical")
    || exposedHosts.some(x => x.max_severity === "critical")
    || wanAlerts.some(x => x.severity === "critical");

  // Compute SVG Progress Ring (r=36, circumference=226.2)
  const C = 226.2;
  let ringColor = "var(--ok-solid)";
  let ringOffset = 0;
  let ringSpin = "";
  let ringLabel = "✓";
  let heroTitle = "Your home network looks great";
  let heroSub = skippedCount
    ? `All ${assessedCount} checked devices (${skippedCount} skipped) and ${(vm.physical || []).length} network boxes checked out cleanly.`
    : `All ${hosts.length} devices and ${(vm.physical || []).length} network boxes checked out cleanly.`;

  if (checking && totalIssues === 0) {
    const pct = scannableCount ? (assessedCount / scannableCount) : 0.25;
    ringColor = "var(--blue)";
    ringOffset = C * (1 - Math.max(0.18, pct));
    ringSpin = unassessed === scannableCount ? " spin" : "";
    ringLabel = scannableCount ? `${Math.round(pct * 100)}%` : "…";
    heroTitle = "Checking your home network…";
    heroSub = `Checked ${assessedCount} of ${scannableCount} devices so far${skippedCount ? ` (${skippedCount} skipped)` : ""}. Results appear automatically as each device finishes; nothing is marked safe until checked.`;
  } else if (totalIssues > 0) {
    ringColor = hasCrit ? "var(--crit-solid)" : "var(--warn-solid)";
    ringOffset = C * 0.22;
    ringLabel = String(totalIssues);
    heroTitle = totalIssues === 1
      ? "1 thing worth tightening up"
      : `${totalIssues} things worth tightening up`;
    const parts = [];
    if (exposedBMCs.length) parts.push(`${exposedBMCs.length} server hardware control panel${exposedBMCs.length === 1 ? "" : "s"}`);
    if (outdoorPerimItems.length) parts.push(`${outdoorPerimItems.length} outdoor cable alert${outdoorPerimItems.length === 1 ? "" : "s"}`);
    if (indoorPortItems.length) parts.push(`${indoorPortItems.length} switch port alert${indoorPortItems.length === 1 ? "" : "s"}`);
    if (wanAlerts.length) parts.push(`${wanAlerts.length} open internet door${wanAlerts.length === 1 ? "" : "s"}`);
    if (exposedHosts.length) parts.push(`${exposedHosts.length} device${exposedHosts.length === 1 ? "" : "s"} needing updates or fixes`);
    if (ctrlItems.length) parts.push(`${ctrlItems.length} router setting${ctrlItems.length === 1 ? "" : "s"}`);
    heroSub = (checking ? `Still checking ${unassessed} device${unassessed === 1 ? "" : "s"} · Found so far: ` : "We found ")
      + parts.join(", ") + ". Click any item below for plain-English steps to fix it.";
  } else if (wanCoverageUnknown.length > 0) {
    ringColor = "var(--warn-solid)";
    ringOffset = C * 0.25;
    ringLabel = "?";
    heroTitle = "Internet edge coverage is incomplete";
    heroSub = "Some router firewall or port-forward feeds were unavailable from UniFi, so UniBlue cannot confirm the internet front door is locked.";
  } else if (unassessed > 0) {
    ringColor = "var(--warn-solid)";
    ringOffset = C * 0.25;
    ringLabel = "?";
    heroTitle = "Network checkup incomplete";
    heroSub = `${unassessed} of ${scannableCount} device${scannableCount === 1 ? "" : "s"} have not been assessed yet.`;
  }

  // 3 Clean Pillar Cards inside Hero
  const cableTone = perimItems.some(x => x.severity === "critical") ? "crit" : (perimItems.length ? "warn" : "ok");
  const devTone = exposedHosts.some(x => x.max_severity === "critical") || exposedBMCs.some(x => x.max_severity === "critical")
    ? "crit"
    : ((exposedHosts.length + exposedBMCs.length + secondaryExposedHosts.length) ? "warn" : ((checking || unassessed > 0) ? "blue" : "ok"));
  const wanTone = wanAlerts.some(x => x.severity === "critical")
    ? "crit"
    : ((wanAlerts.length + ctrlItems.length + wanCoverageUnknown.length) ? "warn" : "ok");

  let devPillarVal = `All ${hosts.length} look good`;
  if (exposedHosts.length + exposedBMCs.length) {
    devPillarVal = `${exposedHosts.length + exposedBMCs.length} need attention`;
  } else if (secondaryExposedHosts.length) {
    devPillarVal = secondaryExposedHosts.length === 1
      ? "1 needs review (linked alert)"
      : `${secondaryExposedHosts.length} need review (linked alerts)`;
  } else if (checking) {
    devPillarVal = `Checking ${assessedCount}/${scannableCount}…`;
  } else if (unassessed > 0) {
    devPillarVal = `${unassessed} unassessed`;
  } else if (skippedCount > 0) {
    devPillarVal = `${assessedCount} OK (${skippedCount} skipped)`;
  }

  let wanPillarVal = "Front door locked";
  if (wanAlerts.length) {
    wanPillarVal = `${wanAlerts.length} open door${wanAlerts.length === 1 ? "" : "s"} to review`;
  } else if (wanCoverageUnknown.length) {
    wanPillarVal = "Coverage unknown";
  }

  let html = `
  <div class="hero">
    <div class="hero-top">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 84 84">
          <circle class="ring-bg" cx="42" cy="42" r="36"></circle>
          <circle class="ring-fg${ringSpin}" cx="42" cy="42" r="36" stroke="${ringColor}" stroke-dasharray="${C}" stroke-dashoffset="${ringOffset.toFixed(1)}"></circle>
        </svg>
        <div class="ring-center" style="color:${ringColor}">${esc(ringLabel)}</div>
      </div>
      <div class="hero-copy">
        <h1 class="hero-title">${esc(heroTitle)}</h1>
        <p class="hero-sub">${esc(heroSub)}</p>
      </div>
    </div>

    <div class="hero-pillars">
      <div class="pillar" data-action="switch-tab" data-tab-target="house">
        <div class="pillar-ico ${cableTone}">${perimItems.length ? ICONS.unlock : ICONS.lock}</div>
        <div>
          <div class="pillar-lbl">House &amp; Outdoor Cables</div>
          <div class="pillar-val">${outdoorPerimItems.length ? `${c.open_wall_gates || outdoorPerimItems.length} need locking` : (indoorPortItems.length ? `${indoorPortItems.length} switch port alert${indoorPortItems.length === 1 ? "" : "s"}` : "All outdoor cables locked")}</div>
        </div>
      </div>
      <div class="pillar" data-action="switch-tab" data-tab-target="devices" data-device-filter="${(exposedHosts.length + exposedBMCs.length + secondaryExposedHosts.length) ? "issues" : "all"}">
        <div class="pillar-ico ${devTone}">${ICONS.laptop}</div>
        <div>
          <div class="pillar-lbl">Devices &amp; Updates</div>
          <div class="pillar-val">${esc(devPillarVal)}</div>
        </div>
      </div>
      <div class="pillar" data-action="switch-tab" data-tab-target="devices" data-device-filter="wan">
        <div class="pillar-ico ${wanTone}">${ICONS.globe}</div>
        <div>
          <div class="pillar-lbl">Internet Front Door</div>
          <div class="pillar-val">${esc(wanPillarVal)}</div>
        </div>
      </div>
    </div>
  </div>`;

  html += `<div class="checkup-grid"><div>`;
  html += `<div class="section-kicker">Action Guide</div>`;

  // 1. Hardware Remote Controls (BMCs)
  if (bmcHosts.length) {
    const tone = exposedBMCs.some(x => x.max_severity === "critical") ? "crit" : (exposedBMCs.length ? "warn" : "blue");
    html += `<div class="story">
      <div class="story-hd">
        <div class="story-hd-l">
          <div class="story-ico ${tone}">${ICONS.cpu}</div>
          <div>
            <div class="story-title">Server Hardware Remote Controls (${bmcHosts.length})</div>
            <div class="story-why">These built-in control boards act like a physical power button, BIOS screen, and keyboard for your servers. Keeping them on a private network prevents other devices from touching them.</div>
          </div>
        </div>
      </div>`;
    for (const bmc of bmcHosts) {
      const portEnt = bmc.port_id ? vm.entities[bmc.port_id] : null;
      const chips = (bmc.services || []).filter(s => s.exposed).slice(0, 3).map(s => `<span class="tag ${humanStateTone(s.severity)}">${esc(humanServiceChip(s))}</span>`).join("");
      html += `<div class="story-item" data-entity-id="${esc(bmc.id)}">
        <div class="story-item-l">
          <div class="story-item-name">${esc(bmc.label)} <span class="tag ${humanStateTone(bmc)}">${esc(humanStateLabel(bmc))}</span></div>
          <div class="story-item-sub">On <strong>${esc(bmc.network_name || "main")}</strong> network${portEnt ? ` · Plugged into <strong>${esc(portEnt.label)}</strong>` : ""} · <span class="mono">${esc(bmc.ip)}</span></div>
        </div>
        <div class="story-item-r">${chips}<span class="go-arrow">Fix →</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  // 2. Outdoor Cables & Switches
  if (outdoorPerimItems.length) {
    const tone = outdoorPerimItems.some(x => x.severity === "critical") ? "crit" : "warn";
    html += `<div class="story">
      <div class="story-hd">
        <div class="story-hd-l">
          <div class="story-ico ${tone}">${ICONS.unlock}</div>
          <div>
            <div class="story-title">Cables Going Outside Your House (${outdoorPerimItems.length})</div>
            <div class="story-why">If someone unplugs an outdoor camera or switch cable, locking these ports stops them from plugging in a laptop and reaching your home network.</div>
          </div>
        </div>
        <button class="btn sm" data-action="switch-tab" data-tab-target="house">View House Map</button>
      </div>`;
    for (const item of outdoorPerimItems) {
      const ent = vm.entities[item.subject_id];
      const peers = ent ? peerNamesForPort(vm, ent) : [];
      const headline = ent?.kind === "port" && peers.length
        ? `${ent.label} → ${peers[0]}`
        : (ent ? ent.label : item.sentence);
      const matchR = matchQueueReason(ent, item);
      const topReason = matchR ? humanReason(matchR, ent).title : item.sentence;
      html += `<div class="story-item" data-entity-id="${esc(item.subject_id)}">
        <div class="story-item-l">
          <div class="story-item-name">${esc(headline)} <span class="tag ${humanStateTone(item.severity)}">${item.severity === "critical" ? "Urgent" : "Review"}</span></div>
          <div class="story-item-sub">${esc(topReason)}</div>
        </div>
        <div class="story-item-r"><span class="go-arrow">How to lock →</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  // 2b. Indoor Switch Port Alerts (unused indoor ports, restricted desk jacks, STP blocks)
  if (indoorPortItems.length) {
    const tone = indoorPortItems.some(x => x.severity === "critical") ? "crit" : "warn";
    html += `<div class="story">
      <div class="story-hd">
        <div class="story-hd-l">
          <div class="story-ico ${tone}">${ICONS.plug}</div>
          <div>
            <div class="story-title">Indoor Switch Port Alerts (${indoorPortItems.length})</div>
            <div class="story-why">Unused indoor switch ports or restricted desk jacks need attention so unauthorized hardware cannot connect.</div>
          </div>
        </div>
        <button class="btn sm" data-action="switch-tab" data-tab-target="house">View House Map</button>
      </div>`;
    for (const item of indoorPortItems) {
      const ent = vm.entities[item.subject_id];
      const peers = ent ? peerNamesForPort(vm, ent) : [];
      const headline = ent?.kind === "port" && peers.length
        ? `${ent.label} → ${peers[0]}`
        : (ent ? ent.label : item.sentence);
      const matchR = matchQueueReason(ent, item);
      const topReason = matchR ? humanReason(matchR, ent).title : item.sentence;
      html += `<div class="story-item" data-entity-id="${esc(item.subject_id)}">
        <div class="story-item-l">
          <div class="story-item-name">${esc(headline)} <span class="tag ${humanStateTone(item.severity)}">${item.severity === "critical" ? "Urgent" : "Review"}</span></div>
          <div class="story-item-sub">${esc(topReason)}</div>
        </div>
        <div class="story-item-r"><span class="go-arrow">Inspect →</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  // 3. Open Doors to the Internet (WAN) & Missing WAN Coverage
  if (wanAlerts.length) {
    const tone = wanAlerts.some(x => x.severity === "critical") ? "crit" : "warn";
    html += `<div class="story">
      <div class="story-hd">
        <div class="story-hd-l">
          <div class="story-ico ${tone}">${ICONS.globe}</div>
          <div>
            <div class="story-title">Open Doors to the Internet (${wanAlerts.length})</div>
            <div class="story-why">Your router lets traffic from the public internet reach these devices directly. Double-check that each one is intentional and kept up to date.</div>
          </div>
        </div>
      </div>`;
    for (const f of wanAlerts) {
      const target = f.kind === "firewall" ? f.id : (f.target_id || vm.gateway_id);
      html += `<div class="story-item" data-entity-id="${esc(target)}">
        <div class="story-item-l">
          <div class="story-item-name">${esc(f.rule_name)} <span class="tag ${humanStateTone(f.severity)}">${f.severity === "critical" ? "Urgent" : "Review"}</span></div>
          <div class="story-item-sub">Points to <strong>${esc(f.target_name || f.target_ip || "Router")}</strong> · <span class="mono">${esc(f.label)}</span></div>
        </div>
        <div class="story-item-r"><span class="go-arrow">Inspect →</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  if (wanCoverageUnknown.length) {
    html += `<div class="story">
      <div class="story-hd">
        <div class="story-hd-l">
          <div class="story-ico warn">${ICONS.globe}</div>
          <div>
            <div class="story-title">Internet Edge Visibility Incomplete (${wanCoverageUnknown.length})</div>
            <div class="story-why">The UniFi controller did not return all internet-edge policy feeds, so UniBlue cannot verify that inbound WAN access is locked down.</div>
          </div>
        </div>
      </div>`;
    for (const f of wanCoverageUnknown) {
      const rawTarget = f.target_id || vm.gateway_id || "";
      const target = (rawTarget && vm.entities && vm.entities[rawTarget]) ? rawTarget : "";
      html += `<div class="story-item" ${target ? `data-entity-id="${esc(target)}"` : ""}>
        <div class="story-item-l">
          <div class="story-item-name">${esc(f.rule_name)} <span class="tag unk">Unknown</span></div>
          <div class="story-item-sub">${esc(f.label)}</div>
        </div>
        ${target ? `<div class="story-item-r"><span class="go-arrow">Inspect →</span></div>` : ""}
      </div>`;
    }
    html += `</div>`;
  }

  // 4. Devices Needing Updates or Fixes
  if (exposedHosts.length) {
    const tone = exposedHosts.some(x => x.max_severity === "critical") ? "crit" : "warn";
    html += `<div class="story">
      <div class="story-hd">
        <div class="story-hd-l">
          <div class="story-ico ${tone}">${ICONS.alert}</div>
          <div>
            <div class="story-title">Devices Needing Updates or Fixes (${exposedHosts.length})</div>
            <div class="story-why">Devices running software with known security bugs, or exposing older unprotected logins on your home network.</div>
          </div>
        </div>
        <button class="btn sm" data-action="switch-tab" data-tab-target="devices" data-device-filter="issues">See All Devices</button>
      </div>`;
    const sorted = [...exposedHosts].sort((a, b) => (b.exact_cve_count || 0) - (a.exact_cve_count || 0));
    for (const h of sorted) {
      const portEnt = h.port_id ? vm.entities[h.port_id] : null;
      const tags = [];
      if (h.exact_cve_count) {
        tags.push(`<span class="tag ${humanStateTone(h)}">${h.exact_cve_count} security bug${h.exact_cve_count === 1 ? "" : "s"}</span>`);
      }
      for (const s of (h.services || []).filter(x => x.exposed).slice(0, 2)) {
        tags.push(`<span class="tag ${humanStateTone(s.severity)}">${esc(humanServiceChip(s))}</span>`);
      }
      html += `<div class="story-item" data-entity-id="${esc(h.id)}">
        <div class="story-item-l">
          <div class="story-item-name">${esc(h.label)}</div>
          <div class="story-item-sub">${esc(humanRole(h.role, false))} · On <strong>${esc(h.network_name || "main")}</strong>${portEnt ? ` · ${esc(portEnt.label)}` : (h.essid ? ` · Wi-Fi: ${esc(h.essid)}` : "")}</div>
        </div>
        <div class="story-item-r">${tags.join("")}<span class="go-arrow">Details →</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  // 5. Router & Wi-Fi Quick Settings
  if (ctrlItems.length) {
    const tone = ctrlItems.some(x => x.severity === "critical") ? "crit" : "warn";
    html += `<div class="story">
      <div class="story-hd">
        <div class="story-hd-l">
          <div class="story-ico ${tone}">${ICONS.sliders}</div>
          <div>
            <div class="story-title">Quick Router &amp; Wi-Fi Settings (${ctrlItems.length})</div>
            <div class="story-why">Simple switches and firmware updates on your UniFi router, switches, and Wi-Fi to close easy loopholes.</div>
          </div>
        </div>
      </div>`;
    for (const item of ctrlItems) {
      const gw = vm.entities[item.subject_id];
      const reasons = gw?.reasons || [];
      const matchR = reasons.find(r => r.ref === item.reason_ref && item.sentence && item.sentence.endsWith(r.title))
        || reasons.find(r => r.ref === item.reason_ref);
      const hr = matchR ? humanReason(matchR, gw) : { title: item.sentence, why: "" };
      const sevTag = item.severity === "critical" ? `<span class="tag crit">Urgent</span>` : "";
      html += `<div class="story-item" data-entity-id="${esc(item.subject_id)}">
        <div class="story-item-l">

  const settingsUnknownTone = settingsFeedMissing ? "warn" : "neutral";

  const s = hasSettings ? rawSettings : {};
  const rawHealth = state.report?.unifi_posture?.health;
  const hasHealth = rawHealth != null && typeof rawHealth === "object";
  const h = hasHealth ? rawHealth : {};
  const rawPosture = state.report?.unifi_posture;
  const hasPosture = rawPosture != null && typeof rawPosture === "object";
  const posture = hasPosture ? rawPosture : {};

  const checks = [
    {
      name: "Intrusion Shield",
      hint: "Blocks attacks automatically",
      tone: !hasSettings ? settingsUnknownTone : ((s.ips_mode === "ips" || s.ips_mode === "ids") ? "ok" : "warn"),
      val: !hasSettings ? settingsUnknownVal : (s.ips_mode === "ips" ? "Blocking threats" : (s.ips_mode === "ids" ? "Alerting only" : "Turned off"))
    },
    {
      name: "Auto Port Opening",
      hint: "UPnP for apps & gadgets",
      tone: !hasSettings ? settingsUnknownTone : (s.upnp_enabled ? "warn" : "ok"),
      val: !hasSettings ? settingsUnknownVal : (s.upnp_enabled ? "On (risky)" : "Off (safer)")

    {

      hint: "Checks for copycat networks",
      tone: !hasPosture ? "neutral" : (posture.evil_twin_count ? "crit" : "ok"),
      val: !hasPosture ? "Unknown" : (posture.evil_twin_count ? `${posture.evil_twin_count} suspicious!` : `All clear (${posture.neighbor_aps || 0} nearby)`)
    },
    {
      name: "Router Admin Login",
      hint: "SSH password protection",
      tone: !hasSettings ? settingsUnknownTone : ((s.ssh_enabled && s.ssh_password_auth) ? "warn" : "ok"),
      val: !hasSettings ? settingsUnknownVal : (s.ssh_enabled ? (s.ssh_password_auth ? "Password on" : "Key-only") : "Turned off")
    },

      name: "Encrypted DNS",
      hint: "Hides web lookups from ISP",

  const notes = state.report?.posture_notes || [];
  if (notes.length) {
    html += `<details class="tech" data-details-key="posture-notes" style="margin-top:0">
      <summary>Good to know (${notes.length} note${notes.length === 1 ? "" : "s"})</summary>
      <div class="tech-body">
        ${notes.slice(0, 8).map(n => `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)">
          <div style="font-weight:700;font-size:13px">${esc(n.title)}</div>
          <div class="small" style="margin-top:2px">${esc(n.detail)}</div>
        </div>`).join("")}
      </div>
    </details>`;

  // Clickable Isolation Boundaries & Service Visibility cards
  const iso = vm.isolation;
  if (iso && iso.cells && iso.cells.length) {
    html += `<div class="card" style="margin-top:16px">
      <div class="card-hd">

        <div class="chk-row click" data-panel-id="panel:isolation:approved"><div class="chk-l"><span class="chk-dot ok"></span><div><div class="chk-name">Approved shared services</div><div class="chk-hint">e.g. Guest printing</div></div></div><div class="chk-val ok">${iso.approved_count || 0} →</div></div>
        <div class="chk-row click" data-panel-id="panel:isolation:violation"><div class="chk-l"><span class="chk-dot ${(iso.violation_count || 0) ? "crit" : "ok"}"></span><div><div class="chk-name">Policy violations</div><div class="chk-hint">Paths needing narrower rules</div></div></div><div class="chk-val ${(iso.violation_count || 0) ? "crit" : "ok"}">${iso.violation_count || 0} →</div></div>
        ${(iso.broken_dep_count || 0) ? `<div class="chk-row click" data-panel-id="panel:isolation:broken-dependency"><div class="chk-l"><span class="chk-dot warn"></span><div><div class="chk-name">Broken dependencies</div><div class="chk-hint">Approved DNS / printing blocked</div></div></div><div class="chk-val warn">${iso.broken_dep_count} →</div></div>` : ""}
        <div class="chk-row click" data-panel-id="panel:isolation:unknown"><div class="chk-l"><span class="chk-dot ${(iso.unknown_count || 0) ? "warn" : "neutral"}"></span><div><div class="chk-name">Unknown (missing ACL/data)</div><div class="chk-hint">Controller omitted evidence</div></div></div><div class="chk-val ${(iso.unknown_count || 0) ? "warn" : "neutral"}">${iso.unknown_count || 0} →</div></div>
      </div>
    </div>`;
  }

  const sc = vm.service_coverage;
  if (sc && (sc.total_observed_endpoints > 0 || sc.outbound_dependencies > 0)) {
    const byS = sc.by_state || {};

    const tlsUnk = byS["tls-unknown-app"] || 0;
    const cand = byS["candidate-port"] || 0;
    html += `<div class="card" style="margin-top:16px">
      <div class="card-hd">

        <button class="btn sm ghost" data-panel-id="panel:coverage">Details →</button>

      <div class="checklist">
        <div class="chk-row click" data-panel-id="panel:coverage"><div class="chk-l"><span class="chk-dot ok"></span><div><div class="chk-name">Identified services</div><div class="chk-hint">Protocol verified on the wire</div></div></div><div class="chk-val ok">${identified}</div></div>
        <div class="chk-row click" data-panel-id="panel:coverage"><div class="chk-l"><span class="chk-dot neutral"></span><div><div class="chk-name">Encrypted / unidentified</div><div class="chk-hint">TLS-only or open port without app proof</div></div></div><div class="chk-val neutral">${tlsUnk + cand}</div></div>
        ${sc.outbound_dependencies ? `<div class="chk-row click" data-panel-id="panel:coverage"><div class="chk-l"><span class="chk-dot blue"></span><div><div class="chk-name">External internet links</div><div class="chk-hint">Tracked separately from local services</div></div></div><div class="chk-val blue">${sc.outbound_dependencies}</div></div>` : ""}

  html += `</div></div>`;
  patchContainerHTML(document.getElementById("view-checkup"), html);
}

function renderHWCard(vm, row) {
  const depthCls = row.depth === 1 ? " d1" : (row.depth >= 2 ? " d2" : "");
  const portIDs = row.port_ids || [];
  const rjPorts = [];
  const sfpPorts = [];
  const riskPorts = [];

  for (const pid of portIDs) {
    const pe = vm.entities[pid];
    if (!pe) continue;
    if (pe.state === "exposed" || pe.state === "review") riskPorts.push(pe);
    if (row.sfp_start_idx && pe.port_idx >= row.sfp_start_idx) sfpPorts.push(pe);
    else rjPorts.push(pe);
  }

  const sockMatches = (pe) => {
    if (portFilter === "all") return true;
    if (portFilter === "risk") return pe.state === "exposed" || pe.state === "review";
    if (portFilter === "external") return pe.port_zone === "external" || pe.port_zone === "external_uplink" || row.side === "outside";
    return true;
  };

  const renderSock = (pe) => {
    const linkCls = pe.port_state === "active" ? "up" : (pe.port_state === "disabled" ? "off" : "open");
    const trunkCls = pe.tagged_policy === "all" && pe.port_state !== "disabled" ? " trunk" : "";
    const vCls = pe.state === "exposed" ? (" " + humanStateTone(pe)) : (pe.state === "review" ? " warn" : "");
    const sel = currentDrawerID() === pe.id ? " sel" : "";
    const dim = !sockMatches(pe) ? " dim" : "";
    const meta = pe.port_state === "active"
      ? (pe.poe_enabled && pe.poe_power ? "⚡" + pe.poe_power + "W" : fmtSpeed(pe.speed))
      : (pe.port_state === "disabled" ? "off" : "-");
    const peers = peerNamesForPort(vm, pe);
    const who = peers.length ? peers.join(", ") : (pe.port_state === "disabled" ? "Turned off" : "Empty socket");
    const tip = `Socket #${pe.port_idx} · ${who}${pe.native_vlan ? " · Network: " + pe.native_vlan : ""}${pe.state !== "ok" ? " · Needs attention" : ""}`;
    return `<div class="sock ${linkCls}${trunkCls}${vCls}${sel}${dim}" title="${esc(tip)}" data-stop-entity-id="${esc(pe.id)}">
      <span class="sn">#${pe.port_idx}</span>
      <span class="sm">${esc(meta)}</span>
      ${pe.native_vlan ? `<span class="ubar" style="background:${vlanColor(pe.native_vlan)}"></span>` : ""}
    </div>`;
  };

  let fpHTML = "";
  if (portIDs.length) {
    fpHTML = `<div class="fp-wrap">
      <div class="fp-bank ${rjPorts.length <= 8 ? "single" : ""}">${rjPorts.map(renderSock).join("")}</div>
      ${sfpPorts.length ? `<div class="fp-sep" title="Fiber (SFP) sockets"></div><div class="fp-bank ${sfpPorts.length <= 2 ? "single" : ""}">${sfpPorts.map(renderSock).join("")}</div>` : ""}
    </div>`;
  } else {
    fpHTML = `<div class="fp-wrap" style="color:var(--muted);font-size:13px">${ICONS.wifi} <span>${row.client_count || 0} wireless device${row.client_count === 1 ? "" : "s"} connected${(row.ssids && row.ssids.length) ? " · Wi-Fi: " + esc(row.ssids.join(", ")) : ""}</span></div>`;
  }

  return `<div class="hw-card${depthCls}">
    <div class="hw-hd" data-entity-id="${esc(row.device_id)}">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <strong style="font-size:15px">${esc(row.name)}</strong>
        <span class="small">${esc(row.model)}</span>
        ${row.upgradable ? `<span class="tag warn">Update available</span>` : ""}
        ${riskPorts.length
          ? `<span class="tag ${riskPorts.some(p => p.max_severity === "critical") ? "crit" : "warn"}">${riskPorts.length} socket${riskPorts.length === 1 ? "" : "s"} to check</span>`
          : (portIDs.length ? `<span class="tag neutral">Sockets OK</span>` : "")}
      </div>
      <div>
        ${row.parent_label
          ? `<span class="tag click" data-stop-entity-id="${esc(row.parent_port_id || row.parent_id)}">↳ Plugged into ${esc(row.parent_label)}</span>`
          : `<span class="tag neutral">Main Router</span>`}
      </div>
    </div>
    ${fpHTML}
    ${riskPorts.length ? `<div class="hw-foot">
      <span class="small" style="font-weight:700">Check these sockets:</span>
      ${riskPorts.slice(0, 6).map(p => {
        const peers = peerNamesForPort(vm, p);
        const lbl = peers.length ? `#${p.port_idx} (${peers[0]})` : `#${p.port_idx} (empty)`;
        return `<span class="tag click ${p.state === "exposed" ? humanStateTone(p) : "warn"}" data-entity-id="${esc(p.id)}">${esc(lbl)}</span>`;
      }).join("")}
      ${riskPorts.length > 6 ? `<span class="small">+${riskPorts.length - 6} more</span>` : ""}
    </div>` : ""}
  </div>`;
}
