<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniBlue — UniFi Security Console</title>
<style>
  /* ==========================================================================
     COLOUR LAW: Warm hues (red/amber) encode ONLY evidenced violations/reviews.
     Location, VLAN, role, and healthy state use neutral cool tones, shape,
     containment, and texture — never a wall of green or red.
     ========================================================================== */
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #edf2f7;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-2: #334155;
    --muted: #64748b;
    --accent: #1d4ed8;
    --accent-bg: #eff6ff;
    --accent-bd: #bfdbfe;

    /* Verdict palette (warm ONLY for evidenced issues) */
    --exp: #b91c1c;
    --exp-bg: #fef2f2;
    --exp-bd: #f87171;
    --exp-solid: #dc2626;
    --rev: #b45309;
    --rev-bg: #fffbeb;
    --rev-bd: #fbbf24;
    --rev-solid: #d97706;
    --unk: #475569;
    --unk-bg: #f1f5f9;
    --unk-bd: #94a3b8;

    /* Physical port neutral link states */
    --port-up-bg: #e2e8f0;
    --port-up-bd: #94a3b8;
    --port-up-fg: #1e293b;
    --port-open-bg: #ffffff;
    --port-open-bd: #cbd5e1;
    --port-off-bg: #f1f5f9;

    /* Cool VLAN accents (subtle underbars only) */
    --vlan-0: #3b82f6;
    --vlan-1: #6366f1;
    --vlan-2: #0d9488;
    --vlan-3: #0284c7;
    --vlan-4: #64748b;

    --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .03);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080e1a;
      --surface: #0f172a;
      --surface-2: #151f33;
      --surface-3: #1e293b;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-bg: rgba(59, 130, 246, .14);
      --accent-bd: rgba(96, 165, 250, .35);

      --exp: #fca5a5;
      --exp-bg: rgba(185, 28, 28, .26);
      --exp-bd: rgba(248, 113, 113, .55);
      --exp-solid: #ef4444;
      --rev: #fcd34d;
      --rev-bg: rgba(180, 83, 9, .26);
      --rev-bd: rgba(251, 191, 36, .48);
      --rev-solid: #f59e0b;
      --unk: #94a3b8;
      --unk-bg: rgba(148, 163, 184, .12);
      --unk-bd: #475569;

      --port-up-bg: #1e293b;
      --port-up-bd: #475569;
      --port-up-fg: #e2e8f0;
      --port-open-bg: #0f172a;
      --port-open-bd: #334155;
      --port-off-bg: #0b1220;

      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; }
  .muted { color: var(--muted); }
  .sub { font-size: 11.5px; color: var(--muted); }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 0 20px; min-height: 54px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30; flex-wrap: wrap;
  }
  .hdr-l { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .brand img { height: 28px; display: block; }
  .nav { display: flex; gap: 2px; }
  .nav-btn {
    appearance: none; background: none; border: 0; border-bottom: 2.5px solid transparent;
    padding: 16px 12px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .hdr-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
    border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
  }
  .pill.scanning { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-bd); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .pill.scanning .dot { animation: pulse 1.1s infinite; }

  .btn {
    appearance: none; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); padding: 5px 11px; border-radius: 7px; font-size: 12px;
    font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .92; color: #fff; }
  .btn.sm { padding: 3px 8px; font-size: 11.5px; border-radius: 6px; }

  /* Verdict Badges (ONLY warm for exposed/review; neutral for ok/unknown) */
  .vbadge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .3px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  }
  .vbadge.v-exposed { color: var(--exp); background: var(--exp-bg); border-color: var(--exp-bd); }
  .vbadge.v-review { color: var(--rev); background: var(--rev-bg); border-color: var(--rev-bd); }
  .vbadge.v-unknown { color: var(--unk); background: var(--unk-bg); border-color: var(--unk-bd); border-style: dashed; }
  .vbadge.v-ok { color: var(--text-2); background: var(--surface-2); border-color: var(--border); }

  /* Numbered Pin Circle */
  .pin {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    font-size: 10.5px; font-weight: 800; line-height: 1; flex-shrink: 0;
    background: var(--exp-solid); color: #fff;
  }
  .pin.p-high { background: var(--rev-solid); }
  .pin.p-med { background: var(--accent); }

  /* OOB BMC Hexagon Badge */
  .oob-hex {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 800; letter-spacing: .4px; padding: 2px 7px;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
    background: var(--surface-3); color: var(--text);
  }
  .oob-hex.v-exposed { background: var(--exp-solid); color: #fff; }
  .oob-hex.v-review { background: var(--rev-solid); color: #fff; }

  /* Headline & Census Strip */
  .headline-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; flex-direction: column; gap: 8px;
  }
  .headline-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .headline-text {
    font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 9px; flex: 1; min-width: 240px;
  }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .census-bar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .cfilter {
    appearance: none; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-2); padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .cfilter:hover { border-color: var(--accent); }
  .cfilter.active { background: var(--accent-bg); border-color: var(--accent-bd); color: var(--accent); }
  .cfilter.has-warn { border-color: var(--exp-bd); color: var(--exp); background: var(--exp-bg); }
  .cfilter.has-warn.active { outline: 2px solid var(--exp-solid); outline-offset: 1px; }
  .cfilter.has-rev { border-color: var(--rev-bd); color: var(--rev); background: var(--rev-bg); }

  /* Main Workspace + Docked Non-Modal Rail */
  .shell {
    flex: 1; width: 100%; max-width: 1840px; margin: 0 auto; padding: 16px 20px 32px;
  }
  .view { display: none; }
  .view.active { display: block; }

  .map-workspace {
    display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start;
  }
  @media (max-width: 1080px) {
    .map-workspace { grid-template-columns: 1fr; }
  }

  /* Gateway Hinge (top of Map) */
  .gw-hinge {
    background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: var(--radius);
    padding: 12px 15px; margin-bottom: 14px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    cursor: pointer; transition: border-color .12s;
  }
  .gw-hinge:hover, .gw-hinge.sel { border-color: var(--accent); }
  .gw-hinge.sel { box-shadow: 0 0 0 2px var(--accent-bg); }
  .gw-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ctrl-chip {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .ctrl-chip.v-exposed { border-color: var(--exp-bd); background: var(--exp-bg); color: var(--exp); }
  .ctrl-chip.v-review { border-color: var(--rev-bd); background: var(--rev-bg); color: var(--rev); }

  /* Two Synchronized Lenses (Side-by-side >= 1180px, stacked below) */
  .lenses {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; align-items: start;
  }
  @media (max-width: 1280px) {
    .lenses { grid-template-columns: 1fr; }
  }
  .lens-col {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .lens-hd {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    font-weight: 800; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-2);
  }
  .lens-body { padding: 12px 14px; }

  /* ==========================================================================
     LOGICAL ZONES LENS (Left)
     ========================================================================== */
  .wan-strip {
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 11px;
    margin-bottom: 12px; background: var(--surface-2);
  }
  .wan-flows { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .flow-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px;
    font-size: 11.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  }
  .flow-chip:hover { border-color: var(--accent); }
  .flow-chip.v-exposed { border-color: var(--exp-bd); background: var(--exp-bg); color: var(--exp); }
  .flow-chip.v-review { border-color: var(--rev-bd); background: var(--rev-bg); color: var(--rev); }
  .flow-chip.sel { outline: 2px solid var(--accent); outline-offset: 1px; }

  .vlan-lane {
    border: 1px solid var(--border); border-radius: 9px; margin-bottom: 10px;
    overflow: hidden; background: var(--surface);
  }
  .vlan-lane.empty-iso { border-style: dashed; background: var(--surface-2); }
  .lane-hd {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    border-left: 4px solid var(--vlan-0); flex-wrap: wrap;
  }
  .lane-body { padding: 9px 12px; display: flex; flex-direction: column; gap: 8px; }

  .oob-row {
    padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--surface-2); display: flex; flex-direction: column; gap: 6px;
  }
  .oob-row-lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

  .host-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .hchip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; font-size: 12px; transition: all .12s; max-width: 100%;
  }
  .hchip:hover { border-color: var(--accent); }
  .hchip.v-exposed { border-color: var(--exp-bd); background: var(--exp-bg); }
  .hchip.v-review { border-color: var(--rev-bd); background: var(--rev-bg); }
  .hchip.v-unknown { border-style: dashed; border-color: var(--unk-bd); background: var(--unk-bg); color: var(--muted); }
  .hchip.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hchip.dim { opacity: .24; }
  .hchip-meta { font-size: 10.5px; color: var(--muted); }
  .wall-notch { font-size: 10px; padding: 1px 4px; border-radius: 3px; background: var(--surface-3); color: var(--text-2); font-weight: 700; }

  /* Quiet Dot Grid for Issue-Free Assessed Hosts */
  .dot-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 2px; }
  .dot-grid { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .hdot {
    width: 11px; height: 11px; border-radius: 3px; cursor: pointer;
    background: var(--port-up-bg); border: 1px solid var(--port-up-bd);
    transition: transform .1s, border-color .1s;
  }
  .hdot.unk { background: transparent; border-style: dashed; border-color: var(--unk-bd); }
  .hdot:hover { transform: scale(1.25); border-color: var(--accent); }
  .hdot.sel { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }
  .hdot.dim { opacity: .2; }

  /* ==========================================================================
     PHYSICAL BLUEPRINT LENS (Right)
     ========================================================================== */
  .bldg-zone {
    border: 1px solid var(--border-strong); border-radius: 9px; padding: 10px 12px;
    background: var(--surface-2);
  }
  .bldg-zone.outside {
    border-style: dashed; background: var(--surface);
  }
  .bldg-lbl {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .55px;
    color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
  }

  /* Hatched Perimeter Wall + Wall Gates */
  .wall-band {
    margin: 12px 0; padding: 9px 11px; border-radius: 8px;
    border-top: 2px solid var(--border-strong); border-bottom: 2px solid var(--border-strong);
    background: repeating-linear-gradient(
      -45deg,
      var(--surface-2),
      var(--surface-2) 6px,
      var(--surface-3) 6px,
      var(--surface-3) 12px
    );
  }
  .wall-hdr {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px;
    color: var(--text-2); margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center;
  }
  .gates-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .gate {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px;
    background: var(--surface); border: 1.5px solid var(--border-strong); color: var(--text);
    font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .gate.inferred { border-style: dashed; }
  .gate.v-exposed { border-color: var(--exp-bd); background: var(--exp-bg); color: var(--exp); }
  .gate.v-review { border-color: var(--rev-bd); background: var(--rev-bg); color: var(--rev); }
  .gate.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .gate.dim { opacity: .24; }

  /* LLDP Rack Rows & True Alternating 2-Row Switch Faceplates */
  .rack-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 9px; overflow: hidden;
  }
  .rack-row:last-child { margin-bottom: 0; }
  .rack-row.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
  .rack-row.depth-1 { margin-left: 14px; }
  .rack-row.depth-2 { margin-left: 28px; }
  .rack-hd {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    cursor: pointer; flex-wrap: wrap;
  }
  .rack-hd:hover { background: var(--surface-3); }
  .rack-title { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .trunk-tag {
    font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    cursor: pointer;
  }
  .trunk-tag:hover { border-color: var(--accent); color: var(--accent); }

  /* True Switch Faceplate: Fixed alternating odd (top) / even (bottom) sockets + SFP gap */
  .faceplate-wrap {
    padding: 9px 10px; display: flex; align-items: center; gap: 10px; overflow-x: auto;
  }
  .fp-bank {
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 26px); gap: 4px;
  }
  .fp-bank.single-row { grid-template-rows: 26px; }
  .fp-sfp-sep { width: 2px; height: 48px; background: var(--border-strong); border-radius: 2px; flex-shrink: 0; }
  .sock {
    width: 32px; height: 26px; border-radius: 4px; position: relative;
    border: 1.5px solid var(--port-open-bd); background: var(--port-open-bg);
    color: var(--muted); font-size: 10.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; transition: transform .08s;
  }
  .sock:hover { transform: translateY(-1px); border-color: var(--accent); z-index: 2; }
  .sock.up { background: var(--port-up-bg); border-color: var(--port-up-bd); color: var(--port-up-fg); }
  .sock.open { border-style: dashed; }
  .sock.off { background: var(--port-off-bg); border-color: var(--border); opacity: .4; }
  .sock.trunk {
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 3px, rgba(100, 116, 139, .18) 3px, rgba(100, 116, 139, .18) 6px
    );
  }
  .sock.v-exposed {
    background-color: var(--exp-bg); border-color: var(--exp-bd); color: var(--exp); opacity: 1;
  }
  .sock.v-review {
    background-color: var(--rev-bg); border-color: var(--rev-bd); color: var(--rev); opacity: 1;
  }
  .sock.sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 4; }
  .sock.dim { opacity: .2 !important; }
  .sock .ubar {
    position: absolute; left: 2px; right: 2px; bottom: 1px; height: 2.5px; border-radius: 1px;
  }
  .sock .poe-dot {
    position: absolute; top: 1px; right: 2px; font-size: 8px; line-height: 1; opacity: .85;
  }
  .sock .spin {
    position: absolute; top: -6px; left: -5px; min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 999px; background: var(--exp-solid); color: #fff; font-size: 9px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .sock.v-review .spin { background: var(--rev-solid); }

  /* ==========================================================================
     DOCKED NON-MODAL RIGHT RAIL (Queue <-> Inspector Stack)
     ========================================================================== */
  .rail {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); position: sticky; top: 68px; max-height: calc(100vh - 86px);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .rail-hd {
    padding: 11px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
  }
  .rail-body { padding: 12px 14px; overflow-y: auto; flex: 1; }
  .q-item {
    display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    cursor: pointer; background: var(--surface); transition: border-color .1s, background .1s;
  }
  .q-item:hover { border-color: var(--accent); background: var(--surface-2); }
  .q-item.sel { border-color: var(--accent); background: var(--accent-bg); }
  .q-text { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .q-cat { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin-top: 2px; }

  .ins-sec { margin-bottom: 15px; }
  .ins-sec-t {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin-bottom: 7px;
  }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .kv { padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); }
  .kv .k { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .kv .v { font-size: 12px; font-weight: 600; margin-top: 2px; word-break: break-word; }

  .reason-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px;
    background: var(--surface-2);
  }
  .reason-card.v-exposed { border-color: var(--exp-bd); background: var(--exp-bg); }
  .reason-card.v-review { border-color: var(--rev-bd); background: var(--rev-bg); }
  .ea-pair {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;
    padding: 6px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border);
    font-size: 11px;
  }
  .ea-pair b { display: block; font-size: 9.5px; text-transform: uppercase; color: var(--muted); }

  /* Inventory & Activity Tables */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 12px;
  }
  .search {
    padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 7px;
    background: var(--surface-2); color: var(--text); font-size: 12.5px; width: 260px; max-width: 100%;
  }
  .tbl-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow-x: auto; box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th {
    text-align: left; padding: 8px 12px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .4px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }

  /* Footer */
  footer {
    margin-top: auto; padding: 12px 20px; border-top: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-size: 11.5px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer a { color: var(--text-2); text-decoration: none; font-weight: 600; }
  footer a:hover { color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="hdr-l">
    <div class="brand">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/assets/logo-dark.svg">
        <img src="/assets/logo-light.svg" alt="UniBlue">
      </picture>
    </div>
    <nav class="nav" role="tablist">
      <button class="nav-btn active" data-tab="map">Map</button>
      <button class="nav-btn" data-tab="inventory">Inventory</button>
      <button class="nav-btn" data-tab="activity">Activity</button>
    </nav>
  </div>
  <div class="hdr-r">
    <span id="live-pill" class="pill"><span class="dot"></span><span id="mode-lbl">Loading…</span></span>
    <span id="site-pill" class="pill">Site: -</span>
    <span id="updated-pill" class="pill">Updated: -</span>
    <button id="rescan-btn" class="btn primary" onclick="triggerRescan()">Rescan</button>
  </div>
</header>

<div id="headline-bar" class="headline-bar"></div>

<div class="shell">
  <section id="view-map" class="view active"></section>
  <section id="view-inventory" class="view"></section>
  <section id="view-activity" class="view"></section>
</div>

<footer id="app-footer">
  <span><strong>UniBlue</strong> · Blue-team security engine for UniFi networks</span>
  <span>© 2026 Péter Szilágyi · <a href="https://github.com/karalabe/uniblue/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">BSD-3-Clause</a> · <a href="https://github.com/karalabe/uniblue" target="_blank" rel="noopener noreferrer">github.com/karalabe/uniblue</a></span>
</footer>

<script>
let state = null;
let isStaticMode = false;
let activeTab = "map";
let activeFilter = "all"; // "all"|"exposed"|"bmc"|"cve"|"wall"|"unassessed"|"review"|"outside"|"devices"
let invSearch = "";
let actFilter = "all";
let queueIdx = 0;
let railStack = []; // stack of entity IDs; empty = Fix-Next queue
let hoverIDs = new Set();

const vlanColorCache = {};
const vlanPalette = ["var(--vlan-0)", "var(--vlan-1)", "var(--vlan-2)", "var(--vlan-3)", "var(--vlan-4)"];
function vlanColor(name) {
  if (!name) return "var(--border-strong)";
  const k = name.toLowerCase();
  if (!vlanColorCache[k]) {
    let h = 0;
    for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
    vlanColorCache[k] = vlanPalette[h % vlanPalette.length];
  }
  return vlanColorCache[k];
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function fmtTime(iso) {
  if (!iso || String(iso).startsWith("0001-")) return "-";
  return new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
}

function fmtSpeed(sp) {
  if (!sp) return "";
  return sp >= 1000 ? (sp / 1000) + "G" : sp + "M";
}

function pinClass(sev) {
  const s = (sev || "").toLowerCase();
  if (s === "critical") return "";
  if (s === "high") return "p-high";
  return "p-med";
}

function vBadge(st, label) {
  const s = (st || "ok").toLowerCase();
  return `<span class="vbadge v-${esc(s)}">${esc(label || s)}</span>`;
}

function currentSelectedID() {
  return railStack.length ? railStack[railStack.length - 1] : null;
}

function switchTab(tab, pushHash = true) {
  activeTab = tab;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
  if (pushHash) syncHash();
  renderAll();
}

function setFilter(f) {
  activeFilter = (activeFilter === f) ? "all" : f;
  renderAll();
}

function selectEntity(id, switchToMap = false) {
  if (!id || !state?.view?.entities?.[id]) return;
  if (switchToMap && activeTab !== "map") {
    activeTab = "map";
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === "map"));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-map"));
  }
  if (currentSelectedID() !== id) {
    railStack.push(id);
  }
  syncHash();
  renderAll();
}

function popInspector() {
  if (railStack.length) {
    railStack.pop();
    syncHash();
    renderAll();
  }
}

function clearInspector() {
  railStack = [];
  syncHash();
  renderAll();
}

function stepQueue(delta) {
  const q = state?.view?.queue || [];
  if (!q.length) return;
  queueIdx = (queueIdx + delta + q.length) % q.length;
  selectEntity(q[queueIdx].subject_id, true);
}

function syncHash() {
  const sel = currentSelectedID();
  const next = sel ? ("#/" + activeTab + "/" + encodeURIComponent(sel)) : ("#/" + activeTab);
  if (location.hash !== next) history.replaceState(null, "", next);
}

function applyHash() {
  const h = (location.hash || "").replace(/^#\/?/, "");
  if (!h) return;
  const slash = h.indexOf("/");
  const tab = slash === -1 ? h : h.slice(0, slash);
  const ent = slash === -1 ? "" : decodeURIComponent(h.slice(slash + 1));
  if (tab === "map" || tab === "inventory" || tab === "activity") {
    activeTab = tab;
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
  }
  if (ent && state?.view?.entities?.[ent]) {
    railStack = [ent];
  }
}

window.addEventListener("hashchange", () => { applyHash(); renderAll(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && railStack.length) popInspector(); });
document.querySelectorAll(".nav-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

function matchesFilter(ent) {
  if (!ent || activeFilter === "all") return true;
  if (activeFilter === "exposed") return ent.state === "exposed";
  if (activeFilter === "review") return ent.state === "review";
  if (activeFilter === "bmc") return !!ent.is_bmc;
  if (activeFilter === "cve") return (ent.exact_cve_count || 0) > 0;
  if (activeFilter === "unassessed") return ent.state === "unknown";
  if (activeFilter === "outside") return ent.side === "outside" || ent.port_zone === "external" || ent.port_zone === "external_uplink";
  if (activeFilter === "wall") return ent.port_zone === "external" || ent.port_zone === "external_uplink";
  if (activeFilter === "devices") return ent.kind === "device";
  return true;
}

function isHighlighted(id) {
  if (!id) return false;
  if (currentSelectedID() === id) return true;
  if (hoverIDs.has(id)) return true;
  // Cross-lens highlight: if selected is a host, highlight its port; if port, highlight its peers!
  const sel = currentSelectedID();
  const selEnt = sel ? state?.view?.entities?.[sel] : null;
  if (selEnt) {
    if (selEnt.port_id === id || selEnt.device_id === id || selEnt.network_id === id) return true;
    if ((selEnt.peer_ids || []).includes(id)) return true;
  }
  return false;
}

/* ============================================================================
   RENDER TOP HEADER & HEADLINE / CENSUS BAR
   ============================================================================ */
function renderHeaderAndBar() {
  const vm = state.view || { census: {}, entities: {}, queue: [] };
  const c = vm.census || {};
  const scanning = !!state.scanning;

  const livePill = document.getElementById("live-pill");
  if (isStaticMode) {
    livePill.className = "pill";
    document.getElementById("mode-lbl").textContent = "Offline Snapshot";
    document.getElementById("rescan-btn").style.display = "none";
  } else if (scanning || (c.unassessed_count || 0) > 0) {
    livePill.className = "pill scanning";
    document.getElementById("mode-lbl").textContent = scanning
      ? "Scanning LAN… " + (c.unassessed_count ? c.unassessed_count + " unassessed" : "")
      : (c.unassessed_count + " host(s) unassessed · " + (state.event_mode || "poll"));
  } else {
    livePill.className = "pill";
    document.getElementById("mode-lbl").textContent = "LIVE · " + (state.event_mode || "poll");
  }
  document.getElementById("site-pill").textContent = "Site: " + (state.site || "-");
  document.getElementById("updated-pill").textContent = "Updated: " + fmtTime(state.updated_at);

  // Headline + Stepper + Clickable Census Strip
  const q = vm.queue || [];
  const headline = (scanning && (c.unassessed_count || 0) > 0 && q.length === 0)
    ? `Initial LAN baseline scan in progress — ${c.unassessed_count} host(s) still unassessed.`
    : (vm.headline || "Evaluating network posture…");

  const topSevBadge = q.length > 0
    ? vBadge(q[0].state, q[0].severity)
    : ((c.unassessed_count || 0) > 0 ? vBadge("unknown", "Scanning") : vBadge("ok", "Matches policy"));

  const cf = (key, label, count, cls) =>
    `<button class="cfilter ${count > 0 ? cls : ""} ${activeFilter === key ? "active" : ""}" onclick="setFilter('${key}')">${label}: <strong>${count}</strong></button>`;

  document.getElementById("headline-bar").innerHTML = `
    <div class="headline-top">
      <div class="headline-text">${topSevBadge} <span>${esc(headline)}</span></div>
      ${q.length > 0 ? `<div class="stepper">
        <button class="btn sm" onclick="stepQueue(-1)">‹</button>
        <span class="sub mono">${Math.min(queueIdx + 1, q.length)}/${q.length}</span>
        <button class="btn sm" onclick="stepQueue(1)">›</button>
      </div>` : ""}
    </div>
    <div class="census-bar">
      ${cf("exposed", "Exposed", c.exposed_count || 0, "has-warn")}
      ${cf("wall", "Wall gates open", (c.open_wall_gates || 0) + "/" + (c.total_wall_gates || 0), (c.open_wall_gates || 0) > 0 ? "has-warn" : "")}
      ${cf("bmc", "⬡ BMCs (OOB)", c.bmc_count || 0, (c.bmc_count || 0) > 0 ? "has-rev" : "")}
      ${cf("cve", "Exact-CVE hosts", c.exact_cve_hosts || 0, "has-warn")}
      ${cf("unassessed", "Unassessed", c.unassessed_count || 0, "")}
      ${cf("review", "Review", c.review_count || 0, "has-rev")}
      ${activeFilter !== "all" ? `<button class="btn sm" onclick="setFilter('all')">Clear filter</button>` : ""}
    </div>`;

  // Footer from single Go source
  const foot = document.getElementById("app-footer");
  if (vm.copyright) {
    foot.innerHTML = `
      <span><strong>UniBlue</strong> · Blue-team security engine for UniFi networks</span>
      <span>${esc(vm.copyright)} · <a href="${esc(vm.repo_url)}/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">${esc(vm.license)}</a> · <a href="${esc(vm.repo_url)}" target="_blank" rel="noopener noreferrer">github.com/karalabe/uniblue</a></span>`;
  }
}

/* ============================================================================
   TAB 1: MAP (GATEWAY HINGE + TWO SYNCHRONIZED LENSES + DOCKED RAIL)
   ============================================================================ */
function renderMap() {
  const vm = state.view;
  if (!vm) {
    document.getElementById("view-map").innerHTML = `<div class="tbl-card" style="padding:24px;text-align:center" class="muted">Loading presentation model…</div>`;
    return;
  }

  const gw = vm.gateway_id ? vm.entities[vm.gateway_id] : null;
  const s = state.report?.unifi_posture?.settings || {};
  const h = state.report?.unifi_posture?.health || {};
  const posture = state.report?.unifi_posture || {};

  const ctrlChip = (lbl, val, st) => `<span class="ctrl-chip ${st ? "v-" + st : ""}">${esc(lbl)}: <strong>${esc(val)}</strong></span>`;
  const gwChips = [
    ctrlChip("SSH", s.ssh_enabled ? (s.ssh_password_auth ? "Password" : "Key-only") : "Off", s.ssh_enabled && s.ssh_password_auth ? "exposed" : (s.ssh_enabled ? "review" : "")),
    ctrlChip("UPnP", s.upnp_enabled ? "Enabled" : "Off", s.upnp_enabled ? "exposed" : ""),
    ctrlChip("IDS/IPS", s.ips_mode ? s.ips_mode.toUpperCase() : "-", (s.ips_mode === "disabled" || s.ips_mode === "off") ? "review" : ""),
    ctrlChip("Honeypot", s.honeypot_enabled ? "On (" + (s.honeypot_ips || []).length + ")" : "Off", s.honeypot_enabled ? "" : "review"),
    ctrlChip("DoH", (s.doh_state && s.doh_state !== "off") ? s.doh_state : "Off", ""),
    ctrlChip("Airspace", posture.evil_twin_count ? posture.evil_twin_count + " Evil-Twin" : (posture.neighbor_aps || 0) + " neighbors", posture.evil_twin_count ? "exposed" : ""),
    ctrlChip("VPN", (h.active_vpn_users || 0) + " active", ""),
  ].join("");

  const gwSel = gw && isHighlighted(gw.id) ? " sel" : "";
  const gwHTML = gw ? `
    <div class="gw-hinge${gwSel}" onclick="selectEntity('${esc(gw.id)}')">
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${gw.pin_number ? `<span class="pin ${pinClass(gw.max_severity)}">${gw.pin_number}</span>` : ""}
          <strong style="font-size:14px">${esc(gw.label)}</strong>
          <span class="sub">${esc(gw.model)}</span>
          ${h.wan_ip ? `<span class="pill mono">WAN ${esc(h.wan_ip)}</span>` : ""}
          ${vBadge(gw.state, gw.state_label)}
        </div>
        <div class="sub" style="margin-top:2px">Gateway Hinge · Logical Zones (left) ↔ Physical Blueprint (right)</div>
      </div>
      <div class="gw-chips">${gwChips}</div>
    </div>` : "";

  document.getElementById("view-map").innerHTML = `
    <div class="map-workspace">
      <div>
        ${gwHTML}
        <div class="lenses">
          <div class="lens-col">
            <div class="lens-hd"><span>Logical Zones &amp; Services</span><span class="sub">${(vm.logical || []).length} VLANs</span></div>
            <div class="lens-body">${renderLogicalLens(vm)}</div>
          </div>
          <div class="lens-col">
            <div class="lens-hd"><span>Physical Blueprint &amp; Perimeter</span><span class="sub">${(vm.physical || []).length} UniFi gear</span></div>
            <div class="lens-body">${renderPhysicalLens(vm)}</div>
          </div>
        </div>
      </div>
      <aside class="rail">${renderRail(vm)}</aside>
    </div>`;
}

function renderLogicalLens(vm) {
  let html = "";

  // WAN Ingress Strip
  const flows = vm.wan_flows || [];
  const reviewFlows = flows.filter(f => !f.expected);
  const expP2P = flows.filter(f => f.expected);
  html += `<div class="wan-strip">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span class="sub" style="font-weight:800;text-transform:uppercase;letter-spacing:.4px">WAN Ingress</span>
      <span class="sub">${reviewFlows.length} active rule/forward(s)${expP2P.length ? " · " + expP2P.length + " expected P2P" : ""}</span>
    </div>
    <div class="wan-flows">
      ${reviewFlows.length ? reviewFlows.map(f => {
        const target = f.kind === "firewall" ? f.id : (f.target_id || vm.gateway_id);
        const sel = isHighlighted(target) ? " sel" : "";
        return `<span class="flow-chip v-${esc(f.state)}${sel}" onclick="selectEntity('${esc(target)}')">
          ${f.pin_number ? `<span class="pin ${pinClass(f.severity)}">${f.pin_number}</span>` : ""}
          <strong>${esc(f.rule_name)}</strong> <span class="mono">${esc(f.label)}</span>
        </span>`;
      }).join("") : '<span class="sub">No unexpected inbound WAN exposures.</span>'}
      ${expP2P.map(f => `<span class="flow-chip" title="Expected P2P forward" onclick="selectEntity('${esc(f.target_id || "")}')">${esc(f.rule_name)} <span class="mono">${esc(f.label)}</span></span>`).join("")}
    </div>
  </div>`;

  // VLAN Lanes
  for (const lane of (vm.logical || [])) {
    const isEmptyIso = lane.isolated && lane.total_hosts === 0;
    html += `<div class="vlan-lane ${isEmptyIso ? "empty-iso" : ""}">
      <div class="lane-hd" style="border-left-color:${vlanColor(lane.name)}">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
          <strong>${esc(lane.name)}</strong>
          ${lane.vlan ? `<span class="sub mono">VLAN ${esc(lane.vlan)}</span>` : ""}
          ${lane.subnet ? `<span class="sub mono">${esc(lane.subnet)}</span>` : ""}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="vbadge v-ok">${lane.isolated ? "✓ Isolated" : esc(lane.zone_name)}</span>
          <span class="sub">${lane.total_hosts}</span>
        </div>
      </div>
      <div class="lane-body">`;

    if (lane.total_hosts === 0) {
      html += `<div class="sub">${lane.migration_hint ? "↳ " + esc(lane.migration_hint) : "0 active hosts"}</div>`;
    } else {
      // Dedicated Out-of-Band Management (BMC) row inside its ACTUAL VLAN!
      if (lane.bmc_ids && lane.bmc_ids.length) {
        html += `<div class="oob-row">
          <div class="oob-row-lbl">Out-of-Band Server Management (BMCs on ${esc(lane.name)})</div>
          <div class="host-chips">${lane.bmc_ids.map(id => renderHostChip(vm.entities[id])).join("")}</div>
        </div>`;
      }
      // Pinned Exposed / Review Hosts
      if (lane.pinned_host_ids && lane.pinned_host_ids.length) {
        html += `<div class="host-chips">${lane.pinned_host_ids.map(id => renderHostChip(vm.entities[id])).join("")}</div>`;
      }
      // Quiet Dot Grid for Issue-Free Assessed Hosts
      if (lane.clean_host_ids && lane.clean_host_ids.length) {
        html += `<div class="dot-group">
          <div class="dot-grid">${lane.clean_host_ids.map(id => renderHostDot(vm.entities[id], false)).join("")}</div>
          <span class="sub">${lane.clean_host_ids.length} assessed · no findings</span>
        </div>`;
      }
      // Hollow Dot Grid for Unassessed (Startup / Unscanned) Hosts — NEVER green!
      if (lane.unknown_host_ids && lane.unknown_host_ids.length) {
        html += `<div class="dot-group">
          <div class="dot-grid">${lane.unknown_host_ids.map(id => renderHostDot(vm.entities[id], true)).join("")}</div>
          <span class="sub">${lane.unknown_host_ids.length} unassessed</span>
        </div>`;
      }
    }
    html += `</div></div>`;
  }

  // Compact Wi-Fi SSIDs list
  const wlans = state.report?.unifi_posture?.wlans || [];
  if (wlans.length) {
    html += `<div class="wan-strip" style="margin-top:4px;margin-bottom:0">
      <div class="sub" style="font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">Wi-Fi Broadcasts (${wlans.length})</div>
      <div class="wan-flows">
        ${wlans.map(w => `<span class="ctrl-chip">${esc(w.name)} → <strong>${esc(w.network_name || "-")}</strong> · <span class="mono">${esc((w.wpa3_support ? "WPA3" : (w.wpa_mode || w.security || "-")).toUpperCase())}</span>${w.l2_isolation ? " · L2-iso" : ""}</span>`).join("")}
      </div>
    </div>`;
  }

  return html;
}

function renderHostChip(ent) {
  if (!ent) return "";
  const sel = isHighlighted(ent.id) ? " sel" : "";
  const dim = !matchesFilter(ent) ? " dim" : "";
  const svcChips = (ent.services || []).filter(s => s.exposed || s.reachable === "wan").slice(0, 3)
    .map(s => `<span class="hchip-meta mono">${esc(s.label || (":" + s.port))}</span>`).join(" · ");
  const cveTxt = ent.exact_cve_count ? `<span class="hchip-meta mono">${ent.exact_cve_count} exact CVE</span>` : "";
  const meta = [svcChips, cveTxt].filter(Boolean).join(" · ");
  return `<div class="hchip v-${esc(ent.state)}${sel}${dim}" onclick="selectEntity('${esc(ent.id)}')">
    ${ent.pin_number ? `<span class="pin ${pinClass(ent.max_severity)}">${ent.pin_number}</span>` : ""}
    ${ent.is_bmc ? `<span class="oob-hex v-${esc(ent.state)}">OOB</span>` : ""}
    <strong>${esc(ent.label)}</strong>
    ${ent.side === "outside" ? `<span class="wall-notch" title="Physically outside building">OUT</span>` : ""}
    ${meta ? `<span class="hchip-meta">${meta}</span>` : ""}
  </div>`;
}

function renderHostDot(ent, isUnknown) {
  if (!ent) return "";
  const sel = isHighlighted(ent.id) ? " sel" : "";
  const dim = !matchesFilter(ent) ? " dim" : "";
  const tip = `${ent.label} (${ent.ip}) · ${ent.state_label}`;
  return `<span class="hdot ${isUnknown ? "unk" : ""}${sel}${dim}" title="${esc(tip)}" onclick="selectEntity('${esc(ent.id)}')"></span>`;
}

function renderPhysicalLens(vm) {
  const rows = vm.physical || [];
  const inside = rows.filter(r => r.side !== "outside" && !r.uplink_unknown);
  const unknownRows = rows.filter(r => r.side !== "outside" && r.uplink_unknown);
  const outside = rows.filter(r => r.side === "outside");
  const gates = vm.wall_gates || [];

  let html = `<div class="bldg-zone">
    <div class="bldg-lbl"><span>Inside Secured Building</span><span class="sub">Odd ports top · Even bottom · Hatch = Trunk All</span></div>
    ${inside.map(r => renderPhysicalRow(vm, r)).join("")}
    ${unknownRows.length ? `<div class="bldg-lbl" style="margin-top:10px"><span>Uplink Unknown</span></div>${unknownRows.map(r => renderPhysicalRow(vm, r)).join("")}` : ""}
  </div>`;

  // Hatched Perimeter Wall Band with explicit Wall Gates
  if (gates.length || outside.length) {
    const openN = gates.filter(g => g.state === "exposed" || g.state === "review").length;
    html += `<div class="wall-band">
      <div class="wall-hdr">
        <span>Building Perimeter Wall · ${gates.length} Gate${gates.length === 1 ? "" : "s"} (${openN} Open)</span>
        <span class="sub">Dashed = inferred by name</span>
      </div>
      <div class="gates-row">
        ${gates.map(g => {
          const pe = vm.entities[g.port_id];
          const sel = isHighlighted(g.port_id) ? " sel" : "";
          const dim = pe && !matchesFilter(pe) ? " dim" : "";
          return `<span class="gate v-${esc(g.state)} ${g.inferred ? "inferred" : ""}${sel}${dim}" onclick="selectEntity('${esc(g.port_id)}')">
            ${g.pin_number ? `<span class="pin ${pinClass(pe?.max_severity)}">${g.pin_number}</span>` : ""}
            <strong>${esc(g.switch_name)} #${g.port_idx}</strong> → ${esc(g.target_name)}
            <span class="sub mono">(${esc(g.inline_fact)})</span>
          </span>`;
        }).join("")}
      </div>
    </div>`;

    // Outside Perimeter Container (neutral dashed frame — NEVER red unless failing!)
    html += `<div class="bldg-zone outside">
      <div class="bldg-lbl"><span>Outside Building Perimeter</span><span class="sub">${outside.length} switch/AP · ${gates.filter(g => g.kind === "drop").length} exterior drop(s)</span></div>
      ${outside.map(r => renderPhysicalRow(vm, r)).join("")}
    </div>`;
  }

  return html;
}

function renderPhysicalRow(vm, row) {
  const devEnt = vm.entities[row.device_id];
  const sel = isHighlighted(row.device_id) ? " sel" : "";
  const depthCls = row.depth === 1 ? " depth-1" : (row.depth >= 2 ? " depth-2" : "");

  const portIDs = row.port_ids || [];
  let faceplateHTML = "";
  if (portIDs.length) {
    const rjPorts = [];
    const sfpPorts = [];
    for (const pid of portIDs) {
      const pe = vm.entities[pid];
      if (!pe) continue;
      if (row.sfp_start_idx && pe.port_idx >= row.sfp_start_idx) sfpPorts.push(pe);
      else rjPorts.push(pe);
    }
    const singleRow = rjPorts.length <= 8;
    faceplateHTML = `<div class="faceplate-wrap">
      <div class="fp-bank ${singleRow ? "single-row" : ""}">${rjPorts.map(renderSocket).join("")}</div>
      ${sfpPorts.length ? `<div class="fp-sfp-sep" title="SFP/SFP+ bank"></div><div class="fp-bank ${sfpPorts.length <= 2 ? "single-row" : ""}">${sfpPorts.map(renderSocket).join("")}</div>` : ""}
    </div>`;
  } else {
    faceplateHTML = `<div class="faceplate-wrap"><span class="sub">${row.client_count || 0} Wi-Fi client(s)${(row.ssids && row.ssids.length) ? " · " + esc(row.ssids.join(", ")) : ""}</span></div>`;
  }

  return `<div class="rack-row${depthCls}${sel}">
    <div class="rack-hd" onclick="selectEntity('${esc(row.device_id)}')">
      <div class="rack-title">
        ${devEnt?.pin_number ? `<span class="pin ${pinClass(devEnt.max_severity)}">${devEnt.pin_number}</span>` : ""}
        <span>${esc(row.name)}</span>
        <span class="sub">${esc(row.model)}</span>
        ${row.upgradable ? `<span class="vbadge v-review">FW update</span>` : ""}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${row.parent_label ? `<span class="trunk-tag" onclick="event.stopPropagation(); selectEntity('${esc(row.parent_port_id || row.parent_id)}')">↑ ${esc(row.parent_label)}</span>` : ""}
        <span class="sub mono">${esc(row.ip)}</span>
      </div>
    </div>
    ${faceplateHTML}
  </div>`;
}

function renderSocket(pe) {
  if (!pe) return "";
  const linkCls = pe.port_state === "active" ? "up" : (pe.port_state === "disabled" ? "off" : "open");
  const trunkCls = pe.tagged_policy === "all" && pe.port_state !== "disabled" ? " trunk" : "";
  const verdictCls = pe.state === "exposed" ? " v-exposed" : (pe.state === "review" ? " v-review" : "");
  const sel = isHighlighted(pe.id) ? " sel" : "";
  const dim = !matchesFilter(pe) ? " dim" : "";
  const tip = `${pe.label} · ${pe.port_state} ${fmtSpeed(pe.speed)} · Zone: ${pe.port_zone} · VLAN: ${pe.native_vlan || "-"} (${pe.tagged_policy}) · ${pe.state_label}`;
  return `<div class="sock ${linkCls}${trunkCls}${verdictCls}${sel}${dim}" title="${esc(tip)}" onclick="event.stopPropagation(); selectEntity('${esc(pe.id)}')">
    ${pe.pin_number ? `<span class="spin">${pe.pin_number}</span>` : ""}
    ${pe.poe_enabled ? `<span class="poe-dot">⚡</span>` : ""}
    <span>${pe.port_idx}</span>
    ${pe.native_vlan ? `<span class="ubar" style="background:${vlanColor(pe.native_vlan)}"></span>` : ""}
  </div>`;
}

/* ============================================================================
   DOCKED NON-MODAL RIGHT RAIL (FIX-NEXT QUEUE <-> STACK INSPECTOR)
   ============================================================================ */
function renderRail(vm) {
  const selID = currentSelectedID();
  if (!selID || !vm.entities[selID]) {
    const q = vm.queue || [];
    return `
      <div class="rail-hd">
        <strong>Fix Next (${q.length})</strong>
        <span class="sub">Ranked by impact</span>
      </div>
      <div class="rail-body">
        ${q.length ? q.map((item, i) => `
          <div class="q-item" onclick="queueIdx=${i}; selectEntity('${esc(item.subject_id)}')">
            <span class="pin ${pinClass(item.severity)}">${item.pin}</span>
            <div style="flex:1;min-width:0">
              <div class="q-text">${esc(item.sentence)}</div>
              <div class="q-cat">${esc(item.category)} · ${esc(item.severity)}</div>
            </div>
          </div>`).join("") : `<div class="sub" style="text-align:center;padding:24px 8px">No prioritized issues in queue. Click any device, port, or host on the map to inspect.</div>`}
      </div>`;
  }

  const ent = vm.entities[selID];
  const backLbl = railStack.length > 1 ? "← Back" : "← Queue";
  let body = "";

  // Header summary
  body += `<div class="ins-sec">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      ${ent.pin_number ? `<span class="pin ${pinClass(ent.max_severity)}">${ent.pin_number}</span>` : ""}
      ${ent.is_bmc ? `<span class="oob-hex v-${esc(ent.state)}">OOB BMC</span>` : ""}
      ${vBadge(ent.state, ent.state_label + (ent.exact_cve_count ? " · " + ent.exact_cve_count + " exact CVE" : ""))}
      ${ent.side === "outside" ? `<span class="vbadge v-ok">Outside (${esc(ent.zone_source || "auto")})</span>` : ""}
    </div>
    <div style="font-size:15px;font-weight:800">${esc(ent.label)}</div>
    <div class="sub mono">${[ent.ip, ent.mac, ent.network_name].filter(Boolean).map(esc).join(" · ")}</div>
  </div>`;

  // Cross-links & telemetry grid
  body += `<div class="ins-sec"><div class="ins-sec-t">Telemetry &amp; Cross-References</div><div class="kv-grid">`;
  if (ent.kind === "port") {
    body += `<div class="kv"><div class="k">Link</div><div class="v">${esc(ent.port_state)} ${fmtSpeed(ent.speed)}</div></div>
      <div class="kv"><div class="k">Native VLAN</div><div class="v">${esc(ent.native_vlan || "-")}</div></div>
      <div class="kv"><div class="k">Tagged Policy</div><div class="v mono">${esc(ent.tagged_policy || "-")}</div></div>
      <div class="kv"><div class="k">MAC Security</div><div class="v">${ent.port_security ? "Enabled" : "Off"} (${ent.mac_table_count || 0} MACs)</div></div>
      <div class="kv"><div class="k">PoE Power</div><div class="v mono">${ent.poe_enabled ? "⚡ " + esc(ent.poe_power || "ON") + "W" : "Off"}</div></div>
      <div class="kv"><div class="k">STP State</div><div class="v mono">${esc(ent.stp_state || "-")}</div></div>`;
  } else if (ent.kind === "host") {
    const portEnt = ent.port_id ? vm.entities[ent.port_id] : null;
    const apEnt = ent.ap_id ? vm.entities[ent.ap_id] : null;
    body += `<div class="kv"><div class="k">Role / Vendor</div><div class="v">${esc(ent.role || "unknown")}${ent.vendor ? " · " + esc(ent.vendor) : ""}</div></div>
      <div class="kv"><div class="k">Coverage</div><div class="v">${ent.scanned_at ? "Scanned " + fmtTime(ent.scanned_at) : "Unassessed"}</div></div>
      <div class="kv"><div class="k">VLAN</div><div class="v">${esc(ent.network_name || "-")}</div></div>
      <div class="kv"><div class="k">Physical Link</div><div class="v">${portEnt
        ? `<button class="btn sm" onclick="selectEntity('${esc(portEnt.id)}')">${esc(portEnt.label)} →</button>`
        : (apEnt ? `<button class="btn sm" onclick="selectEntity('${esc(apEnt.id)}')">${esc(apEnt.label)} (${esc(ent.essid || "Wi-Fi")})</button>` : (ent.essid ? "Wi-Fi: " + esc(ent.essid) : "-"))}</div></div>`;
  } else if (ent.kind === "device") {
    body += `<div class="kv"><div class="k">Model</div><div class="v">${esc(ent.model || "-")}</div></div>
      <div class="kv"><div class="k">Firmware</div><div class="v mono">${esc(ent.firmware || "-")}</div></div>
      <div class="kv"><div class="k">Perimeter</div><div class="v">${esc(ent.side || "inside")}</div></div>
      <div class="kv"><div class="k">Role</div><div class="v">${esc(ent.role || "-")}</div></div>`;
  }
  body += `</div></div>`;

  // Connected Peers (for Port)
  if (ent.kind === "port" && ent.peer_ids && ent.peer_ids.length) {
    body += `<div class="ins-sec"><div class="ins-sec-t">Connected Peer(s)</div><div class="host-chips">`;
    for (const pid of ent.peer_ids) {
      const peer = vm.entities[pid];
      if (peer) {
        body += `<button class="btn sm" onclick="selectEntity('${esc(peer.id)}')">${esc(peer.label)} (${esc(peer.state_label)}) →</button>`;
      }
    }
    body += `</div></div>`;
  }

  // Exact CVEs FIRST when present (so vulnerable hosts never appear clean)
  if (ent.exact_cves && ent.exact_cves.length) {
    body += `<div class="ins-sec"><div class="ins-sec-t">Exact-Version CVEs (${ent.exact_cve_count})</div>`;
    for (const s of ent.exact_cves) {
      body += `<div class="reason-card v-exposed">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <strong>${esc(s.product.label)} ${esc(s.product.version || "")}</strong>
          ${vBadge("exposed", s.max_severity)}
        </div>
        <div class="sub" style="margin-top:3px;color:var(--text)">${s.total_cves} CVE(s) · max CVSS ${Number(s.max_cvss).toFixed(1)}${s.kev_count ? " · " + s.kev_count + " KEV" : ""}${s.min_fixed_version ? " · Upgrade ≥ " + esc(s.min_fixed_version) : ""}</div>
        <div class="sub mono" style="margin-top:3px">${esc((s.top_cves || []).join(", "))}</div>
      </div>`;
    }
    body += `</div>`;
  }

  // Evidenced Reasons (Expected vs Observed + Proof + Action)
  const nonCVEReasons = (ent.reasons || []).filter(r => r.kind !== "cve");
  if (nonCVEReasons.length) {
    body += `<div class="ins-sec"><div class="ins-sec-t">Assessments &amp; Findings (${nonCVEReasons.length})</div>`;
    for (const r of nonCVEReasons) {
      body += `<div class="reason-card v-${esc(r.state)}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <span class="mono sub">${esc(r.ref)}${r.port ? " :" + r.port : ""}</span>
          ${vBadge(r.state, r.severity)}
        </div>
        <div style="font-weight:700;margin-top:3px">${esc(r.title)}</div>
        ${(r.expected || r.observed) ? `<div class="ea-pair">
          <div><b>Observed</b>${esc(r.observed || "-")}</div>
          <div><b>Expected</b>${esc(r.expected || "-")}</div>
        </div>` : ""}
        ${r.evidence ? `<div class="sub" style="margin-top:5px;color:var(--text-2)">${esc(r.evidence)}</div>` : ""}
        ${r.remediation ? `<div class="sub" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border)"><strong>Fix:</strong> ${esc(r.remediation)}</div>` : ""}
        <div class="sub" style="margin-top:3px">Source: <span class="mono">${esc(r.source)}</span></div>
      </div>`;
    }
    body += `</div>`;
  } else if (!(ent.exact_cves && ent.exact_cves.length)) {
    body += `<div class="ins-sec"><div class="reason-card">${vBadge(ent.state, ent.state_label)} <span class="sub" style="margin-left:6px">${ent.state === "unknown" ? "Host has not been actively probed yet." : "Zero active policy or service violations."}</span></div></div>`;
  }

  // Services with Computed Reachability
  if (ent.services && ent.services.length) {
    body += `<div class="ins-sec"><div class="ins-sec-t">Services &amp; Reachability (${ent.services.length})</div><div class="host-chips">`;
    for (const svc of ent.services) {
      const cls = svc.exposed ? "v-exposed" : (svc.reachable === "wan" ? "v-review" : "");
      body += `<span class="ctrl-chip ${cls}"><span class="mono">${esc(svc.label || (svc.proto + ":" + svc.port))}</span> · ${esc(svc.reachable)}</span>`;
    }
    body += `</div></div>`;
  }

  // Potential CVEs (version-unknown -> Review)
  if (ent.potential_cves && ent.potential_cves.length) {
    body += `<div class="ins-sec"><div class="ins-sec-t">Patch Verification — Version Unknown (${ent.potential_cves.length})</div>`;
    for (const s of ent.potential_cves) {
      body += `<div class="reason-card v-review">
        <strong>${esc(s.product.label)}</strong> · ${s.total_cves} CVE(s) (max CVSS ${Number(s.max_cvss).toFixed(1)})
        <div class="sub mono" style="margin-top:2px">${esc((s.top_cves || []).join(", "))}</div>
      </div>`;
    }
    body += `</div>`;
  }

  return `
    <div class="rail-hd">
      <button class="btn sm" onclick="popInspector()">${backLbl}</button>
      <div style="display:flex;gap:6px">
        ${!isStaticMode && ent.kind === "host" && ent.ip ? `<button class="btn sm" onclick="triggerRescan('${esc(ent.ip)}')">Rescan</button>` : ""}
        ${railStack.length > 1 ? `<button class="btn sm" onclick="clearInspector()">Queue</button>` : ""}
      </div>
    </div>
    <div class="rail-body">${body}</div>`;
}

/* ============================================================================
   TAB 2: INVENTORY (SINGLE TABLE PROJECTION OVER GO ENTITIES)
   ============================================================================ */
function renderInventory() {
  const vm = state.view;
  if (!vm) return;

  const list = Object.values(vm.entities || {}).filter(ent => {
    if (ent.kind !== "host" && ent.kind !== "device" && !(ent.kind === "port" && ent.state !== "ok")) return false;
    if (!matchesFilter(ent)) return false;
    if (invSearch) {
      const hay = [ent.label, ent.ip, ent.mac, ent.network_name, ent.role, ent.vendor, ent.model, ent.state_label, (ent.reasons || []).map(r => r.ref + " " + r.title).join(" ")].join(" ").toLowerCase();
      if (!hay.includes(invSearch.toLowerCase())) return false;
    }
    return true;
  }).sort((a, b) => {
    const sr = { exposed: 3, review: 2, unknown: 1, ok: 0 };
    if ((sr[b.state] || 0) !== (sr[a.state] || 0)) return (sr[b.state] || 0) - (sr[a.state] || 0);
    if ((b.is_bmc ? 1 : 0) !== (a.is_bmc ? 1 : 0)) return (b.is_bmc ? 1 : 0) - (a.is_bmc ? 1 : 0);
    return (a.label || "").localeCompare(b.label || "");
  });

  document.getElementById("view-inventory").innerHTML = `
    <div class="toolbar">
      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
        <input id="inv-search" class="search" type="search" value="${esc(invSearch)}" placeholder="Filter name, IP, MAC, VLAN, role, CVE…">
        <span class="sub">${list.length} matching entities</span>
      </div>
      <div class="census-bar">
        <button class="cfilter ${activeFilter === "all" ? "active" : ""}" onclick="setFilter('all')">All</button>
        <button class="cfilter ${activeFilter === "bmc" ? "active" : ""}" onclick="setFilter('bmc')">⬡ BMCs</button>
        <button class="cfilter ${activeFilter === "cve" ? "active" : ""}" onclick="setFilter('cve')">Exact CVEs</button>
        <button class="cfilter ${activeFilter === "exposed" ? "active" : ""}" onclick="setFilter('exposed')">Exposed</button>
        <button class="cfilter ${activeFilter === "unassessed" ? "active" : ""}" onclick="setFilter('unassessed')">Unassessed</button>
        <button class="cfilter ${activeFilter === "outside" ? "active" : ""}" onclick="setFilter('outside')">Outside</button>
        <button class="cfilter ${activeFilter === "devices" ? "active" : ""}" onclick="setFilter('devices')">UniFi Gear</button>
      </div>
    </div>
    <div class="tbl-card">
      <table>
        <thead><tr><th>Verdict</th><th>Entity</th><th>Role</th><th>IP / Address</th><th>VLAN / Side</th><th>Evidence Summary</th></tr></thead>
        <tbody>
          ${list.length ? list.map(ent => {
            const summary = ent.exact_cve_count
              ? `${ent.exact_cve_count} exact CVE(s)` + ((ent.reasons || []).filter(r => r.kind !== "cve").length ? ` + ${(ent.reasons || []).filter(r => r.kind !== "cve").length} check(s)` : "")
              : ((ent.reasons && ent.reasons.length) ? ent.reasons[0].title : (ent.state === "unknown" ? "Not yet scanned" : "No findings"));
            return `<tr class="clickable" onclick="selectEntity('${esc(ent.id)}', true)">
              <td>${vBadge(ent.state, ent.state_label)}</td>
              <td>${ent.is_bmc ? `<span class="oob-hex v-${esc(ent.state)}">OOB</span> ` : ""}<strong>${esc(ent.label)}</strong><div class="sub mono">${esc(ent.mac || ent.id)}</div></td>
              <td>${esc(ent.role || ent.kind)}${ent.vendor ? `<div class="sub">${esc(ent.vendor)}</div>` : ""}</td>
              <td class="mono">${esc(ent.ip || "-")}</td>
              <td>${esc(ent.network_name || "-")}${ent.side === "outside" ? ` <span class="wall-notch">OUT</span>` : ""}</td>
              <td class="sub" style="color:var(--text-2)">${esc(summary)}</td>
            </tr>`;
          }).join("") : `<tr><td colspan="6" style="text-align:center;padding:24px" class="muted">No matching entities.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  const el = document.getElementById("inv-search");
  if (el) {
    el.addEventListener("input", e => {
      const pos = e.target.selectionStart;
      invSearch = e.target.value;
      renderInventory();
      const again = document.getElementById("inv-search");
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    });
  }
}

/* ============================================================================
   TAB 3: ACTIVITY (UNIFIED LIVE SSE + 24H CONTROLLER LOGS WITH ENTITY LINKS)
   ============================================================================ */
function renderActivity() {
  const vm = state.view || { entities: {} };
  const logs = [];
  const seen = new Set();
  for (const ev of (state.events || [])) {
    logs.push({ time: ev.time, severity: ev.severity || "info", type: ev.type || "event", summary: ev.summary, subject: ev.subject_id || "", ip: ev.ip || "", src: "live" });
    seen.add(ev.summary);
  }
  for (const lg of (state.report?.unifi_posture?.recent_logs || [])) {
    if (seen.has(lg.message)) continue;
    let t = "controller";
    if (lg.category === "ADMIN") t = "admin_activity";
    else if ((lg.event || "").includes("HONEYPOT")) t = "honeypot_hit";
    else if (lg.category === "SECURITY" || (lg.event || "").includes("THREAT")) t = "ids_threat";
    logs.push({ time: lg.timestamp, severity: lg.severity || "info", type: t, summary: lg.message || lg.event, subject: "", ip: lg.src_ip || "", src: "unifi-24h" });
  }
  logs.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));

  const filtered = logs.filter(ev => {
    const t = ev.type.toLowerCase();
    if (actFilter === "threats") return t.includes("threat") || t.includes("honeypot") || t.includes("evil") || t.includes("tamper") || t.includes("surge") || t.includes("spike") || t.includes("finding");
    if (actFilter === "ports") return t.startsWith("port_");
    if (actFilter === "clients") return t.startsWith("client_") || t.startsWith("vpn_") || t.includes("host_scanned");
    if (actFilter === "admin") return t.includes("admin") || t.includes("policy") || t.includes("config") || t.includes("wan_");
    return true;
  });

  // Resolve IP -> entity ID when subject_id absent so rows stay clickable!
  const entByIP = {};
  for (const e of Object.values(vm.entities || {})) {
    if (e.ip && (e.kind === "host" || e.kind === "device")) entByIP[e.ip] = e.id;
  }

  document.getElementById("view-activity").innerHTML = `
    <div class="toolbar">
      <div class="census-bar">
        ${[["all", "All (" + logs.length + ")"], ["threats", "Threats & Tamper"], ["ports", "Physical Ports"], ["clients", "Clients & VPN"], ["admin", "Admin & Config"]].map(([k, lbl]) =>
          `<button class="cfilter ${actFilter === k ? "active" : ""}" onclick="actFilter='${k}'; renderActivity()">${lbl}</button>`
        ).join("")}
      </div>
      <span class="sub">Click any linked row to locate on Map</span>
    </div>
    <div class="tbl-card">
      <table>
        <thead><tr><th>Time</th><th>Severity</th><th>Type</th><th>Event</th><th>Source</th></tr></thead>
        <tbody>
          ${filtered.length ? filtered.map(ev => {
            const target = ev.subject || (ev.ip ? entByIP[ev.ip] : "") || "";
            const click = target ? `class="clickable" onclick="selectEntity('${esc(target)}', true)"` : "";
            const st = (ev.severity === "critical" || ev.severity === "high") ? "exposed" : (ev.severity === "medium" ? "review" : "ok");
            return `<tr ${click}>
              <td class="mono sub" style="white-space:nowrap">${fmtTime(ev.time)}</td>
              <td>${vBadge(st, ev.severity)}</td>
              <td class="mono">${esc(ev.type)}</td>
              <td>${esc(ev.summary)}${target ? ` <span class="sub">→</span>` : ""}</td>
              <td class="sub">${esc(ev.src)}</td>
            </tr>`;
          }).join("") : `<tr><td colspan="5" style="text-align:center;padding:24px" class="muted">No events in this category.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function renderAll() {
  if (!state) return;
  renderHeaderAndBar();
  if (activeTab === "map") renderMap();
  else if (activeTab === "inventory") renderInventory();
  else if (activeTab === "activity") renderActivity();
}

async function fetchState() {
  if (isStaticMode) return;
  const r = await fetch("/api/state", {cache: "no-store"});
  if (!r.ok) return;
  state = await r.json();
  applyHash();
  renderAll();
}

async function triggerRescan(ip) {
  if (isStaticMode) return;
  const url = ip ? ("/api/rescan?ip=" + encodeURIComponent(ip)) : "/api/rescan";
  await fetch(url, {method: "POST"});
  setTimeout(fetchState, 600);
}

function connectSSE() {
  if (isStaticMode) return;
  const es = new EventSource("/api/events");
  es.addEventListener("uniblue", () => fetchState());
  es.onerror = () => { document.getElementById("mode-lbl").textContent = "Reconnecting…"; };
  es.onopen = () => fetchState();
}

// Boot: check for offline baked state (from `uniblue topology -out topology.html`) first!
const staticEl = document.getElementById("uniblue-static-state");
if (staticEl && staticEl.textContent.trim()) {
  isStaticMode = true;
  state = JSON.parse(staticEl.textContent);
  applyHash();
  renderAll();
} else {
  fetchState();
  connectSSE();
  setInterval(fetchState, 15000);
}
</script>
</body>
</html>
