          : `inspectClient('${esc(peer.ip || "")}','${esc((peer.mac || "").toLowerCase())}')`;
        b += `<div class="finding-box" style="cursor:pointer" onclick="${onclick}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong>${isDev ? "🔀 " : "💻 "}${esc(peer.name)}</strong>
            <span class="chip blue">Inspect ${isDev ? "Switch" : "Host"} →</span>
          </div>
          <div class="subtext mono" style="margin-top:3px">${peer.ip ? esc(peer.ip) + " · " : ""}${esc(peer.mac)}${peer.vlan ? " · VLAN " + esc(peer.vlan) : ""}</div>
        </div>`;
      }
    }
    b += `</div>`;

    // Security Findings & Exact Remediation
    b += `<div class="drawer-sec"><div class="drawer-sec-title">Security Assessment &amp; Fix</div>`;
    if (pFindings.length) {
      for (const f of pFindings) {
        b += `<div class="finding-box ${f.effective_severity === "critical" ? "crit" : "high"}">
          <div>${sevBadge(f.effective_severity)} <span class="mono subtext">${esc(f.check_id)}</span></div>
          <div class="ftitle">${esc(f.title)}</div>
          <div class="fproof"><strong>Proof:</strong> ${esc(f.evidence)}</div>
          ${f.remediation?.summary ? `<div class="faction"><strong>How to fix in UniFi:</strong> ${esc(f.remediation.summary)}</div>` : ""}
        </div>`;
      }
    } else if (p.issues && p.issues.length) {
      b += `<div class="finding-box high">
        <div class="ftitle">Port Observations</div>
        <div class="fproof">${p.issues.map(esc).join("<br>")}</div>
      </div>`;
    } else {
      b += `<div class="finding-box" style="border-color:var(--ok-bd)">${sevBadge("clean")} <strong>Port configuration looks good.</strong></div>`;
    }
    b += `</div>`;
    bodyEl.innerHTML = b;
    return;
  }

  if (drawerState.kind === "client") {
    const cv = idx.clientByIP[drawerState.ip] || idx.clientByMAC[drawerState.mac];
    const cl = cv?.client || { ip: drawerState.ip, mac: drawerState.mac, name: drawerState.ip || drawerState.mac };
    const hostF = idx.findingsByIP[cl.ip] || [];
    const hostWAN = idx.wanByIP[cl.ip] || [];
    const hostExact = idx.exactCVEsByIP[cl.ip] || [];
    const hostPot = idx.potCVEsByIP[cl.ip] || [];
    const portLink = getClientPortLink(cl);
    const maxSev = cv?.max_severity || (hostF.length ? maxSevOf(hostF) : "clean");

    titleEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${sevBadge(maxSev)}
        ${cl.network_name ? `<span class="pill">${esc(cl.network_name)}</span>` : ""}
        ${cl.ip ? `<button class="btn sm" onclick="triggerRescan('${esc(cl.ip)}')">Rescan Host</button>` : ""}
      </div>
      <div style="font-size:16px;font-weight:800;margin-top:6px">${esc(cl.name || cl.hostname || cl.ip || cl.mac)}</div>
      <div class="subtext mono">${esc(cl.ip || "-")} · ${esc(cl.mac || "-")}</div>`;

    let b = `<div class="drawer-sec">
      <div class="drawer-sec-title">Identity &amp; Physical Attachment</div>
      <div class="kv-grid">
        <div class="kv"><div class="k">Category / Role</div><div class="v">${esc(cv?.class?.category || "unknown")}${cv?.class?.role ? " · " + esc(cv.class.role) : ""}</div></div>
        <div class="kv"><div class="k">Hardware Vendor</div><div class="v">${esc(cv?.class?.vendor || cl.oui || "-")}</div></div>
        <div class="kv"><div class="k">VLAN / Network</div><div class="v">${esc(cl.network_name || "-")}</div></div>
        <div class="kv"><div class="k">Physical Link</div><div class="v">${portLink
          ? `<span class="chip ${portLink.port.status === "critical" ? "crit" : ""}" onclick="inspectPort('${esc(portLink.sw.mac)}',${portLink.port.port_idx})">🔌 ${esc(portLink.sw.name)} #${portLink.port.port_idx}</span>`
          : (cl.essid ? "📶 Wi-Fi: " + esc(cl.essid) : (cl.is_wired ? "Wired" : "Wi-Fi"))}</div></div>
      </div>
    </div>`;

    if (cv?.open_ports && cv.open_ports.length) {
      b += `<div class="drawer-sec"><div class="drawer-sec-title">Open TCP Ports (${cv.open_ports.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${cv.open_ports.map(p => `<span class="pill mono">:${p}</span>`).join("")}</div>
      </div>`;
    }

    if (hostWAN.length) {
      b += `<div class="drawer-sec"><div class="drawer-sec-title">WAN Port Forwards (${hostWAN.length})</div>`;
      for (const a of hostWAN) {
        b += `<div class="finding-box ${sevRank(a.severity) >= 2 ? "high" : ""}">
          <div>${sevBadge(a.severity)} <strong>${esc(a.forward?.name)}</strong></div>
          <div class="fproof mono">${esc(a.forward?.proto)}:${esc(a.forward?.dst_port)} → ${esc(a.forward?.fwd_ip)}:${esc(a.forward?.fwd_port)}</div>
          <div class="subtext" style="margin-top:3px">${esc(a.rule_name)}</div>
        </div>`;
      }
      b += `</div>`;
    }

    b += `<div class="drawer-sec"><div class="drawer-sec-title">Confirmed Exposures (${hostF.length})</div>`;
    if (!hostF.length) {
      b += `<div class="finding-box" style="border-color:var(--ok-bd)">${sevBadge("clean")} <strong>No unauthenticated services or exposures detected on this host.</strong></div>`;
    } else {
      for (const f of hostF) {
        b += `<div class="finding-box ${f.effective_severity === "critical" ? "crit" : f.effective_severity === "high" ? "high" : ""}">
          <div>${sevBadge(f.effective_severity)} <span class="mono subtext">${esc(f.check_id)}${f.port ? " · port " + f.port : ""}</span></div>
          <div class="ftitle">${esc(f.title)}</div>
          <div class="fproof"><strong>Proof:</strong> ${esc(f.evidence)}</div>
          ${f.risk_reasons?.length ? `<div class="subtext" style="margin-top:4px"><strong>Blast Radius:</strong> ${esc(f.risk_reasons.join("; "))}</div>` : ""}
          ${f.remediation?.summary ? `<div class="faction"><strong>Remediation:</strong> ${esc(f.remediation.summary)}</div>` : ""}
        </div>`;
      }
    }
    b += `</div>`;

    if (hostExact.length || hostPot.length) {
      b += `<div class="drawer-sec"><div class="drawer-sec-title">CVE Rollups (${hostExact.length} exact · ${hostPot.length} version-unknown)</div>`;
      for (const s of [...hostExact, ...hostPot]) {
        b += `<div class="finding-box">
          <div>${sevBadge(s.max_severity)} <strong>${esc(s.product.label)} ${esc(s.product.version || "")}</strong></div>
          <div class="fproof">${s.total_cves} CVE(s) (max CVSS ${Number(s.max_cvss).toFixed(1)}${s.kev_count ? ", " + s.kev_count + " KEV" : ""})</div>
          <div class="subtext mono" style="margin-top:3px">${esc((s.top_cves || []).join(", "))}</div>
        </div>`;
      }
      b += `</div>`;
    }

    bodyEl.innerHTML = b;
    return;
  }

  if (drawerState.kind === "device") {
    const sw = idx.swByMAC[drawerState.mac];
    if (!sw) { closeDrawer(); return; }
    const riskPorts = (sw.ports || []).filter(p => p.status === "critical" || p.status === "warn");

    titleEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${sw.external_device ? sevBadge("critical", "EXTERNAL EQUIPMENT") : sevBadge("blue", "INSIDE INFRASTRUCTURE")}
      </div>
      <div style="font-size:16px;font-weight:800;margin-top:6px">${esc(sw.name)}</div>
      <div class="subtext">${esc(sw.model)} · <span class="mono">${esc(sw.ip)}</span> · <span class="mono">${esc(sw.mac)}</span></div>`;

    let b = `<div class="drawer-sec">
      <div class="drawer-sec-title">Switch Summary</div>
      <div class="kv-grid">
        <div class="kv"><div class="k">Uplink</div><div class="v">${sw.uplink_name ? esc(sw.uplink_name) + (sw.uplink_port ? " #" + sw.uplink_port : "") : "Root Gateway"}</div></div>
        <div class="kv"><div class="k">Perimeter Zone</div><div class="v">${sw.external_device ? "Outside (" + esc(sw.zone_source || "auto") + ")" : "Inside Building"}</div></div>
        <div class="kv"><div class="k">Active / Open / Off</div><div class="v">${sw.active_ports} / ${sw.inactive_enabled_ports} / ${sw.disabled_ports}</div></div>
        <div class="kv"><div class="k">At-Risk Ports</div><div class="v" style="color:${sw.at_risk_ports ? "var(--crit)" : "var(--ok)"}">${sw.at_risk_ports}</div></div>
      </div>
    </div>`;

    b += `<div class="drawer-sec"><div class="drawer-sec-title">At-Risk Ports (${riskPorts.length})</div>`;
    if (!riskPorts.length) {
      b += `<div class="finding-box" style="border-color:var(--ok-bd)">${sevBadge("clean")} <strong>All ports on this device look good.</strong></div>`;
    } else {
      for (const p of riskPorts) {
        b += `<div class="finding-box ${p.status === "critical" ? "crit" : "high"}" style="cursor:pointer" onclick="inspectPort('${esc(sw.mac)}',${p.port_idx})">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span>${sevBadge(p.status === "critical" ? "critical" : "high")} <strong>Port #${p.port_idx}</strong> (${esc(p.zone)})</span>
            <span class="chip">Inspect →</span>
          </div>
          <div class="fproof">${(p.issues || []).map(esc).join("; ")}</div>
        </div>`;
      }
    }
    b += `</div>`;
    bodyEl.innerHTML = b;
    return;
  }

  if (drawerState.kind === "finding") {
    const f = idx.allFindings.find(x => x.check_id === drawerState.checkID && (x.client?.ip || "") === drawerState.ip && (x.port || 0) === drawerState.port)
      || idx.allFindings.find(x => x.check_id === drawerState.checkID);
    if (!f) { closeDrawer(); return; }
    titleEl.innerHTML = `
      <div>${sevBadge(f.effective_severity)} <span class="mono subtext">${esc(f.check_id)}</span></div>
      <div style="font-size:16px;font-weight:800;margin-top:6px">${esc(f.title)}</div>
      <div class="subtext">${esc(f.client?.name || "-")} · <span class="mono">${esc(f.client?.ip || "-")}</span></div>`;
    bodyEl.innerHTML = `<div class="finding-box ${f.effective_severity === "critical" ? "crit" : "high"}">
      <div class="fproof"><strong>Proof:</strong> ${esc(f.evidence)}</div>
      ${f.risk_reasons?.length ? `<div class="subtext" style="margin-top:6px"><strong>Blast Radius:</strong> ${esc(f.risk_reasons.join("; "))}</div>` : ""}
      ${f.remediation?.summary ? `<div class="faction"><strong>How to fix:</strong> ${esc(f.remediation.summary)}</div>` : ""}
    </div>`;
  }
}

function connectSSE() {
  const es = new EventSource("/api/events");
  es.addEventListener("uniblue", () => fetchState());
  es.onerror = () => {
    document.getElementById("live-pill").classList.remove("live");
    document.getElementById("mode-lbl").textContent = "Reconnecting…";
  };
  es.onopen = () => {
    document.getElementById("live-pill").classList.add("live");
    fetchState();
  };
}

fetchState();
connectSSE();
setInterval(fetchState, 15000);
</script>
</body>
</html>
